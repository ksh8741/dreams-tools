$('duplicateFrame').onclick=()=>{if(frames.length>=12)return;stash();frames.splice(index+1,0,{...applied,marks:(applied.marks||[]).map(m=>({...m}))});index++;applied=frames[index];frameButtons();sync();save()};
$('deleteFrame').onclick=()=>{if(frames.length<2)return;drafts.delete(applied);frames.splice(index,1);index=Math.min(index,frames.length-1);applied=frames[index];frameButtons();sync();save()};
function rowTools(){const box=$('rowTools');box.replaceChildren();const rows=S.parseRows($('rows').value);rows.forEach((r,i)=>{const line=document.createElement('div');line.className='rowTool';const text=document.createElement('span');text.textContent=r.blank?'— 빈 줄 —':(r.amount?r.amount+' ':'')+r.text;line.append(text);for(const[key,label]of [['new','NEW'],['hot','HOT']]){const b=document.createElement('button');b.type='button';b.textContent=label;b.disabled=!!r.blank;b.setAttribute('aria-pressed',String(!!draftMarks[i]?.[key]));b.onclick=()=>{const enabled=!draftMarks[i]?.[key];draftMarks[i]={new:false,hot:false,[key]:enabled};rowTools();live()};line.append(b)}box.append(line)})}
$('rows').addEventListener('input',()=>{const old=S.parseRows(markRows),next=S.parseRows($('rows').value),pool=new Map();old.forEach((r,i)=>{const key=JSON.stringify(r);if(!pool.has(key))pool.set(key,[]);pool.get(key).push(draftMarks[i]||{})});draftMarks=next.map(r=>({...pool.get(JSON.stringify(r))?.shift()}));markRows=$('rows').value;rowTools();live()});
for(const t of S.TEMPLATES){const option=document.createElement('option');option.value=t.id;option.textContent=t.name;$('style').append(option)}
$('style').addEventListener('input',()=>{selected=$('style').value;live()});
const automatic=document.createElement('option');automatic.value='auto';automatic.textContent='스타일 기본';$('fontFamily').append(automatic);for(const f of S.FONTS){const option=document.createElement('option');option.value=f.id;option.textContent=f.name;$('fontFamily').append(option)}
$('fontFamily').addEventListener('input',live);

// One deliberate wheel step per tick; prevent page scrolling while selecting.
for(const id of ['style','fontFamily','decoration','titleAlign','emoji','titleEmoji']){const select=$(id);let lastWheel=-Infinity;select.addEventListener('wheel',e=>{if(!e.deltaY||e.ctrlKey)return;e.preventDefault();const now=performance.now();if(now-lastWheel<110)return;lastWheel=now;const options=Array.from(select.options).filter(o=>!o.disabled),at=options.findIndex(o=>o.value===select.value),next=Math.max(0,Math.min(options.length-1,at+(e.deltaY>0?1:-1)));if(next===at)return;select.value=options[next].value;select.dispatchEvent(new Event('input',{bubbles:true}));select.dispatchEvent(new Event('change',{bubbles:true}))},{passive:false})}
$('editor').onsubmit=e=>e.preventDefault();
for(const id of ['title','titleAlign','decoration','emoji','titleEmoji'])$(id).addEventListener('input',()=>{live()});
function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
let pngDownloadItems=[];
const zipCrcTable=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=(n>>>1)^((n&1)?0xedb88320:0);return n>>>0});
function zipCRC(bytes){let crc=0xffffffff;for(const b of bytes)crc=(crc>>>8)^zipCrcTable[(crc^b)&255];return(crc^0xffffffff)>>>0}
function pngZip(files){const parts=[],central=[];let offset=0,centralSize=0;for(const f of files){const name=new TextEncoder().encode(f.name),data=f.data,crc=zipCRC(data),local=new Uint8Array(30+name.length),lv=new DataView(local.buffer);lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(12,33,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,name.length,true);local.set(name,30);parts.push(local,data);const entry=new Uint8Array(46+name.length),cv=new DataView(entry.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(14,33,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);entry.set(name,46);central.push(entry);centralSize+=entry.length;offset+=local.length+data.length}const end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'})}
$('downloadAllPng').onclick=async()=>{const button=$('downloadAllPng'),items=pngDownloadItems.slice();if(!items.length)return;button.disabled=true;$('download').disabled=true;try{const files=[];for(let i=0;i<items.length;i++){const blob=await new Promise(resolve=>items[i].canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG를 만들지 못했어요.');files.push({name:items[i].name,data:new Uint8Array(await blob.arrayBuffer())})}saveBlob(pngZip(files),'시그표_전체PNG.zip');status('')}catch(e){status(e.message)}finally{button.disabled=false;$('download').disabled=false}};
function closePngPicker(){$('pngPicker').close()}
$('closePngPicker').onclick=closePngPicker;
$('pngPicker').addEventListener('click',e=>{if(e.target!==$('pngPicker'))return;const r=$('pngPicker').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closePngPicker()});
for(const id of ['broadcastFontSize','broadcastFontValue'])$(id).addEventListener('input',()=>{const value=Number($(id).value);if(!Number.isFinite(value)||value<10||value>60)return;broadcastFontSize=value;draw();save()});
$('previewActual').onclick=()=>{const on=$('previewActual').getAttribute('aria-pressed')!=='true';$('previewActual').setAttribute('aria-pressed',String(on));$('broadcastStage').classList.toggle('actualSize',on);$('previewActual').textContent=on?'화면에 맞춤':'원본 크기'};
$('download').onclick=async()=>{const button=$('download');button.disabled=true;try{const snapshot=frames.map(f=>sanitize({...f,marks:(f.marks||[]).map(m=>({...m}))}));await allFonts(snapshot);const common=dimensions(snapshot),box=$('pngChoices');if(common.outputHeight*common.contentScale>1080)throw Error('내용이 1080px 높이를 넘습니다. 글씨 크기나 메뉴 행 수를 줄인 뒤 저장해주세요.');box.replaceChildren();pngDownloadItems=[];for(let i=0;i<snapshot.length;i++){const f=snapshot[i],card=document.createElement('button');card.type='button';card.className='pngChoice';card.setAttribute('aria-label','이미지 '+(i+1)+' PNG 다운로드');const thumb=document.createElement('div');thumb.className='pngThumb';const canvas=document.createElement('canvas');S.render(canvas,{...f,...common});pngDownloadItems.push({canvas,name:'시그표_'+String(i+1).padStart(2,'0')+'.png'});thumb.append(canvas);const info=document.createElement('div');info.className='pngInfo';const name=document.createElement('strong');name.textContent='이미지 '+(i+1);const label=document.createElement('span');label.textContent=S.parseRows(f.rows).find(r=>!r.blank)?.text||f.title.trim()||'빈 이미지';const size=document.createElement('small');size.textContent=canvas.width+' × '+canvas.height+'px';info.append(name,label,size);card.append(thumb,info);card.onclick=async()=>{card.disabled=true;try{const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG를 만들지 못했어요.');saveBlob(blob,'시그표_'+String(i+1).padStart(2,'0')+'.png');closePngPicker();status('')}catch(e){status(e.message)}finally{card.disabled=false}};box.append(card)}$('pngPicker').showModal()}catch(e){status(e.message)}finally{button.disabled=false}};
frameButtons();sync();allFonts().then(draw).catch(e=>status(e.message));
})();
</script></body></html>
