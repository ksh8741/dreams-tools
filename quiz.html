]</script><script>
'use strict';
const BANK=JSON.parse(document.getElementById('questionData').textContent),$=id=>document.getElementById(id);const KEY='yoning_quiz_v1';let deck=[],round=[],index=0,answers=[],locked=false,reviewMode=false,best=0;
function randomInt(n){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1),limit=4294967296-4294967296%n;do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}return Math.floor(Math.random()*n)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');best=Number.isFinite(saved.best)?Math.max(0,Math.min(100,saved.best)):0;deck=Array.isArray(saved.deck)?[...new Set(saved.deck)].filter(id=>BANK.some(q=>q.id===id)):[]}catch(_){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({best,deck}))}catch(_){}}
function setView(id){for(const v of ['intro','play','result'])$(v).hidden=v!==id;$('best').textContent=best?'최고 기록 '+best+'점':''}
function sample(n){const ids=[];while(ids.length<n){if(!deck.length)deck=shuffle(BANK.map(q=>q.id).filter(id=>!ids.includes(id)));const id=deck.pop();if(!ids.includes(id))ids.push(id)}save();return ids.map(id=>BANK.find(q=>q.id===id))}
function begin(qs,isReview=false){reviewMode=isReview;round=qs.map(q=>({...q,options:shuffle([q.answer,...q.wrong])}));index=0;answers=[];setView('play');showQuestion()}
function showQuestion(){locked=false;const q=round[index];$('category').textContent=(reviewMode?'오답 복습 · ':'')+q.category;$('counter').textContent=String(index+1).padStart(2,'0')+' / '+round.length;$('question').textContent=q.q;$('bar').style.width=(index/round.length*100)+'%';$('progress').setAttribute('aria-valuenow',String(Math.round(index/round.length*100)));$('feedback').hidden=true;$('options').replaceChildren();q.options.forEach((text,i)=>{const b=document.createElement('button');b.className='option';const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[i];const label=document.createElement('span');label.textContent=text;b.append(letter,label);b.onclick=()=>choose(text);$('options').appendChild(b)});$('question').focus({preventScroll:true})}
function choose(value){if(locked)return;locked=true;const q=round[index],correct=value===q.answer;answers.push({q,value,correct});Array.from($('options').children).forEach((b,i)=>{b.disabled=true;const t=q.options[i];if(t===q.answer)b.classList.add('correct');else if(t===value)b.classList.add('wrong')});$('verdict').textContent=correct?'정답이에요!':'정답은 '+q.answer;$('explanation').textContent=q.explanation;$('feedback').hidden=false;$('next').textContent=index===round.length-1?'결과 확인하기 →':'다음 문제 →';$('bar').style.width=((index+1)/round.length*100)+'%';$('progress').setAttribute('aria-valuenow',String(Math.round((index+1)/round.length*100)))}
function getRating(right,total){const rate=right/total;return rate===1?{title:'닝잘알 만렙',message:'요닝 본인도 인정할 지식!'}:rate>=.9?{title:'찐 닝잘알',message:'이 정도면 요닝 백과사전.'}:rate>=.7?{title:'제법 닝잘알',message:'요닝 이야기, 꽤 많이 알고 있네요!'}:rate>=.4?{title:'닝잘알 성장 중',message:'아는 이야기 반, 알아갈 이야기 반!'}:right>0?{title:'새싹 닝잘알',message:'이제 요닝을 알아가는 중이에요.'}:{title:'오늘부터 요닝 입문',message:'오늘 새로 알게 된 이야기부터 기억해 봐요!'}}
function finish(){const right=answers.filter(a=>a.correct).length,score=Math.round(right/round.length*100);if(!reviewMode){best=Math.max(best,score);save()}setView('result');$('score').textContent=score;const rating=getRating(right,round.length);$('resultTitle').textContent=rating.title;$('resultText').textContent=(reviewMode?'오답 복습 · ':'')+round.length+'문제 중 '+right+'문제 정답 · '+rating.message;const wrong=answers.filter(a=>!a.correct);$('retry').hidden=wrong.length===0;$('review').replaceChildren();$('review').hidden=!wrong.length;if(wrong.length){const h=document.createElement('h3');h.textContent='놓친 이야기 '+wrong.length;$('review').appendChild(h);for(const a of wrong){const article=document.createElement('article'),title=document.createElement('b'),detail=document.createElement('p');title.textContent=a.q.q;detail.textContent='내 답: '+a.value+' · 정답: '+a.q.answer+'\n'+a.q.explanation;article.append(title,detail);$('review').appendChild(article)}}}
$('start').onclick=()=>begin(sample(Number($('count').value)));$('next').onclick=()=>{if(!locked)return;if(index+1===round.length)finish();else{index++;showQuestion()}};$('again').onclick=()=>begin(sample(Number($('count').value)));$('retry').onclick=()=>begin(shuffle(answers.filter(a=>!a.correct).map(a=>a.q)),true);$('home').onclick=$('quit').onclick=()=>setView('intro');setView('intro');
</script></body></html>
