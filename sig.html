</style></head><body><iframe class="nav" src="navbar.html" title="상단 메뉴" scrolling="no"></iframe><main><header><h1>시그표</h1><button class="download" id="download">투명 PNG 다운로드 ↓</button></header><div class="workspace"><form class="panel" id="editor"><h2>템플릿</h2><div class="templates" id="templates"></div><label for="title">고정메뉴</label><textarea id="title" rows="2" maxlength="180" placeholder="고정메뉴"></textarea><label for="rows">메뉴</label><textarea id="rows" maxlength="8000" spellcheck="false" placeholder="100 하트 보내기&#10;1000 노래 한 곡"></textarea><p class="hint">가격 + 공백 + 메뉴 · 한 줄에 한 항목</p><button id="apply" class="apply" type="submit">적용</button><p id="status" class="status" aria-live="polite"></p></form><section class="previewPanel"><div class="previewHeader"><b>미리보기</b><span id="dimensions"></span></div><div class="stage"><canvas id="preview" aria-label="시그표 미리보기"></canvas></div></section></div></main><script>(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.SigTable=factory()})(typeof globalThis!=='undefined'?globalThis:this,function(){'use strict';

const clamp=(n,min,max)=>Math.max(min,Math.min(max,Number(n)||min));

function line(ctx,x1,y1,x2,y2,color,width=1){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}

function layout(ctx,input){const state=normalize(input),preset=TEMPLATES.find(t=>t.id===state.template),f=FONTS.find(f=>f.id===state.font),t={...preset,...f},width=state.width,pad=Math.max(16,width*.055),gap=22,cols=state.columns,colWidth=(width-pad*2-gap*(cols-1))/cols,size=state.size;const top=28;font(ctx,t,state.titleSize);const titleLines=state.title?wrap(ctx,String(state.title).slice(0,180),width-pad*2):[];const start=top+titleLines.length*state.titleSize*1.4+26;const rows=parseRows(state.rows),hasAmount=rows.some(r=>r.amount);font(ctx,t,size);const priceWidth=Math.min(ctx.measureText('99999').width,colWidth*.48),textWidth=colWidth-(hasAmount?priceWidth+14:0),perCol=Math.ceil(rows.length/cols),placed=[];let bottom=start;for(let c=0;c<cols;c++){let y=start;for(const r of rows.slice(c*perCol,(c+1)*perCol)){font(ctx,t,size);const lines=wrap(ctx,r.text||' ',Math.max(10,textWidth)),h=Math.max(size*1.45,lines.length*size*1.4)+10;placed.push({...r,x:pad+c*(colWidth+gap),y,h,lines});y+=h}bottom=Math.max(bottom,y)}font(ctx,t,state.footerSize);const footLines=state.footer?wrap(ctx,String(state.footer).slice(0,180),width-pad*2):[];const height=Math.ceil(bottom+35+footLines.length*state.footerSize*1.4+20);return{state,t,width,height,pad,cols,colWidth,priceWidth,textWidth,hasAmount,titleLines,start,bottom,placed,footLines,top}}

'use strict';
const S=window.SigTable,$=id=>document.getElementById(id),KEY='yoning_sig_table_simple_v1';
let applied={template:'ribbon',title:'고정메뉴',rows:'100 안녕하세요\n300 하트 보내기\n1000 노래 한 곡'},selected='ribbon',busy=false;
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&S.TEMPLATES.some(t=>t.id===old.template))applied={template:old.template,title:String(old.title||'').slice(0,180),rows:String(old.rows||'').slice(0,8000)}}catch(_){}
selected=applied.template;$('title').value=applied.title;$('rows').value=applied.rows;
function status(t){$('status').textContent=t}
function state(data){const t=S.TEMPLATES.find(t=>t.id===data.template)||S.TEMPLATES[0];return{...data,font:t.font,color:t.color,frame:t.frame,size:20,titleSize:20,footerSize:20,titleAlign:'left',columns:1,width:480,footer:''}}
async function loadFont(data){const f=S.FONTS.find(f=>f.id===state(data).font);if(document.fonts){await document.fonts.load(f.weight+' 20px "'+f.family+'"');if(!document.fonts.check(f.weight+' 20px "'+f.family+'"'))throw Error('글꼴을 불러오지 못했어요. 인터넷 연결을 확인해주세요.')}}
function draw(){const l=S.render($('preview'),state(applied));$('dimensions').textContent=l.width+' × '+l.height+'px'}
function selection(){for(const b of $('templates').children)b.setAttribute('aria-pressed',String(b.dataset.id===selected))}
for(const t of S.TEMPLATES){const b=document.createElement('button');b.type='button';b.className='template';b.dataset.id=t.id;b.style.setProperty('--color',t.color);b.style.setProperty('--sample',t.sample);const art=document.createElement('span');art.className='templateArt';art.textContent=t.frame==='ribbon'?'⋈':t.frame==='lace'?'❀':t.frame==='deco'?'◇':'Aa';const label=document.createElement('span');label.textContent=t.name;b.append(art,label);b.onclick=()=>{selected=t.id;selection()};$('templates').append(b)}
$('editor').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('apply').disabled=true;const next={template:selected,title:$('title').value.slice(0,180),rows:$('rows').value.slice(0,8000)};try{await loadFont(next);applied=next;draw();try{localStorage.setItem(KEY,JSON.stringify(applied));status('적용했어요.')}catch(_){status('적용했어요. 브라우저에는 저장하지 못했어요.')}}catch(e){status(e.message)}finally{busy=false;$('apply').disabled=false}};
$('download').onclick=async()=>{const b=$('download');b.disabled=true;try{await loadFont(applied);const c=document.createElement('canvas');S.render(c,state(applied));const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('이미지를 만들지 못했어요.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='시그표.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status('투명 PNG로 저장했어요.')}catch(e){status(e.message)}finally{b.disabled=false}};
