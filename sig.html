<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시그표 · 요닝 방송도구함</title><style>@font-face {

*{box-sizing:border-box}body{margin:0;background:#f5f4f1;color:#302a35;font-family:Arial,"Malgun Gothic",sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:2px solid #9b80af;outline-offset:3px}.nav{display:block;width:100%;height:58px;border:0;background:#0c0e11}main{max-width:1120px;margin:32px auto;padding:0 24px 40px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px}h1{font-size:27px;margin:0;letter-spacing:-1px}.download{padding:12px 16px;border:1px solid #ddd5e2;border-radius:10px;background:#fff;color:#665171;font-size:12px}.workspace{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;align-items:start}.panel{padding:22px;border:1px solid #e1dce4;border-radius:15px;background:white}h2,label{font-size:13px;font-weight:700}h2{margin:0 0 13px}.templates{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:26px}.template{padding:5px;border-radius:9px;background:#fff;border:1px solid #e1dce4;font-size:11px;line-height:1.8;color:#817485}.template[aria-pressed=true]{border:2px solid #8c709c;padding:4px;color:#4f3d5d}.templateArt{display:block;background:var(--sample);width:100%;height:auto;aspect-ratio:220/112;border-radius:5px;margin-bottom:4px}label{display:block;margin:20px 0 8px}textarea{display:block;width:100%;border:1px solid #e1dce4;border-radius:9px;padding:12px;color:#514757;font-size:13px;line-height:1.8;resize:vertical}#title{min-height:84px}#rows{min-height:260px}.hint{font-size:10px;line-height:1.7;color:#a191a6;margin:7px 0 0}.apply{width:100%;padding:14px;border:0;border-radius:9px;background:#49364f;color:#fff;margin-top:22px;font-weight:700;font-size:13px}.status{min-height:20px;font-size:11px;line-height:1.7;color:#8f709d;margin-bottom:0}.previewPanel{position:sticky;top:18px;border:1px solid #ddd7e3;border-radius:15px;overflow:hidden}.previewHeader{background:#fff;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.previewHeader span{font-size:10px;color:#a08fa7}.stage{padding:26px;max-height:78vh;overflow:auto;min-height:260px;background:repeating-conic-gradient(#34313a 0 25%,#27262b 0 50%) 0/24px 24px}canvas{display:block;max-width:100%;height:auto;margin:0 auto}@media(max-width:740px){main{padding:0 15px 30px;margin-top:24px}.workspace{grid-template-columns:1fr}.previewPanel{position:static}.stage{max-height:60vh}.panel{padding:20px}}
</style></head><body><iframe class="nav" src="navbar.html" title="상단 메뉴" scrolling="no"></iframe><main><header><h1>시그표</h1><button class="download" id="download">투명 PNG 다운로드 ↓</button></header><div class="workspace"><form class="panel" id="editor"><h2>템플릿</h2><div class="templates" id="templates"></div><label for="title">고정메뉴</label><textarea id="title" rows="2" maxlength="180" placeholder="고정메뉴"></textarea><label for="rows">메뉴</label><textarea id="rows" maxlength="8000" spellcheck="false" placeholder="100 하트 보내기&#10;1000 노래 한 곡"></textarea><p class="hint">가격 + 공백 + 메뉴 · 한 줄에 한 항목</p><button id="apply" class="apply" type="submit">적용</button><p id="status" class="status" aria-live="polite"></p></form><section class="previewPanel"><div class="previewHeader"><b>미리보기</b><span id="dimensions"></span></div><div class="stage"><canvas id="preview" aria-label="시그표 미리보기"></canvas></div></section></div></main><script>(function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.SigTable=factory()})(typeof globalThis!=='undefined'?globalThis:this,function(){'use strict';
const FONTS=[['jua','주아','Jua'],['gamja','감자꽃','Gamja Flower'],['gaegu','개구','Gaegu',700],['dongle','동글','Dongle',700],['pen','나눔손글씨 펜','Nanum Pen Script'],['brush','나눔손글씨 붓','Nanum Brush Script'],['melody','하이멜로디','Hi Melody'],['poor','푸어스토리','Poor Story'],['single','싱글데이','Single Day'],['cute','큐트','Cute Font'],['sunflower','해바라기','Sunflower',500],['dohyeon','도현','Do Hyeon'],['black','검은고딕','Black Han Sans'],['gugi','구기','Gugi'],['stylish','스타일리시','Stylish'],['yeon','연성','Yeon Sung'],['kirang','기랑해랑','Kirang Haerang'],['gowun','고운돋움','Gowun Dodum'],['nanum','나눔고딕','Nanum Gothic'],['noto','본고딕','Noto Sans KR']].map(([id,name,family,weight=400])=>({id,name,family,weight}));
const TEMPLATES=[
{id:'berry',name:'베리 돼지',font:'jua',color:'#ffa7b8',sample:'#735363',icon:'pig',header:'plain',accent:'#ff94b1',outline:'#30212c',text:'#fffafc'},
{id:'heart',name:'하트 팝',font:'jua',color:'#ffd0de',sample:'#7e5e74',icon:'heart',header:'badge',accent:'#ff8bb2',outline:'#29212d',text:'#ffffff'},
{id:'sugar',name:'슈가 핑크',font:'dohyeon',color:'#ffbad9',sample:'#4c4557',icon:'none',header:'plain',accent:'#ffacd0',outline:'#271e2b',text:'#fffafa'},
{id:'pastel',name:'별빛 캔디',font:'jua',color:'#ffe4a7',sample:'#648284',icon:'star',header:'pastel',accent:'#a3e7df',outline:'#59445b',text:'#fffefb'},
{id:'bunny',name:'토끼 라벨',font:'jua',color:'#eac9ef',sample:'#676378',icon:'bunny',header:'label',accent:'#f4b8d6',outline:'#302934',text:'#ffffff'},
{id:'rose',name:'로즈 잉크',font:'dohyeon',color:'#ffb5d2',sample:'#694959',icon:'none',header:'underline',accent:'#ff8eae',outline:'#2b222b',text:'#fff7fb'},
{id:'memo',name:'작은 메모',font:'jua',color:'#f6c3dc',sample:'#698480',icon:'flower',header:'memo',accent:'#b7e5dd',outline:'#302d35',text:'#fffbfe'}
];
function parseRows(text){return String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,80).map(s=>{const m=/^(\d[\d,]*\d)\s+([\s\S]*)$/.exec(s);return m?{amount:m[1].slice(0,24),text:m[2].slice(0,180)}:{amount:'',text:s.slice(0,180)}})}
function normalize(s={}){return{...s,template:TEMPLATES.some(t=>t.id===s.template)?s.template:'heart',title:String(s.title||'').slice(0,180),rows:String(s.rows||'').slice(0,8000)}}
function font(ctx,t,size){const f=FONTS.find(f=>f.id===t.font);ctx.font=f.weight+' '+size+'px "'+f.family+'","Malgun Gothic",sans-serif'}
function wrap(ctx,value,max){const lines=[];for(const part of String(value).split('\n')){let line='';for(const ch of Array.from(part)){if(line&&ctx.measureText(line+ch).width>max){lines.push(line.trimEnd());line=''}line+=ch}lines.push(line.trimEnd())}return lines}
function pathRound(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function heart(ctx,x,y,r,fill,stroke){ctx.save();ctx.beginPath();ctx.moveTo(x,y+r*.7);ctx.bezierCurveTo(x-r*1.5,y-r*.05,x-r*.8,y-r*1.3,x,y-r*.45);ctx.bezierCurveTo(x+r*.8,y-r*1.3,x+r*1.5,y-r*.05,x,y+r*.7);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.9;ctx.stroke()}ctx.restore()}
function star(ctx,x,y,r,fill,stroke){ctx.save();ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.46:r;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();ctx.restore()}
function icon(ctx,type,x,y,t){ctx.save();if(type==='heart')heart(ctx,x,y,6,t.accent,'#fff0f5');if(type==='star')star(ctx,x,y,7,t.accent,t.outline);if(type==='pig'){ctx.fillStyle='#ffb9c8';ctx.beginPath();ctx.ellipse(x,y,7,6,0,0,Math.PI*2);ctx.fill();for(const d of [-1,1]){ctx.beginPath();ctx.moveTo(x+d*3,y-4);ctx.lineTo(x+d*6,y-8);ctx.lineTo(x+d*7,y-2);ctx.fill()}ctx.fillStyle='#713f52';for(const d of [-1,1]){ctx.beginPath();ctx.arc(x+d*2.7,y-1,0.8,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#f18faa';ctx.beginPath();ctx.ellipse(x,y+2.1,3.1,2,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#87445a';ctx.fillRect(x-1.7,y+1.5,.8,1);ctx.fillRect(x+.8,y+1.5,.8,1)}if(type==='bunny'){ctx.fillStyle='#ffffff';ctx.strokeStyle='#dba8c8';ctx.lineWidth=1;for(const d of [-1,1]){ctx.beginPath();ctx.ellipse(x+d*3,y-5,2,5,d*.14,0,Math.PI*2);ctx.fill();ctx.stroke()}ctx.beginPath();ctx.ellipse(x,y+1,6,5,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#614555';ctx.fillRect(x-2.5,y,.9,1.4);ctx.fillRect(x+1.6,y,.9,1.4);ctx.fillStyle='#ee9fbb';ctx.fillRect(x-.7,y+2,1.4,1)}if(type==='flower'){ctx.fillStyle='#f4bcd5';for(let i=0;i<5;i++){ctx.beginPath();ctx.arc(x+Math.cos(i*Math.PI*2/5)*3.5,y+Math.sin(i*Math.PI*2/5)*3.5,3,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#fff2bc';ctx.beginPath();ctx.arc(x,y,2.4,0,Math.PI*2);ctx.fill()}ctx.restore()}
function lettering(ctx,value,x,y,t,size=20,price=false){ctx.save();font(ctx,t,size);ctx.textBaseline='middle';ctx.lineJoin='round';ctx.miterLimit=2;ctx.strokeStyle='#fff9fc';ctx.lineWidth=5.2;ctx.strokeText(value,x,y);ctx.strokeStyle=t.outline;ctx.lineWidth=3.2;ctx.strokeText(value,x,y);if(price){const g=ctx.createLinearGradient(0,y-size*.48,0,y+size*.5);g.addColorStop(0,'#fffdfb');g.addColorStop(.25,t.color);g.addColorStop(.58,t.accent);g.addColorStop(1,t.id==='pastel'?'#c79557':'#bb5f88');ctx.fillStyle=g}else ctx.fillStyle=t.text;ctx.fillText(value,x,y);ctx.restore()}
function layout(ctx,input){const s=normalize(input),t=TEMPLATES.find(t=>t.id===s.template),rows=parseRows(s.rows),size=20,pad=14,iconW=t.icon==='none'?0:21; font(ctx,t,size);const priceW=ctx.measureText('99999').width+3;const rawWidth=Math.max(190,...rows.map(r=>ctx.measureText(r.text).width+(r.amount?priceW+10:0)))+pad*2+iconW;
const titleInput=s.title.split('\n').filter(x=>x.trim());font(ctx,t,21);const titleW=Math.max(0,...titleInput.map(x=>ctx.measureText(x).width))+pad*2+32;
const width=Math.min(720,Math.max(220,Math.ceil(Math.max(rawWidth,titleW)))),bodyX=pad+iconW,titleLines=s.title?wrap(ctx,s.title,width-pad*2-28):[],titleLineH=t.header==='memo'?29:30,headerH=titleLines.length?(titleLines.length*titleLineH+(t.header==='plain'?14:t.header==='memo'?40:28)):0;
let y=headerH+(titleLines.length?17:17);const placed=[];font(ctx,t,size);for(const r of rows){const available=width-bodyX-pad-(r.amount?priceW+10:0);const lines=wrap(ctx,r.text,available);placed.push({...r,x:bodyX,y,lines});y+=Math.max(27,lines.length*26)}return{s,t,width,height:Math.ceil(y+16),priceW,bodyX,titleLines,headerH,placed,titleLineH,size,pad}}
function header(ctx,l){const{t,titleLines,headerH,width,titleLineH}=l;if(!titleLines.length)return;const x=12,w=width-24,center=width/2;ctx.save();if(t.header==='badge'||t.header==='label'){ctx.fillStyle=t.header==='badge'?'#ffe3ee':'#f8dbea';pathRound(ctx,x,8,w,headerH-6,t.header==='badge'?12:6);ctx.fill();ctx.strokeStyle=t.header==='badge'?'#b6dce8':'#ffffff';ctx.lineWidth=3;ctx.stroke();if(t.header==='label'){heart(ctx,x+13,19,4,'#ffffff');heart(ctx,width-x-13,headerH-8,4,'#ffffff')}}
if(t.header==='pastel'){const g=ctx.createLinearGradient(0,8,width,headerH);g.addColorStop(0,'#fff0c9');g.addColorStop(.5,'#ffe0eb');g.addColorStop(1,'#d5faf0');ctx.fillStyle=g;pathRound(ctx,x,8,w,headerH-5,15);ctx.fill();ctx.strokeStyle='#fffaf0';ctx.lineWidth=3;ctx.stroke();star(ctx,23,19,4,'#fff7bd','#d3b88d');star(ctx,width-23,headerH-8,4,'#fff7bd','#d3b88d')}
if(t.header==='memo'){ctx.translate(center,headerH/2+6);ctx.rotate(-.025);ctx.translate(-center,-headerH/2-6);ctx.fillStyle='#fffef6';pathRound(ctx,12,17,width-24,headerH-12,2);ctx.fill();ctx.strokeStyle='#deded4';ctx.lineWidth=.6;for(let y=44;y<headerH;y+=titleLineH){ctx.beginPath();ctx.moveTo(23,y);ctx.lineTo(width-23,y);ctx.stroke()}ctx.fillStyle='#b8d9d2';for(const xx of [30,width-46])ctx.fillRect(xx,12,20,10);ctx.fillStyle='#eea9bf';ctx.beginPath();ctx.arc(center,17,4,0,Math.PI*2);ctx.fill()}
if(t.header==='underline'){ctx.strokeStyle=t.accent;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(15,headerH+3);ctx.lineTo(width-15,headerH+3);ctx.stroke()}
const boxed=['badge','label','pastel','memo'].includes(t.header);titleLines.forEach((str,i)=>{font(ctx,t,21);const tw=ctx.measureText(str).width;const tx=boxed?Math.max(24,center-tw/2):17,ty=(t.header==='memo'?36:23)+i*titleLineH;if(t.header==='memo'){ctx.fillStyle='#554861';ctx.textBaseline='middle';ctx.fillText(str,tx,ty)}else lettering(ctx,str,tx,ty,{...t,text:boxed?'#fff7fc':t.color,outline:boxed?'#63465d':t.outline},21,false)});ctx.restore()}
function render(canvas,input){let ctx=canvas.getContext('2d');const l=layout(ctx,input);if(l.height>14000)throw Error('메뉴가 너무 길어요. 항목 수를 줄여주세요.');canvas.width=l.width;canvas.height=l.height;ctx=canvas.getContext('2d');ctx.clearRect(0,0,l.width,l.height);header(ctx,l);for(const r of l.placed){if(l.t.icon!=='none')icon(ctx,l.t.icon,15,r.y,l.t);if(r.amount){font(ctx,l.t,20);const measure=ctx.measureText(r.amount).width;lettering(ctx,r.amount,r.x,r.y,l.t,measure>l.priceW?20*l.priceW/measure:20,true)}r.lines.forEach((str,i)=>lettering(ctx,str,r.x+(r.amount?l.priceW+10:0),r.y+i*26,l.t,20,false))}return l}
return{FONTS,TEMPLATES,parseRows,normalize,wrap,layout,render};});

'use strict';
const S=window.SigTable,$=id=>document.getElementById(id),KEY='yoning_sig_table_simple_v1';
let applied={template:'heart',title:'고정메뉴',rows:'100 안녕하세요\n300 하트 보내기\n1000 노래 한 곡'},selected='heart',busy=false;
try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&S.TEMPLATES.some(t=>t.id===old.template))applied={template:old.template,title:String(old.title||'').slice(0,180),rows:String(old.rows||'').slice(0,8000)}}catch(_){}
selected=applied.template;$('title').value=applied.title;$('rows').value=applied.rows;
function status(t){$('status').textContent=t}
function state(data){const t=S.TEMPLATES.find(t=>t.id===data.template)||S.TEMPLATES[0];return{...data,font:t.font,color:t.color,frame:t.frame,size:20,titleSize:20,footerSize:20,titleAlign:'left',columns:1,width:480,footer:''}}
async function loadFont(data){const f=S.FONTS.find(f=>f.id===state(data).font);if(document.fonts){await document.fonts.load(f.weight+' 20px "'+f.family+'"');if(!document.fonts.check(f.weight+' 20px "'+f.family+'"'))throw Error('글꼴을 불러오지 못했어요. 인터넷 연결을 확인해주세요.')}}
function draw(){const l=S.render($('preview'),state(applied));$('dimensions').textContent=l.width+' × '+l.height+'px'}
function selection(){for(const b of $('templates').children)b.setAttribute('aria-pressed',String(b.dataset.id===selected))}
function miniatures(){for(const b of $('templates').children){const art=b.querySelector('canvas'),c=document.createElement('canvas');S.render(c,{template:b.dataset.id,title:'고정메뉴',rows:'100 하트 보내기\n1000 노래 한 곡'});art.width=220;art.height=112;const ctx=art.getContext('2d');ctx.clearRect(0,0,220,112);const scale=Math.min(208/c.width,104/c.height);ctx.drawImage(c,(220-c.width*scale)/2,(112-c.height*scale)/2,c.width*scale,c.height*scale)}}
for(const t of S.TEMPLATES){const b=document.createElement('button');b.type='button';b.className='template';b.dataset.id=t.id;b.style.setProperty('--sample',t.sample);const art=document.createElement('canvas');art.className='templateArt';art.setAttribute('aria-hidden','true');const label=document.createElement('span');label.textContent=t.name;b.append(art,label);b.onclick=()=>{selected=t.id;selection()};$('templates').append(b)}
miniatures();Promise.all(S.TEMPLATES.map(t=>loadFont({template:t.id}))).then(miniatures).catch(()=>{});
$('editor').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('apply').disabled=true;const next={template:selected,title:$('title').value.slice(0,180),rows:$('rows').value.slice(0,8000)};try{await loadFont(next);applied=next;draw();try{localStorage.setItem(KEY,JSON.stringify(applied));status('적용했어요.')}catch(_){status('적용했어요. 브라우저에는 저장하지 못했어요.')}}catch(e){status(e.message)}finally{busy=false;$('apply').disabled=false}};
$('download').onclick=async()=>{const b=$('download');b.disabled=true;try{await loadFont(applied);const c=document.createElement('canvas');S.render(c,state(applied));const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('이미지를 만들지 못했어요.');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='시그표.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status('투명 PNG로 저장했어요.')}catch(e){status(e.message)}finally{b.disabled=false}};
selection();draw();loadFont(applied).then(draw).catch(e=>status(e.message));
</script></body></html>
