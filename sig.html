<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시그표 · 요닝 방송도구함</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#262626;font-family:Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #767393;outline-offset:3px}[hidden]{display:none!important}.nav{display:block;width:100%;height:58px;border:0;background:#0c0e11}main{max-width:1260px;margin:36px auto 60px;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;gap:15px}h1{font-size:29px;margin:0;letter-spacing:-1px}.download{border:0;border-radius:10px;background:#33303e;color:white;padding:14px 21px;font-size:13px;font-weight:700}.download:hover{background:#51495d}.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;align-items:start}.panel{background:white;border:1px solid #e3e1dc;border-radius:16px;padding:22px}.panel h2{font-size:14px;margin:0 0 15px}.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.theme{border:1px solid #e1ded8;background:white;border-radius:10px;padding:5px;color:#6e6973;font-size:10px}.theme[aria-pressed=true]{border:2px solid #656071;padding:4px;color:#343039}.theme .sample{display:grid;place-items:center;border-radius:6px;height:44px;font-weight:900;font-size:22px;margin-bottom:5px;-webkit-text-stroke:.5px var(--outline);color:var(--color);background:var(--sample);text-shadow:0 1px 3px var(--accent)}.fields{display:grid;gap:16px;margin-top:23px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}.field input[type=text],textarea,select{width:100%;border:1px solid #dedbd5;border-radius:8px;padding:11px 12px;background:#fff;color:#36333b;font-size:13px}textarea{resize:vertical;min-height:235px;line-height:1.9;tab-size:4}.hint{font-size:11px;color:#969098;line-height:1.7;margin:8px 0 0}.rowControls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field input[type=rang </style></head><body><iframe class="nav" src="navbar.html" title="상단 메뉴" scrolling="no"></iframe><main><header><h1>시그표</h1><button class="download" id="download">투명 PNG 다운로드 ↓</button></header><div class="layout"><section class="panel" aria-label="시그표 편집"><h2>테마</h2><div class="themes" id="themes"></div><div class="fields"><div class="field"><label for="title">제목</label><input type="text" id="title" maxlength="80" placeholder="예: 요닝 시그표"></div><div class="field"><label for="subtitle">작은 제목</label><input type="text" id="subtitle" maxlength="100" placeholder="없으면 비워두세요"></div><div class="field"><label for="rows">시그 목록</label><textarea id="rows" maxlength="6000" spellcheck="false" placeholder="100 | 안녕하세요&#10;300 | 하트 보내기&#10;500 | 노래 한 곡"></textarea><p class="hint">한 줄에 하나씩 입력 · 금액과 내용 사이는 | 로 구분<br>금액 없이 텍스트만 넣어도 돼요. 최대 24줄.</p></div><div class="field"><label for="footer">아래 문구</label><input type="text" id="footer" maxlength="120" placeholder="없으면 비워두세요"></div><div class="rowControls"><div class="field"><label for="columns">배치</label><select id="columns"><option value="1">1열</option><option value="2">2열</option></select></div><div class="field"><label for="width">이미지 너비</label><select id="width"><option value="720">720px</option><option value="900" selected>900px</option><option value="1080">1080px</option></select></div></div><div class="field"><label class="rangeLabel" for="size"><span>글자 크기</span><span id="sizeValue"></span></label><input id="size" type="range" min="24" max="54" step="1"></div></div><div class="subActions"><button id="sample">예시 넣기</button><button id="reset">내용 비우기</button></div><div class="resetConfirm" id="resetConfirm" hidden>입력한 내용을 모두 비울까요?<br><button id="confirmReset">비우기</button><button id="cancelReset">취소</button></div><p class="status" id="status" aria-live="polite"></p></section><section class="previewPanel" aria-label="시그표 미리보기"><div class="previewTop"><b>미리보기</b><div class="previewTools"><button id="dark" aria-pressed="true">어두운 배경</bu (function(root,factory){if(typeof module==='object'&&module.exports)module.exports=factory();else root.SigTable=factory()})(typeof globalThis!=='undefined'?globalThis:this,function(){
'use strict';
const THEMES=[
{id:'mono',name:'모노',color:'#ffffff',accent:'#ffffff',outline:'#111111',shadow:'#00000088',font:'Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif',sample:'#252628'},
{id:'rose',name:'로즈',color:'#fff6fa',accent:'#ff93bb',outline:'#803752',shadow:'#e7598e66',font:'Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif',sample:'#9b4e70'},
{id:'lavender',name:'라벤더',color:'#f8f3ff',accent:'#c8adff',outline:'#504076',shadow:'#8e67da88',font:'Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif',sample:'#76639f'},
{id:'mint',name:'민트',color:'#f2fff9',accent:'#86e3c3',outline:'#265b51',shadow:'#42c5a066',font:'Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif',sample:'#42776c'},
{id:'gold',name:'골드',color:'#fff6d7',accent:'#e8c16f',outline:'#59421e',shadow:'#bb852c66',font:'Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif',sample:'#7e683c'},
{id:'ocean',name:'블루',color:'#f0faff',accent:'#8dceff',outline:'#26486b',shadow:'#4a9ce388',font:'Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif',sample:'#496d99'},
{id:'neon',name:'네온',color:'#ffffff',accent:'#ee9eff',outline:'#643384',shadow:'#d148ffcc',font:'Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif',sample:'#3c294b'},
{id:'ink',name:'잉크',color:'#141414',accent:'#141414',outline:'#ffffff',shadow:'#00000022',font:'Arial,"Malgun Gothic","Apple SD Gothic Neo",sans-serif',sample:'#ebe8df'}
];
function parseRows(text){return String(text).split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,24).map(line=>{const parts=line.split(/[|\t]/);if(parts.length>1)return{amount:parts[0].trim().slice(0,24),text:parts.slice(1).join(' ').trim().slice(0,120)};return{amount:'',text:line.slice(0,120)}})}
function wrap(ctx,text,width){const lines=[];let line='';for(const char of Array.from(String(text))){if(char==='\n'){lines.push(line);line='';continue}if(line&&ctx.measureText(line+char).width>width){lines.push(line.trimEnd());line=char.trimStart()}else line+=char}if(line||!lines.length)lines.push(line);return lines}
function line(ctx,x1,y1,x2,y2,color,width=1){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function star(ctx,x,y,r,color){ctx.save();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x+2,y-2,x+r,y);ctx.quadraticCurveTo(x+2,y+2,x,y+r);ctx.quadraticCurveTo(x-2,y+2,x-r,y);ctx.quadraticCurveTo(x-2,y-2,x,y-r);ctx.fill();ctx.restore()}
function drawText(ctx,text,x,y,size,color,theme,align='left',weight=800){ctx.save();ctx.font=weight+' '+size+'px '+theme.font;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.miterLimit=2;ctx.strokeStyle=theme.outline;ctx.lineWidth=Math.max(1.6,size*.065);ctx.shadowColor=theme.shadow;ctx.shadowBlur=theme.id==='neon'?size*.4:3;ctx.shadowOffsetY=theme.id==='neon'?0:2;ctx.strokeText(text,x,y);ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.fillStyle=color;ctx.fillText(text,x,y);ctx.restore()}
function layout(ctx,state){const theme=THEMES.find(t=>t.id===state.theme)||THEMES[0],width=Number(state.width)||900,size=Number(state.size)||34,cols=Number(state.columns)===2?2:1,pad=56,gap=48,colWidth=(width-pad*2-gap*(cols-1))/cols,rows=parseRows(state.rows),title=String(state.title||'').slice(0,80),sub=String(state.subtitle||'').slice(0,100),foot=String(state.footer||'').slice(0,120);ctx.font='900 60px '+theme.font;const titleLines=title?wrap(ctx,title,width-160):[];ctx.font='600 20px '+theme.font;const subLines=sub?wrap(ctx,sub,width-140):[];const start=52+titleLines.length*74+(subLines.length?18+subLines.length*29:0)+38;let amountWidth=0;ctx.font='900 '+size+'px '+theme.font;for(const r of rows)amountWidth=Math.max(amountWidth,ctx.measureText(r.amount).width);amountWidth=Math.min(amountWidth,colWidth*.38);const hasAmount=rows.some(r=>r.amount),textWidth=colWidth-(hasAmount?amountWidth+24:0),perColumn=Math.ceil(rows.length/cols),placed=[],heights=[];for(let c=0;c<cols;c++){let y=start;for(const r of rows.slice(c*perColumn,(c+1)*perColumn)){ctx.font='800 '+size+'px '+theme.font;const lines=wrap(ctx,r.text||' ',textWidth),h=Math.max(size*1.6,lines.length*size*1.4)+22;placed.push({...r,lines,x:pad+c*(colWidth+gap),y,h,col:c});y+=h}heights.push(y)}const bottom=Math.max(start,...heights);ctx.font='600 20px '+theme.font;const footLines=foot?wrap(ctx,foot,width-140):[];const height=Math.ceil(bottom+45+footLines.length*29+30);return{theme,width,height,size,pad,cols,colWidth,amountWidth,hasAmount,titleLines,subLines,footLines,start,bottom,placed}}
function render(canvas,state,pixelRatio=1){let ctx=canvas.getContext('2d');const l=layout(ctx,state);const ratio=Math.min(pixelRatio,12000/l.height,12000/l.width,Math.sqrt(24000000/(l.width*l.height)));canvas.width=Math.ceil(l.width*ratio);canvas.height=Math.ceil(l.height*ratio);ctx=canvas.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);ctx.clearRect(0,0,l.width,l.height);const t=l.theme;let y=76;for(const text of l.titleLines){drawText(ctx,text,l.width/2,y,60,t.color,t,'center',900);y+=74}if(l.subLines.length){y+=8;for(const text of l.subLines){drawText(ctx,text,l.width/2,y,20,t.accent,t,'center',600);y+=29}}const ruleY=l.start-24;line(ctx,l.pad,ruleY,l.width-l.pad,ruleY,t.accent,2);star(ctx,l.width/2,ruleY,8,t.accent);star(ctx,25,ruleY,5,t.accent);star(ctx,l.width-25,ruleY,5,t.accent);for(const r of l.placed){if(r.amount){ctx.font='900 '+l.size+'px '+t.font;const measured=ctx.measureText(r.amount).width,amountSize=measured>l.amountWidth?l.size*l.amountWidth/measured:l.size;drawText(ctx,r.amount,r.x,r.y+l.size*.7,amountSize,t.accent,t)}const tx=r.x+(l.hasAmount?l.amountWidth+24:0);r.lines.forEach((text,i)=>drawText(ctx,text,tx,r.y+l.size*.7+i*l.size*1.4,l.size,t.color,t));line(ctx,r.x,r.y+r.h-11,r.x+l.colWidth,r.y+r.h-11,t.accent+'55',1)}if(l.cols===2)line(ctx,l.width/2,l.start,l.width/2,l.bottom-12,t.accent+'66',1);line(ctx,l.pad,l.bottom+13,l.width-l.pad,l.bottom+13,t.accent,2);let fy=l.bottom+48;for(const text of l.footLines){drawText(ctx,text,l.width/2,fy,20,t.accent,t,'center',600);fy+=29}return{...l,ratio}}
return{THEMES,parseRows,wrap,layout,render};});

const S=window.SigTable,$=id=>document.getElementById(id),KEY='yoning_sig_table_v1';const DEFAULT={theme:'rose',title:'요닝 시그표',subtitle:'',rows:'100 | 안녕하세요\n300 | 하트 보내기\n500 | 노래 한 곡\n1,000 | 리액션 타임\n2,000 | 오늘의 주인공\n5,000 | 특별한 선물',footer:'',width:900,size:34,columns:1};let state={...DEFAULT},timer=0,raf=0;
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&S.THEMES.some(t=>t.id===d.theme)){state={...DEFAULT,...d};for(const k of ['title','subtitle','rows','footer'])if(typeof state[k]!=='string')state[k]=DEFAULT[k];state.width=[720,900,1080].includes(Number(state.width))?Number(state.width):900;state.size=Math.max(24,Math.min(54,Number(state.size)||34));state.columns=Number(state.columns)===2?2:1}}catch(_){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('status').textContent='이 브라우저에 저장됐어요.'}catch(_){$('status').textContent='자동 저장을 사용할 수 없어요. PNG 다운로드는 가능해요.'}}
function draw(){const info=S.render($('preview'),state,1);$('sizeValue').textContent=state.size+'px';$('dimensions').textContent=info.width+' × '+info.height;for(const b of $('themes').children)b.setAttribute('aria-pressed',String(b.dataset.theme===state.theme))}
function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(draw);clearTimeout(timer);timer=setTimeout(save,300)}
function syncFields(){for(const id of ['title','subtitle','rows','footer','width','size','columns'])$(id).value=state[id];draw()}
for(const t of S.THEMES){const b=document.createElement('button');b.className='theme';b.dataset.theme=t.id;b.setAttribute('aria-label',t.name+' 테마');b.style.setProperty('--outline',t.outline);b.style.setProperty('--color',t.accent);b.style.setProperty('--sample',t.sample);b.style.setProperty('--accent',t.shadow);const swatch=document.createElement('span');swatch.className='sample';swatch.textContent='시그';const name=document.createElement('span');name.textContent=t.name;b.append(swatch,name);b.onclick=()=>{state.theme=t.id;draw();save()};$('themes').appendChild(b)}
for(const id of ['title','subtitle','rows','footer','width','size','columns'])$(id).addEventListener('input',()=>{state[id]=['width','size','columns'].includes(id)?Number($(id).value):$(id).value;schedule()});
function backdrop(light){$('stage').classList.toggle('light',light);$('dark').setAttribute('aria-pressed',String(!light));$('light').setAttribute('aria-pressed',String(light))}$('dark').onclick=()=>backdrop(false);$('light').onclick=()=>backdrop(true);
$('sample').onclick=()=>{state={...state,title:DEFAULT.title,subtitle:DEFAULT.subtitle,rows:DEFAULT.rows,footer:''};syncFields();save()};$('reset').onclick=()=>{$('resetConfirm').hidden=false};$('cancelReset').onclick=()=>{$('resetConfirm').hidden=true};$('confirmReset').onclick=()=>{for(const k of ['title','subtitle','rows','footer'])state[k]='';$('resetConfirm').hidden=true;syncFields();save()};
async function download(){const buttons=[$('download'),$('downloadMobile')];buttons.forEach(b=>b.disabled=true);try{await document.fonts?.ready;const canvas=document.createElement('canvas'),info=S.render(canvas,state,2);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG 생성 실패');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='시그표_'+state.theme+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);$('status').textContent='투명 PNG 저장 · '+canvas.width+' × '+canvas.height+'px'}catch(_){$('status').textContent='다운로드하지 못했어요. 잠시 후 다시 눌러주세요.'}finally{buttons.forEach(b=>b.disabled=false)}}
$('download').onclick=download;$('downloadMobile').onclick=download;syncFields();document.fonts?.ready.then(draw);
</script></body></html>
