$('rows').addEventListener('input',()=>{const old=S.parseRows(markRows),next=S.parseRows($('rows').value),pool=new Map();old.forEach((r,i)=>{const key=JSON.stringify(r);if(!pool.has(key))pool.set(key,[]);pool.get(key).push(draftMarks[i]||{})});draftMarks=next.map(r=>({...pool.get(JSON.stringify(r))?.shift()}));markRows=$('rows').value;rowTools();stop();live()});
for(const t of S.TEMPLATES){const option=document.createElement('option');option.value=t.id;option.textContent=t.name;$('style').append(option)}
$('style').addEventListener('input',()=>{stop();selected=$('style').value;live()});
// One deliberate wheel step per tick; prevent page scrolling while selecting.
for(const id of ['style','decoration','titleAlign','emoji']){const select=$(id);let lastWheel=-Infinity;select.addEventListener('wheel',e=>{if(!e.deltaY||e.ctrlKey)return;e.preventDefault();const now=performance.now();if(now-lastWheel<110)return;lastWheel=now;const options=Array.from(select.options).filter(o=>!o.disabled),at=options.findIndex(o=>o.value===select.value),next=Math.max(0,Math.min(options.length-1,at+(e.deltaY>0?1:-1)));if(next===at)return;select.value=options[next].value;select.dispatchEvent(new Event('input',{bubbles:true}));select.dispatchEvent(new Event('change',{bubbles:true}))},{passive:false})}
$('editor').onsubmit=e=>e.preventDefault();
for(const id of ['title','titleAlign','decoration','emoji'])$(id).addEventListener('input',()=>{stop();live()});
function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
$('download').onclick=async()=>{const b=$('download');b.disabled=true;try{await allFonts();const c=document.createElement('canvas');S.render(c,{...applied,...dimensions()});const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('이미지를 만들지 못했어요.');saveBlob(blob,'시그표_'+(index+1)+'.png');status('현재 이미지를 투명 PNG로 저장했어요.')}catch(e){status(e.message)}finally{b.disabled=false}};

function gifPalette(images){const bins=new Map();for(const data of images)for(let i=0;i<data.length;i+=4){if(data[i+3]<128)continue;const key=(data[i]>>3)*1024+(data[i+1]>>3)*32+(data[i+2]>>3),v=bins.get(key)||[0,0,0,0];v[0]+=data[i];v[1]+=data[i+1];v[2]+=data[i+2];v[3]++;bins.set(key,v)}const points=[...bins.entries()].map(([key,v])=>({key,r:v[0]/v[3],g:v[1]/v[3],b:v[2]/v[3],n:v[3]})),boxes=points.length?[points]:[];function range(box){return ['r','g','b'].map(k=>Math.max(...box.map(v=>v[k]))-Math.min(...box.map(v=>v[k])))}while(boxes.length<255){let at=-1,best=0;boxes.forEach((b,i)=>{if(b.length<2)return;const score=Math.max(...range(b))*Math.sqrt(b.reduce((s,v)=>s+v.n,0));if(score>best){best=score;at=i}});if(at<0)break;const box=boxes.splice(at,1)[0],spans=range(box),axis=['r','g','b'][spans.indexOf(Math.max(...spans))];box.sort((x,y)=>x[axis]-y[axis]);const half=box.reduce((s,v)=>s+v.n,0)/2;let sum=0,split=1;for(let i=0;i<box.length-1;i++){sum+=box[i].n;split=i+1;if(sum>=half)break}boxes.push(box.slice(0,split),box.slice(split))}const palette=[[0,0,0],...boxes.map(box=>{const n=box.reduce((s,v)=>s+v.n,0);return ['r','g','b'].map(k=>Math.round(box.reduce((s,v)=>s+v[k]*v.n,0)/n))})],lookup=new Map();for(const point of points){let best=Infinity,index=1;for(let i=1;i<palette.length;i++){const c=palette[i],distance=(point.r-c[0])**2*.3+(point.g-c[1])**2*.59+(point.b-c[2])**2*.11;if(distance<best){best=distance;index=i}}lookup.set(point.key,index)}while(palette.length<256)palette.push([0,0,0]);return{palette,lookup}}
function encodeGIF(images,w,h,delays){const {palette,lookup}=gifPalette(images);const out=new Uint8Array(Math.ceil(w*h*images.length*1.16)+images.length*64+2048);let pos=0;const byte=v=>{if(pos>=out.length)throw Error('GIF 용량을 초과했어요.');out[pos++]=v&255},word=v=>{byte(v);byte(v>>8)},str=s=>{for(const c of s)byte(c.charCodeAt(0))};str('GIF89a');word(w);word(h);byte(247);byte(0);byte(0);for(const rgb of palette)for(const v of rgb)byte(v);byte(33);byte(255);byte(11);str('NETSCAPE2.0');byte(3);byte(1);word(0);byte(0);
 images.forEach((data,k)=>{byte(33);byte(249);byte(4);byte(9);word(Math.max(2,Math.round(delays[k]*100)));byte(0);byte(0);byte(44);word(0);word(0);word(w);word(h);byte(0);byte(8);const packed=new Uint8Array(255);let block=0;const flush=()=>{if(!block)return;byte(block);for(let j=0;j<block;j++)byte(packed[j]);block=0};const packedByte=v=>{packed[block++]=v;if(block===255)flush()};let bits=0,acc=0,count=0;const code=n=>{acc|=n<<bits;bits+=9;while(bits>=8){packedByte(acc&255);acc>>>=8;bits-=8}};code(256);for(let i=0;i<data.length;i+=4){if(count===200){code(256);count=0}const idx=data[i+3]<128?0:lookup.get((data[i]>>3)*1024+(data[i+1]>>3)*32+(data[i+2]>>3));code(idx);count++}code(257);if(bits)packedByte(acc&255);flush();byte(0)});byte(59);return out.slice(0,pos)}
$('gif').onclick=async()=>{const b=$('gif'),snapshot=frames.map(f=>({...f}));b.disabled=true;stop();try{await allFonts(snapshot);const d=dimensions(snapshot);if(d.outputWidth*d.outputHeight*snapshot.length>18000000)throw Error('움짤이 너무 커요. 이미지 수나 메뉴 길이를 줄여주세요.');const images=[];for(let i=0;i<snapshot.length;i++){status('GIF 생성 중 · '+(i+1)+' / '+snapshot.length);await new Promise(r=>setTimeout(r,0));const c=document.createElement('canvas');S.render(c,{...snapshot[i],...d});images.push(c.getContext('2d').getImageData(0,0,c.width,c.height).data)}const bytes=encodeGIF(images,d.outputWidth,d.outputHeight,snapshot.map(f=>f.duration));saveBlob(new Blob([bytes],{type:'image/gif'}),'시그표_무한반복.gif');status('무한 반복 GIF로 저장했어요.')}catch(e){status(e.message)}finally{b.disabled=frames.length<2}};
function pngCRC(bytes){let crc=0xffffffff;for(const b of bytes){crc^=b;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0)}return(crc^0xffffffff)>>>0}
function pngChunk(name,data){const bytes=new Uint8Array(data.length+12),v=new DataView(bytes.buffer);v.setUint32(0,data.length);for(let i=0;i<4;i++)bytes[4+i]=name.charCodeAt(i);bytes.set(data,8);v.setUint32(bytes.length-4,pngCRC(bytes.subarray(4,bytes.length-4)));return bytes}
function animationPNG(images,delays){let sequence=0;const chunks=[new Uint8Array([137,80,78,71,13,10,26,10])];let header;for(let i=0;i<images.length;i++){const png=images[i],view=new DataView(png.buffer,png.byteOffset,png.byteLength),idats=[];let own;for(let p=8;p+12<=png.length;){const n=view.getUint32(p),name=String.fromCharCode(...png.subarray(p+4,p+8));if(p+12+n>png.length)throw Error('PNG 데이터를 읽지 못했어요.');if(name==='IHDR')own=png.slice(p+8,p+8+n);if(name==='IDAT')idats.push(png.slice(p+8,p+8+n));p+=n+12}if(!own||!idats.length)throw Error('PNG 데이터를 읽지 못했어요.');if(i===0){header=own;chunks.push(pngChunk('IHDR',header));const actl=new Uint8Array(8);new DataView(actl.buffer).setUint32(0,images.length);chunks.push(pngChunk('acTL',actl))}else if(own.some((v,j)=>v!==header[j]))throw Error('이미지 형식이 서로 달라요.');const control=new Uint8Array(26),cv=new DataView(control.buffer);cv.setUint32(0,sequence++);control.set(header.subarray(0,8),4);cv.setUint16(20,Math.round(delays[i]*100));cv.setUint16(22,100);control[24]=0;control[25]=0;chunks.push(pngChunk('fcTL',control));for(const data of idats){if(i===0)chunks.push(pngChunk('IDAT',data));else{const fd=new Uint8Array(data.length+4);new DataView(fd.buffer).setUint32(0,sequence++);fd.set(data,4);chunks.push(pngChunk('fdAT',fd))}}}chunks.push(pngChunk('IEND',new Uint8Array()));return new Blob(chunks,{type:'image/png'})}
$('apng').onclick=async()=>{const b=$('apng'),snapshot=frames.map(f=>({...f}));if(snapshot.length<2){status('이미지를 두 장 이상 추가해주세요.');return}b.disabled=true;stop();try{await allFonts(snapshot);const d=dimensions(snapshot);if(d.outputWidth*d.outputHeight*snapshot.length>18000000)throw Error('움짤이 너무 커요. 이미지 수나 메뉴 길이를 줄여주세요.');const images=[];for(let i=0;i<snapshot.length;i++){status('고화질 반복 PNG 생성 중 · '+(i+1)+' / '+snapshot.length);await new Promise(r=>setTimeout(r,0));const c=document.createElement('canvas');S.render(c,{...snapshot[i],...d});const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('PNG를 만들지 못했어요.');images.push(new Uint8Array(await blob.arrayBuffer()))}saveBlob(animationPNG(images,snapshot.map(f=>f.duration)),'시그표_고화질_무한반복.png');status('글자와 반투명 테두리를 보존한 고화질 반복 PNG로 저장했어요.')}catch(e){status(e.message)}finally{b.disabled=frames.length<2}};
