try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(Array.isArray(old?.frames)&&old.frames.length){frames=old.frames.slice(0,12).map(f=>{if(!old.spacingVersion){let i=0;f={...f,marks:S.parseRows(f.rows).map(r=>r.blank?{}:(f.marks||[])[i++]||{})}}return sanitize(f)});index=Math.min(frames.length-1,Math.max(0,old.index||0))}else{const legacy=JSON.parse(localStorage.getItem('yoning_sig_table_simple_v1')||'null');if(legacy)frames=[sanitize({...DEFAULT,...legacy})]}}catch(_){}
applied=frames[index];selected=applied.template;
function status(t){$('status').textContent=t}
function save(){try{localStorage.setItem(KEY,JSON.stringify({frames,index,spacingVersion:1}))}catch(_){status('브라우저에는 저장하지 못했어요. 다운로드는 가능해요.')}}
async function loadFont(data){const t=S.TEMPLATES.find(t=>t.id===data.template)||S.TEMPLATES[0],f=S.FONTS.find(f=>f.id===t.font);if(document.fonts){await document.fonts.load(f.weight+' 20px "'+f.family+'"');if(!document.fonts.check(f.weight+' 20px "'+f.family+'"'))throw Error('글꼴을 불러오지 못했어요. 인터넷 연결을 확인해주세요.')}}
async function allFonts(items=frames){await S.loadAssets();await Promise.all([...new Map(items.map(f=>[f.template,f])).values()].map(loadFont))}
function dimensions(items=frames){const ctx=document.createElement('canvas').getContext('2d'),priceWidth=Math.max(0,...items.map(f=>S.layout(ctx,f).priceW)),width=Math.max(...items.map(f=>S.layout(ctx,{...f,priceWidth}).width)),height=Math.max(...items.map(f=>S.layout(ctx,{...f,priceWidth,outputWidth:width}).height));return{outputWidth:width,outputHeight:height,priceWidth}}
function draw(){const d=dimensions();S.render($('preview'),{...applied,...d});$('dimensions').textContent=d.outputWidth+' × '+d.outputHeight+'px';$('currentFrame').textContent=(index+1)+' / '+frames.length;for(const[b,i]of [...$('frameList').children].map((b,i)=>[b,i]))b.setAttribute('aria-pressed',String(i===index))}
function selection(){$('style').value=selected}
function sync(){const d=drafts.get(applied)||applied;selected=d.template;draftMarks=(d.marks||[]).map(m=>({...m}));markRows=d.rows;$('title').value=d.title;$('titleAlign').value=d.titleAlign||'center';$('decoration').value=d.decoration||'none';$('emoji').value=d.emoji||'none';$('rows').value=d.rows;$('duration').value=applied.duration;selection();rowTools();draw()}
function stash(){}
let fontRevision=0;function live(){const next=sanitize({template:selected,decoration:$('decoration').value,emoji:$('emoji').value,title:$('title').value,titleAlign:$('titleAlign').value,rows:$('rows').value,duration:applied.duration,marks:draftMarks});drafts.delete(applied);frames[index]=next;applied=next;draw();save();const rev=++fontRevision;loadFont(next).then(()=>{if(rev===fontRevision)draw()}).catch(e=>status(e.message))}
function stop(){clearTimeout(timer);playing=false;$('play').textContent='반복 미리보기'}
function choose(i){stop();stash();index=i;applied=frames[index];sync();save()}
function frameButtons(){const box=$('frameList');box.replaceChildren();frames.forEach((f,i)=>{const b=document.createElement('button');b.type='button';b.className='frameButton';b.textContent=(i+1)+' · '+f.duration+'초';b.onclick=()=>choose(i);box.append(b)});$('deleteFrame').disabled=frames.length===1;$('addFrame').disabled=$('duplicateFrame').disabled=frames.length>=12;$('gif').disabled=frames.length<2;draw()}
$('addFrame').onclick=()=>{stash();stop();frames.push({...DEFAULT,marks:[]});index=frames.length-1;applied=frames[index];frameButtons();sync();save()};
$('duplicateFrame').onclick=()=>{if(frames.length>=12)return;stash();stop();frames.splice(index+1,0,{...applied,marks:(applied.marks||[]).map(m=>({...m}))});index++;applied=frames[index];frameButtons();sync();save()};
$('deleteFrame').onclick=()=>{if(frames.length<2)return;stop();drafts.delete(applied);frames.splice(index,1);index=Math.min(index,frames.length-1);applied=frames[index];frameButtons();sync();save()};
$('duration').onchange=()=>{applied.duration=Math.max(.2,Math.min(120,Number($('duration').value)||5));$('duration').value=applied.duration;frameButtons();save()};
function nextTick(){timer=setTimeout(()=>{index=(index+1)%frames.length;applied=frames[index];sync();nextTick()},applied.duration*1000)}
$('play').onclick=()=>{if(playing){stop();return}if(frames.length<2){status('이미지를 두 장 이상 추가해주세요.');return}stash();playing=true;$('play').textContent='미리보기 정지';nextTick()};
function rowTools(){const box=$('rowTools');box.replaceChildren();const rows=S.parseRows($('rows').value);rows.forEach((r,i)=>{const line=document.createElement('div');line.className='rowTool';const text=document.createElement('span');text.textContent=r.blank?'— 빈 줄 —':(r.amount?r.amount+' ':'')+r.text;line.append(text);for(const[key,label]of [['new','NEW'],['hot','HOT']]){const b=document.createElement('button');b.type='button';b.textContent=label;b.disabled=!!r.blank;b.setAttribute('aria-pressed',String(!!draftMarks[i]?.[key]));b.onclick=()=>{stop();const enabled=!draftMarks[i]?.[key];draftMarks[i]={new:false,hot:false,[key]:enabled};rowTools();live()};line.append(b)}box.append(line)})}
$('rows').addEventListener('input',()=>{const old=S.parseRows(markRows),next=S.parseRows($('rows').value),pool=new Map();old.forEach((r,i)=>{const key=JSON.stringify(r);if(!pool.has(key))pool.set(key,[]);pool.get(key).push(draftMarks[i]||{})});draftMarks=next.map(r=>({...pool.get(JSON.stringify(r))?.shift()}));markRows=$('rows').value;rowTools();stop();live()});
for(const t of S.TEMPLATES){const option=document.createElement('option');option.value=t.id;option.textContent=t.name;$('style').append(option)}
$('style').addEventListener('input',()=>{stop();selected=$('style').value;live()});
// One deliberate wheel step per tick; prevent page scrolling while selecting.
for(const id of ['style','decoration','titleAlign','emoji']){const select=$(id);let lastWheel=-Infinity;select.addEventListener('wheel',e=>{if(!e.deltaY||e.ctrlKey)return;e.preventDefault();const now=performance.now();if(now-lastWheel<110)return;lastWheel=now;const options=Array.from(select.options).filter(o=>!o.disabled),at=options.findIndex(o=>o.value===select.value),next=Math.max(0,Math.min(options.length-1,at+(e.deltaY>0?1:-1)));if(next===at)return;select.value=options[next].value;select.dispatchEvent(new Event('input',{bubbles:true}));select.dispatchEvent(new Event('change',{bubbles:true}))},{passive:false})}
$('editor').onsubmit=e=>e.preventDefault();
for(const id of ['title','titleAlign','decoration','emoji'])$(id).addEventListener('input',()=>{stop();live()});
function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function closePngPicker(){$('pngPicker').close()}
$('closePngPicker').onclick=closePngPicker;
$('pngPicker').addEventListener('click',e=>{if(e.target!==$('pngPicker'))return;const r=$('pngPicker').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closePngPicker()});
$('download').onclick=async()=>{const button=$('download');button.disabled=true;try{const snapshot=frames.map(f=>sanitize({...f,marks:(f.marks||[]).map(m=>({...m}))}));await allFonts(snapshot);const common=dimensions(snapshot),box=$('pngChoices');box.replaceChildren();for(let i=0;i<snapshot.length;i++){const f=snapshot[i],card=document.createElement('button');card.type='button';card.className='pngChoice';card.setAttribute('aria-label','이미지 '+(i+1)+' PNG 다운로드');const thumb=document.createElement('div');thumb.className='pngThumb';const canvas=document.createElement('canvas');S.render(canvas,{...f,outputWidth:common.outputWidth,priceWidth:common.priceWidth});thumb.append(canvas);const info=document.createElement('div');info.className='pngInfo';const name=document.createElement('strong');name.textContent='이미지 '+(i+1);const label=document.createElement('span');label.textContent=S.parseRows(f.rows).find(r=>!r.blank)?.text||f.title.trim()||'빈 이미지';const size=document.createElement('small');size.textContent=canvas.width+' × '+canvas.height+'px';info.append(name,label,size);card.append(thumb,info);card.onclick=async()=>{card.disabled=true;try{const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG를 만들지 못했어요.');saveBlob(blob,'시그표_'+(i+1)+'.png');closePngPicker();status('이미지 '+(i+1)+'을 투명 PNG로 저장했어요.')}catch(e){status(e.message)}finally{card.disabled=false}};box.append(card)}$('pngPicker').showModal()}catch(e){status(e.message)}finally{button.disabled=false}};
async function pngFramePixels(canvas){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('PNG 프레임을 만들지 못했어요.');const url=URL.createObjectURL(blob);try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('PNG 프레임을 읽지 못했어요.'));image.src=url});const copy=document.createElement('canvas');copy.width=canvas.width;copy.height=canvas.height;const ctx=copy.getContext('2d');ctx.drawImage(image,0,0);return ctx.getImageData(0,0,copy.width,copy.height).data}finally{URL.revokeObjectURL(url)}}
function writeGifFrame(gif,rgba,w,h,seconds){const {quantize,applyPalette}=window.SigGifCodec;let count=0;for(let i=3;i<rgba.length;i+=4)if(rgba[i]>=128)count++;const visible=new Uint8Array(Math.max(4,count*4));let at=0;for(let i=0;i<rgba.length;i+=4){if(rgba[i+3]<128)continue;visible[at++]=rgba[i];visible[at++]=rgba[i+1];visible[at++]=rgba[i+2];visible[at++]=255}const palette=quantize(visible,255,{format:'rgb565'});if(!palette.length)palette.push([0,0,0]);const indexed=applyPalette(rgba,palette,'rgb565');for(let i=0;i<indexed.length;i++)indexed[i]=rgba[i*4+3]<128?0:indexed[i]+1;gif.writeFrame(indexed,w,h,{palette:[[0,0,0],...palette],transparent:true,transparentIndex:0,delay:seconds*1000,repeat:0,dispose:2})}
$('gif').onclick=async()=>{const button=$('gif'),snapshot=frames.map(f=>sanitize({...f,marks:(f.marks||[]).map(m=>({...m}))}));if(snapshot.length<2){status('이미지를 두 장 이상 추가해주세요.');return}button.disabled=true;stop();try{await allFonts(snapshot);const d=dimensions(snapshot),ratio=4,w=d.outputWidth*ratio,h=d.outputHeight*ratio;if(w*h>12000000||h>16000)throw Error('고화질 GIF가 너무 커요. 메뉴를 나눠주세요.');const gif=window.SigGifCodec.GIFEncoder();for(let i=0;i<snapshot.length;i++){status('고화질 PNG → GIF · '+(i+1)+' / '+snapshot.length);await new Promise(resolve=>setTimeout(resolve,0));const canvas=document.createElement('canvas');S.render(canvas,{...snapshot[i],...d,pixelRatio:ratio});const rgba=await pngFramePixels(canvas);writeGifFrame(gif,rgba,w,h,snapshot[i].duration);canvas.width=canvas.height=1}gif.finish();saveBlob(new Blob([gif.bytes()],{type:'image/gif'}),'시그표_고화질_무한반복.gif');status('고화질 GIF 저장 완료 · 원래 표시 크기 '+d.outputWidth+' × '+d.outputHeight+'px · 파일 해상도 '+w+' × '+h+'px')}catch(e){status(e.message)}finally{button.disabled=frames.length<2}};
frameButtons();sync();allFonts().then(draw).catch(e=>status(e.message));
})();
</script></body></html>
