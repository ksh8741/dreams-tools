$('preview').addEventListener('pointerdown',e=>{if(e.button!==0||playing||!layout?.photo)return;const p=point(e),r=layout.photo,hit=12*layout.width/$('preview').getBoundingClientRect().width,corners=[[r.x,r.y,'nw'],[r.x+r.bw,r.y,'ne'],[r.x,r.y+r.bh,'sw'],[r.x+r.bw,r.y+r.bh,'se']],c=corners.find(([x,y])=>Math.abs(p.x-x)<=hit&&Math.abs(p.y-y)<=hit);if(!c&&!(p.x>=r.x&&p.x<=r.x+r.bw&&p.y>=r.y&&p.y<=r.y+r.bh))return;drag={start:p,rect:{...r},corner:c?.[2],width:state.photoWidth,canvasWidth:layout.width};$('preview').setPointerCapture(e.pointerId);e.preventDefault()});
$('preview').addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),r=drag.rect,dx=p.x-drag.start.x,dy=p.y-drag.start.y;if(!drag.corner){state.photoX=Math.max(0,r.x+dx);state.photoY=Math.max(0,r.y+dy)}else{const left=drag.corner.includes('w'),top=drag.corner.includes('n'),delta=(Math.abs(dx)>Math.abs(dy)?(left?-dx:dx)/r.bw:(top?-dy:dy)/r.bh),scale=Math.max(.2,1+delta);state.photoWidth=Math.max(20,Math.min(720,drag.width*scale));if(left)state.photoX=Math.max(0,r.x+r.bw-r.bw*scale);if(top)state.photoY=Math.max(0,r.y+r.bh-r.bh*scale)}draw();e.preventDefault()});
for(const evt of ['pointerup','pointercancel','lostpointercapture'])$('preview').addEventListener(evt,()=>{if(drag){drag=null;if(layout.photo){state.photoX=layout.photo.x;state.photoY=layout.photo.y;state.photoWidth=layout.photo.w}draw();save()}});
$('sample').onclick=()=>{Object.assign(state,{title:DEFAULT.title,rows:DEFAULT.rows,footer:''});sync();save()};$('reset').onclick=()=>{$('resetConfirm').hidden=false};$('cancelReset').onclick=()=>{$('resetConfirm').hidden=true};$('confirmReset').onclick=()=>{state.title='';state.rows='';state.footer='';$('resetConfirm').hidden=true;sync();save()};
function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function png(){try{await allFonts();const c=document.createElement('canvas');S.render(c,{...state,...dimensions()});const b=await new Promise(r=>c.toBlob(r,'image/png'));if(!b)throw Error('PNG를 만들지 못했어요.');saveBlob(b,'시그표_'+(index+1)+'.png');status('현재 이미지를 투명 PNG로 저장했어요.')}catch(e){status(e.message)}}$('download').onclick=png;$('downloadMobile').onclick=png;
// GIF89a: fixed transparent palette, full-frame disposal, infinite loop.
function encodeGIF(images,w,h,delays){const out=new Uint8Array(Math.ceil(w*h*images.length*1.16)+images.length*64+2048);let pos=0;const byte=v=>{if(pos>=out.length)throw Error('GIF 용량을 초과했어요.');out[pos++]=v&255},word=v=>{byte(v);byte(v>>8)},str=s=>{for(const c of s)byte(c.charCodeAt(0))};str('GIF89a');word(w);word(h);byte(247);byte(0);byte(0);for(let i=0;i<256;i++){if(i===0||i>252){byte(0);byte(0);byte(0)}else{let n=i-1;byte(Math.round(Math.floor(n/42)*255/5));byte(Math.round(Math.floor(n%42/6)*255/6));byte(Math.round(n%6*255/5))}}byte(33);byte(255);byte(11);str('NETSCAPE2.0');byte(3);byte(1);word(0);byte(0);
 images.forEach((data,k)=>{byte(33);byte(249);byte(4);byte(9);word(Math.max(2,Math.round(delays[k]*100)));byte(0);byte(0);byte(44);word(0);word(0);word(w);word(h);byte(0);byte(8);const packed=new Uint8Array(255);let block=0;const flush=()=>{if(!block)return;byte(block);for(let j=0;j<block;j++)byte(packed[j]);block=0};const packedByte=v=>{packed[block++]=v;if(block===255)flush()};let bits=0,acc=0,count=0;const code=n=>{acc|=n<<bits;bits+=9;while(bits>=8){packedByte(acc&255);acc>>>=8;bits-=8}};code(256);for(let i=0;i<data.length;i+=4){if(count===200){code(256);count=0}const idx=data[i+3]<128?0:1+Math.round(data[i]*5/255)*42+Math.round(data[i+1]*6/255)*6+Math.round(data[i+2]*5/255);code(idx);count++}code(257);if(bits)packedByte(acc&255);flush();byte(0)});byte(59);return out.slice(0,pos)}
$('gif').onclick=async()=>{const b=$('gif');b.disabled=true;try{stop();await allFonts();const d=dimensions(),pixels=d.outputWidth*d.outputHeight*frames.length;if(pixels>18000000)throw Error('GIF가 너무 커요. 너비를 줄이거나 이미지를 나눠주세요.');const images=[];for(let i=0;i<frames.length;i++){status('움짤 생성 중 · '+(i+1)+' / '+frames.length);await new Promise(r=>setTimeout(r,0));const c=document.createElement('canvas');S.render(c,{...frames[i],...d});images.push(c.getContext('2d').getImageData(0,0,c.width,c.height).data)}const bytes=encodeGIF(images,d.outputWidth,d.outputHeight,frames.map(f=>f.duration));saveBlob(new Blob([bytes],{type:'image/gif'}),'시그표_무한반복.gif');status('무한 반복 GIF로 저장했어요.')}catch(e){status(e.message)}finally{b.disabled=false}};
function base64(bytes){let str='';for(let i=0;i<bytes.length;i+=8192)str+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unbase64(s){const str=atob(s.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(str,c=>c.charCodeAt(0))}
async function pack(data){const bytes=new TextEncoder().encode(JSON.stringify(data));if(typeof CompressionStream!=='undefined'){const stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));return'g'+base64(new Uint8Array(await new Response(stream).arrayBuffer()))}return'j'+base64(bytes)}
async function unpack(text){let bytes=unbase64(text.slice(1));if(text[0]==='g'){const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));bytes=new Uint8Array(await new Response(stream).arrayBuffer())}return JSON.parse(new TextDecoder().decode(bytes))}
$('broadcast').onclick=async()=>{try{await allFonts();const payload={v:4,frames:frames.map(clean)};const encoded=await pack(payload),url=new URL(location.href);url.search='';url.hash='broadcast='+encoded;if(url.href.length>1800000)throw Error('사진 때문에 URL이 너무 길어요. 이미지 수나 사진 해상도를 줄여주세요.');$('broadcastUrl').value=url.href;$('urlBox').hidden=false;try{await navigator.clipboard.writeText(url.href);status('방송 URL을 복사했어요. OBS·FreecShot의 웹 URL 소스에 넣으세요.')}catch(_){$('broadcastUrl').select();status('생성한 URL을 복사해 방송 웹 소스에 넣으세요.')}}catch(e){status(e.message)}};
$('copyUrl').onclick=async()=>{try{await navigator.clipboard.writeText($('broadcastUrl').value);status('방송 URL을 복사했어요.')}catch(_){$('broadcastUrl').select();status('선택된 URL을 복사해주세요.')}};
async function hydrate(items){const result=[];for(const item of items.slice(0,12)){const f=S.normalize({...DEFAULT,...item});f.duration=Math.max(.2,Math.min(120,Number(f.duration)||3));if(/^data:image\/(png|jpeg|webp|gif);base64,/.test(f.photoData||'')){try{f.photoImage=await decode(f.photoData)}catch(_){f.photoData=''}}else f.photoData='';result.push(f)}return result.length?result:[{...DEFAULT}]}
async function init(){loading=true;const match=location.hash.match(/^#broadcast=([A-Za-z0-9_-]+)$/);if(match){document.documentElement.classList.add('broadcastOverlay');try{const payload=await unpack(match[1]);if(payload.v!==4||!Array.isArray(payload.frames))throw Error();frames=await hydrate(payload.frames);await allFonts();const d=dimensions(),c=$('broadcastCanvas');let i=0;const tick=()=>{S.render(c,{...frames[i],...d});const delay=frames[i].duration;i=(i+1)%frames.length;playTimer=setTimeout(tick,delay*1000)};tick()}catch(e){$('broadcastError').textContent='방송 소스를 불러오지 못했어요. URL을 다시 생성해주세요.'}loading=false;return}
 try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.frames){frames=await hydrate(saved.frames);index=Math.min(frames.length-1,Math.max(0,saved.index||0))}else{const old=JSON.parse(localStorage.getItem('yoning_sig_table_v3')||'null');if(old)frames=await hydrate([old])}}catch(_){}state=frames[index];sync();loading=false}
init();
