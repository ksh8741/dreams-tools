</style></head><body><iframe class="nav" src="navbar.html" title="상단 메뉴" scrolling="no"></iframe><main><div class="head"><h1>전적</h1><div class="actions"><a class="source" href="https://eloboard.com/players/326?tab=matches" target="_blank" rel="noopener">ELO 원문 ↗</a><button id="refresh" class="primary">새로고침</button></div></div><div class="division" id="division" hidden><div class="divisionhead"><h2>경기 구분</h2><button id="scopeAll" aria-pressed="true">전체 경기</button></div><div class="divisioncards"><button id="scopeMajor" aria-pressed="false"><span class="divisiontitle">주요 경기</span><span class="divisiontype">대회 · 대전 · 리그 등</span><strong id="majorCount"></strong><span id="majorStats"></span></button><button id="scopeSponsored" aria-pressed="false"><span class="divisiontitle">스폰</span><span class="divisiontype">스폰 경기</span><strong id="sponsoredCount"></strong><span id="sponsoredStats"></span></button></div></div><div class="scopeHeading" id="scopeHeading">전체 경기</div><div class="summary" id="summary"></div><p class="status" id="status" role="status"></p><section id="journey" hidden><div class="storygrid" id="stories"></div><div class="journeygrid"><section class="section"><h2>연도별 전적</h2><div id="years"></div></section><section class="section"><h2>누적 승리 기록</h2><div id="milestones"></div><p class="sub">기록된 경기의 누적 승수 기준</p></section></div></section><section class="section" id="analysis" hidden><div class="sectionhead"><div><h2>경기 기록</h2><div class="sub" id="coverage"></div></div><button id="export">조회 기록 CSV 저장</button></div><div class="filters"><label>상대 이름<input id="opponent" placeholder="이름 검색" autocomplete="off"></label><label>상대 종족<select id="race"><option value="">전체 종족</option><option value="T">테란</option><option value="Z">저그</option><option value="P">프로토스</option></select></label><label>경기 분류<select id="category"><option value="">전체 경기</option></select></label><label>시작일<input id="from" type="date"></label><label>종료일<input id="to" type="date"></label><div class="filteractions"><button id="reset">초기화</button></div></div><div class="sub" id="filterInfo"></div><div class="mini"><div class="panel"><h3>최근 전적</h3><div id="recentStats" class="sub"></div><div class="form" id="form"></div></div><div class="panel"><h3>종족별 승률</h3><div id="races"></div></div></div><div class="grid2"><div><h3>상대별 전적</h3><div id="rivals"></div></div><div><h3>맵별 전적</h3><div id="maps"></div></div></div><div class="tablewrap"><table><thead><tr><th>결과</th><th>날짜</th><th>상대</th><th>종족</th><th>맵</th><th>분류</th><th>방식</th><th>ELO 변화</th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot"><span id="pageLabel"></span><div><button id="prev">이전</button><button id="next">다음</button></div></div></section></main>
<script type="application/json" id="seed">{"summary": {"total": 0, "wins": 0, "losses": 0, "rate": 0}, "matches": [], "complete": false}</script><script>
'use strict';const $=id=>document.getElementById(id),KEY='yoning_elo_full_v2';const categories={pro_league:'프로리그',team_event:'팀리그',college_event:'대학리그',college_war:'대학대전',college_mini:'미니대전',solo_event:'개인리그',sponsored:'스폰'};let scope='all';let data=JSON.parse($('seed').textContent),page=0,filtered=[],busy=false;const size=15,escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),rate=(w,n)=>n?(w/n*100).toFixed(1):'0.0';
function valid(d){return d&&d.summary&&Number.isFinite(d.summary.total)&&Array.isArray(d.matches)&&d.matches.every(m=>Number.isFinite(m.id)&&typeof m.win==='boolean'&&typeof m.date==='string'&&typeof m.opponent==='string')}
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(valid(d)&&d.complete&&d.fetchedAt)data=d}catch{}
function scopeMatches(){return data.matches.filter(m=>scope==='all'||(scope==='sponsored'?m.category==='sponsored':m.category!=='sponsored'))}
function summarize(){const m=scopeMatches(),wins=m.filter(r=>r.win).length,s={total:m.length,wins},op=new Set(m.map(r=>r.opponentId||r.opponent)),years=new Set(m.map(r=>r.date.slice(0,4)));let streak=0,best=0;for(const r of [...m].reverse()){streak=r.win?streak+1:0;best=Math.max(best,streak)}const full=data.complete;$('summary').innerHTML=[['총 경기',full?s.total.toLocaleString()+'<small>전</small>':'수집 대기'],['승리',full?s.wins.toLocaleString()+'<small>승</small>':'—'],['최다 연승',full?best+'<small>연승</small>':'—'],['상대 선수',full?op.size+'<small>명</small>':'—']].map(([k,v])=>'<div class="stat"><label>'+k+'</label><b>'+v+'</b></div>').join('');$('coverage').textContent=full?({all:'전체 경기',major:'주요 경기',sponsored:'스폰'}[scope])+' · '+s.total.toLocaleString()+'경기':'공용 기록 준비 중';$('division').hidden=!full;renderDivisions();$('journey').hidden=!full;$('analysis').hidden=!full;if(full)renderStories();}
function renderStories(){const m=scopeMatches(),asc=[...m].reverse(),byYear=new Map;for(const r of m){const y=r.date.slice(0,4),g=byYear.get(y)||{n:0,w:0};g.n++;g.w+=Number(r.win);byYear.set(y,g)}const max=Math.max(1,...[...byYear.values()].map(g=>g.n));$('years').innerHTML=[...byYear].sort((a,b)=>b[0].localeCompare(a[0])).map(([y,g])=>'<div class="yearrow"><b>'+y+'</b><div class="yeartrack"><i style="width:'+g.n/max*100+'%"></i></div><span>'+g.n+'전 · '+g.w+'승<br><small>승률 '+rate(g.w,g.n)+'%</small></span></div>').join('');let streak=0,best=0,end=null;for(const r of asc){streak=r.win?streak+1:0;if(streak>best){best=streak;end=r.date}}const rivals=new Map;for(const r of m){const k=r.opponentId||r.opponent,v=rivals.get(k)||{name:r.opponent,n:0,w:0};v.n++;v.w+=Number(r.win);rivals.set(k,v)}const rival=[...rivals.values()].sort((a,b)=>b.n-a.n)[0],recent=m.slice(0,30),previous=m.slice(30,60),rw=recent.filter(r=>r.win).length,pw=previous.filter(r=>r.win).length,diff=previous.length?Number(rate(rw,recent.length))-Number(rate(pw,previous.length)):null;const cards=[['첫 경기',asc[0]?.date||'—',asc[0]?'상대 '+asc[0].opponent+' · '+(asc[0].win?'승리':'패배'):''],['최다 연승',best+'연승',end?end+' 달성':'승리 기록 없음'],['최다 상대',rival?.name||'—',rival?rival.n+'전 '+rival.w+'승 '+(rival.n-rival.w)+'패':''],['최근 30경기 승률',rate(rw,recent.length)+'%',diff===null?'최근 '+recent.length+'경기 기준':'최근 30경기 · 직전 30경기보다 '+(diff>=0?'+':'')+diff.toFixed(1)+'%p']];$('stories').innerHTML=cards.map(([k,v,d])=>'<article class="story"><span>'+escape(k)+'</span><strong>'+escape(v)+'</strong><p>'+escape(d)+'</p></article>').join('');const milestone=[];let w=0;for(const r of asc){if(!r.win)continue;w++;if([1,100,500,1000,1500,2000,3000].includes(w))milestone.push([w,r])}$('milestones').innerHTML=milestone.map(([w,r])=>'<div class="milestone"><b>'+w.toLocaleString()+'번째 승리</b><span>'+escape(r.date)+' · '+escape(r.opponent)+' · '+escape(r.map)+'</span></div>').join('');}
function renderDivisions(){for(const [id,rows] of [['major',data.matches.filter(m=>m.category!=='sponsored')],['sponsored',data.matches.filter(m=>m.category==='sponsored')]]){const w=rows.filter(m=>m.win).length;$(id+'Count').textContent=rows.length.toLocaleString()+'경기';$(id+'Stats').textContent=w.toLocaleString()+'승 '+(rows.length-w).toLocaleString()+'패 · 승률 '+rate(w,rows.length)+'%'}for(const [id,key] of [['scopeAll','all'],['scopeMajor','major'],['scopeSponsored','sponsored']])$(id).setAttribute('aria-pressed',String(scope===key));$('scopeHeading').textContent={all:'전체 경기',major:'주요 경기',sponsored:'스폰'}[scope];}
function selectScope(next){scope=next;page=0;$('category').value='';summarize();render();}
$('scopeAll').onclick=()=>selectScope('all');$('scopeMajor').onclick=()=>selectScope('major');$('scopeSponsored').onclick=()=>selectScope('sponsored');
function groups(field,id){const g=new Map;for(const m of filtered){const key=m[field]||'미등록',v=g.get(key)||{n:0,w:0};v.n++;v.w+=Number(m.win);g.set(key,v)}$(id).innerHTML=[...g].sort((a,b)=>b[1].n-a[1].n).slice(0,8).map(([k,v])=>'<div class="group"><b>'+escape(k)+'</b><span>'+v.w+'승 '+(v.n-v.w)+'패 · '+rate(v.w,v.n)+'%</span></div>').join('')||'<div class="sub">해당 기록이 없어요.</div>'}
function render(){const q=$('opponent').value.trim().toLocaleLowerCase(),race=$('race').value,cat=$('category').value,from=$('from').value,to=$('to').value;filtered=scopeMatches().filter(m=>(!q||m.opponent.toLocaleLowerCase().includes(q))&&(!race||m.race===race)&&(!cat||m.category===cat)&&(!from||m.date>=from)&&(!to||m.date<=to));const w=filtered.filter(m=>m.win).length;$('filterInfo').textContent=from&&to&&from>to?'시작일을 종료일 이전으로 선택해주세요.':'조회 조건에 맞는 '+filtered.length+'경기 · '+w+'승 '+(filtered.length-w)+'패 · 승률 '+rate(w,filtered.length)+'%';const recent=filtered.slice(0,10);$('recentStats').textContent='조회 결과 최근 '+recent.length+'경기 · 왼쪽부터 최신순';$('form').innerHTML=recent.map(m=>'<span class="pill '+(m.win?'win':'loss')+'" title="'+escape(m.date+' · '+m.opponent)+'">'+(m.win?'승':'패')+'</span>').join('')||'기록이 없어요.';$('races').innerHTML=['T','Z','P'].map(r=>{const a=filtered.filter(m=>m.race===r),w=a.filter(m=>m.win).length;return '<div class="raceRow"><span>'+({T:'테란',Z:'저그',P:'프로토스'}[r])+'</span><div class="rail"><i style="width:'+rate(w,a.length)+'%"></i></div><small>'+w+'승 '+(a.length-w)+'패</small></div>'}).join('');groups('opponent','rivals');groups('map','maps');page=Math.min(page,Math.max(0,Math.ceil(filtered.length/size)-1));$('rows').innerHTML=filtered.slice(page*size,(page+1)*size).map(m=>'<tr><td><span class="pill '+(m.win?'win':'loss')+'">'+(m.win?'승':'패')+'</span></td><td>'+escape(m.date)+'</td><td><strong>'+escape(m.opponent)+'</strong></td><td>'+escape(m.race)+'</td><td>'+escape(m.map)+'</td><td>'+escape(categories[m.category]||m.category||'기타')+'</td><td>'+escape(m.format)+'</td><td class="delta '+(m.delta>=0?'positive':'negative')+'">'+(m.delta==null?'—':(m.delta>0?'+':'')+m.delta.toFixed(1))+'</td></tr>').join('')||'<tr><td colspan="8" class="empty">해당 조건의 경기 기록이 없어요.</td></tr>';$('pageLabel').textContent=filtered.length?(page+1)+' / '+Math.ceil(filtered.length/size):'0경기';$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=filtered.length;$('export').disabled=!filtered.length;}
function status(text,warn=false){$('status').textContent=text;$('status').classList.toggle('warn',warn)}
async function sync(){if(busy)return;busy=true;$('refresh').disabled=true;try{const r=await fetch('/api/elo',{signal:AbortSignal.timeout(15000)});if(!r.ok)throw Error('공용 기록 조회 실패');const d=await r.json();if(!valid(d)||!d.complete||d.summary.total!==d.matches.length)throw Error('공용 기록 검증 실패');data=d;try{localStorage.setItem(KEY,JSON.stringify(d))}catch{}summarize();render();status('전체 '+d.matches.length.toLocaleString()+'경기 · 최근 확인 '+new Date(d.checkedAt||d.fetchedAt).toLocaleString('ko-KR'))}catch{status(data.complete?'최신 기록을 확인하지 못해 마지막 저장 기록을 표시하고 있어요.':'전적을 준비 중입니다. 잠시 후 다시 확인해주세요.',true)}finally{busy=false;$('refresh').disabled=false}}
for(const [key,name]of Object.entries(categories)){const o=document.createElement('option');o.value=key;o.textContent=name;$('category').append(o)}for(const id of ['opponent','race','category','from','to'])$(id).addEventListener(id==='opponent'?'input':'change',()=>{page=0;render()});$('reset').onclick=()=>{for(const id of ['opponent','race','category','from','to'])$(id).value='';page=0;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('refresh').onclick=sync;$('export').onclick=()=>{const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'").replaceAll('"','""')+'"';const rows=[['날짜','결과','상대','종족','맵','분류','방식','ELO 변화'],...filtered.map(m=>[m.date,m.win?'승':'패',m.opponent,m.race,m.map,categories[m.category]||m.category,m.format,m.delta])];const url=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='요닝_조회전적.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};summarize();render();status(data.complete?'마지막 전체 기록을 표시하고 있어요.':'공용 기록 불러오는 중');sync();setInterval(()=>{if(!document.hidden)sync()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
