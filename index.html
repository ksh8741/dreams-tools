<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무제</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:#fff;color:#111}
body{overflow:hidden}
#intro{
  position:fixed;inset:0;z-index:1000;background:#fff;
  display:flex;align-items:center;justify-content:center;
}
#intro img{
  width:100%;height:100%;object-fit:contain;object-position:center;
  background:#fff;user-select:none;-webkit-user-drag:none
}
#enter{
  position:absolute;left:50%;bottom:28px;transform:translateX(-50%);
  border:1px solid rgba(0,0,0,.25);background:rgba(255,255,255,.82);
  color:#111;padding:11px 28px;border-radius:999px;
  font-size:12px;font-weight:900;letter-spacing:2px;cursor:pointer;
  backdrop-filter:blur(8px)
}
#intro.hide{opacity:0;pointer-events:none;transition:opacity .28s ease}
main{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px;background:#f7f7f7
}
.home{
  width:min(720px,100%);background:#fff;border:1px solid #ddd;
  padding:42px 36px;text-align:center
}
.home h1{margin:0 0 10px;font-size:42px}
.home p{margin:0 0 28px;color:#666}
.home a{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:180px;height:48px;background:#111;color:#fff;
  text-decoration:none;font-weight:900
}
</style>
</head>
<body>

<div id="intro">
  <img src="home-hero.png" alt="">
  <audio id="introAudio" src="home-intro.mp3" preload="auto"></audio>
  <button id="enter" type="button">ENTER</button>
</div>

<main>
  <section class="home">
    <h1>무제</h1>
    <p>배틀그라운드 킬 현황판</p>
    <a href="pubg.html">BATTLEGROUNDS</a>
  </section>
</main>

<script>
(()=>{
  const intro=document.getElementById('intro');
  const audio=document.getElementById('introAudio');
  const enter=document.getElementById('enter');

  const play=()=>audio.play().catch(()=>{});
  play();

  const unlock=()=>{ if(audio.paused) play(); };
  window.addEventListener('pointerdown',unlock,{once:true});
  window.addEventListener('keydown',unlock,{once:true});

  enter.addEventListener('click',()=>{
    unlock();
    intro.classList.add('hide');
    setTimeout(()=>{
      intro.remove();
      document.body.style.overflow='auto';
    },300);
  });
})();
</script>
</body>
</html>
