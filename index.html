:1px solid #e2e6ea;display:grid;place-items:center;font-size:9px}.rounds>div:first-child{background:#151c23;color:#fff}.teamboards{display:grid;gap:5px;min-width:0}.tb{min-width:0;border:1px solid #dfe4e8;overflow:hidden}.tbtitle{height:30px;background:#151c23;color:#fff;padding:0 6px;display:flex;align-items:center;font-size:9px;font-weight:900}.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:clamp(5px,.42vw,9px)}.tbl th,.tbl td{height:30px;border-top:1px solid #e5e9ed;border-right:1px solid #e5e9ed;text-align:center;padding:1px;overflow:hidden}.tbl th{background:#f6f7f8}.tbl input[type=number]{width:62%;min-width:0}.tbl select{width:100%;border:0;background:transparent;font-size:inherit}.add{width:100%;margin-top:6px}.overlay{position:fixed;inset:0;background:#10182088;display:grid;place-items:center;z-index:40}.modal{width:min(470px,calc(100% - 28px));background:#fff;border-radius:14px;padding:20px;max-height:85vh;overflow:auto}.field{margin:9px 0}.field label{display:block;font-size:11px;font-weight:850;margin-bottom:5px}.field input{width:100%;padding:10px;border:1px solid #dce2e7;border-radius:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}.err{font-size:11px;color:#d84b60}.cand{display:grid;grid-template-columns:44px 1fr 62px;gap:9px;align-items:center;padding:9px;border:1px solid #e0e5ea;border-radius:9px;margin-top:7px;cursor:pointer}.cand img{width:44px;height:44px;border-radius:50%;object-fit:cover}.ghost{position:fixed;pointer-events:none;z-index:99;background:#151c23f2;color:#fff;border:1px solid #d59a26;border-radius:9px;padding:8px 12px;box-shadow:0 14px 35px #0004;font-size:12px;font-weight:950;transform:translate(12px,12px)}@media(max-width:1000px){.grid{grid-template-columns:1fr}.deathItems{grid-template-columns:1fr 1fr}}

<header><div class="brand">DREAMS</div><div class="nav"><span>홈</span><span class="on">BATTLEGROUNDS</span><span>빙고</span><span>랜덤팀</span><span>대결미션</span></div></header>
<main>
<section id="lobby"><div class="top"><div class="title"><h1>배틀그라운드</h1><p>DREAMS MATCH ROOM</p></div><div><button id="refresh" class="btn">새로고침</button> <button id="showCreate" class="btn primary">＋ 방 생성</button></div></div><div class="panel rooms"><div class="rh"><div>#</div><div>방제</div><div>방장</div><div>팀 구성</div><div>잠금</div></div><div id="roomList"><div class="empty">불러오는 중...</div></div></div></section>
<section id="roomView" class="hidden"><div class="top"><div><h1 id="insideTitle" style="margin:0;font-size:20px"></h1><div id="insideMeta" class="meta"></div></div><button id="back" class="btn">← 방 목록</button></div><div class="grid"><div class="panel sec"><div class="sect"><h2>킬 현황</h2><span class="sub">이름 입력 · 드래그 슬롯 맞교환</span></div><div class="scoreWrap"><div id="score" class="score"></div></div></div><div class="panel sec"><div class="sect"><h2>게임 세팅</h2><span class="sub">RULE SET</span></div><div class="settings"><div class="set">일반 치킨 보너스<input id="ck" type="number" min="0"></div><div class="set">사녹 치킨 보너스<input id="sk" type="number" min="0"></div><div class="set wide"><label><input id="t10" type="checkbox"> 탑텐 진입 시 마이너스 없음</label></div></div><div class="death"><div style="font-size:9px;margin-bottom:4px">선수별 데스당 마이너스</div><div id="deathItems" class="deathItems"></div></div></div></div><div class="panel kill"><div class="sect"><h2>킬 기록</h2><span class="sub">ALL TEAMS · HORIZONTAL</span></div><div class="board"><div id="rounds" class="rounds"></div><div id="teamboards" class="teamboards"></div></div><button id="addRound" class="btn add">추가</button></div></section>
</main>
<div id="createOv" class="overlay hidden"><div class="modal"><h2>방 생성</h2><div class="meta" style="margin-bottom:10px">최대 16명 · 한 파티 최대 4명 · 8:8은 A+B vs C+D처럼 자동 분할</div><div class="field"><label>방제</label><input id="cn"></div><div class="field"><label>방장</label><input id="ch"></div><div class="two"><div class="field"><label>진영 수</label><input id="tc" type="number" min="2" max="16" value="4"></div><div class="field"><label>진영당 인원</label><input id="pp" type="number" min="1" max="16" value="4"></div></div><div class="field"><label>비밀번호 (선택)</label><input id="cp" type="password"></div><div id="ce" class="err"></div><div class="actions"><button id="cc" class="btn">취소</button><button id="cb" class="btn primary">생성</button></div></div></div>
<div id="joinOv" class="overlay hidden"><div class="modal"><h2 id="jt"></h2><div id="jm" class="meta"></div><div id="jpf" class="field"><label>비밀번호</label><input id="jp" type="password"></div><div id="je" class="err"></div><div class="actions"><button id="jc" class="btn">취소</button><button id="jb" class="btn primary">입장</button></div></div></div>
<div id="picker" class="overlay hidden"><div class="modal"><h2 id="pt">SOOP 계정 선택</h2><div id="ph" class="meta"></div><div id="cands"></div><div class="actions"><button id="noPhoto" class="btn">사진 없이 사용</button><button id="pc" class="btn">취소</button></div></div></div>
<script>
const B='https://llqikrcqavwfbuajykig.supabase.co/rest/v1',K='sb_publishable_aLPzJI_jQLlywmoQsiLRtw_ElX_aslF',H={'apikey':K,'Authorization':'Bearer '+K,'Content-Type':'application/json'},n=x=>Math.max(0,parseInt(x)||0),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cur,pick,P=[],RO=[],S=[],poll,editing=false,pickId=null,pickName='',dragId=null,ghost=null;
async function q(p,o={}){let r=await fetch(B+p,{...o,headers:{...H,...(o.headers||{})}}),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}function cfg(a,b){return Array.from({length:a},()=>b).join(':')}
function partyCountPerSide(){return Math.ceil(cur.players_per_team/4)}
function partyLetter(side,partyIndex){let idx=(side-1)*partyCountPerSide()+partyIndex;return String.fromCharCode(65+idx)}
function sidePartyLabel(side){return Array.from({length:partyCountPerSide()},(_,i)=>partyLetter(side,i)).join('·')}
function sidePlayers(side){return P.filter(p=>Math.floor((p.position-1)/cur.players_per_team)+1===side)}
function partyPlayers(side,partyIndex){return sidePlayers(side).slice(partyIndex*4,partyIndex*4+4)}
function pic(id){return 'https://stimg.sooplive.com/LOGO/'+id.slice(0,2)+'/'+id+'/m/'+id+'.webp'}
async function rooms(){let d=await q('/pubg_rooms?select=id,name,host_name,team_count,players_per_team,password_hash&order=created_at.desc');roomList.innerHTML=d.length?'':'<div class="empty">생성된 방이 없습니다.</div>';d.forEach((r,i)=>{let x=document.createElement('div');x.className='room';x.innerHTML='<div>'+(i+1)+'</div><div class="roomName">'+e(r.name)+'</div><div class="host">'+e(r.host_name)+'</div><div>'+cfg(r.team_count,r.players_per_team)+'</div><div class="lock">'+(r.password_hash?'●':'○')+'</div>';x.onclick=()=>ask(r);roomList.appendChild(x)})}
showCreate.onclick=()=>{ce.textContent='';createOv.classList.remove('hidden')};cc.onclick=()=>createOv.classList.add('hidden');refresh.onclick=rooms;cb.onclick=async()=>{let name=cn.value.trim(),host=ch.value.trim(),a=+tc.value,b=+pp.value;if(!name||!host)return ce.textContent='방제와 방장을 입력하세요';if(a<2||b<1)return ce.textContent='진영 수와 인원을 확인하세요';if(a*b>16)return ce.textContent='최대 참여 인원은 16명입니다. (현재 '+(a*b)+'명)';try{let id=await q('/rpc/create_pubg_room',{method:'POST',body:JSON.stringify({room_name:name,room_password:cp.value,room_host:host,room_team_count:a,room_players_per_team:b})});createOv.classList.add('hidden');enter((await q('/pubg_rooms?id=eq.'+id+'&select=*'))[0])}catch(x){ce.textContent='방 생성 실패'}};
function ask(r){pick=r;jt.textContent=r.name;jm.textContent='방장 '+r.host_name+' · '+cfg(r.team_count,r.players_per_team);jpf.classList.toggle('hidden',!r.password_hash);joinOv.classList.remove('hidden')}jc.onclick=()=>joinOv.classList.add('hidden');jb.onclick=async()=>{let id=await q('/rpc/join_pubg_room',{method:'POST',body:JSON.stringify({room_name:pick.name,room_password:jp.value})});if(!id)return je.textContent='비밀번호가 맞지 않습니다';joinOv.classList.add('hidden');enter((await q('/pubg_rooms?id=eq.'+id+'&select=*'))[0])};
async function ensure(){let a=await q('/pubg_rounds?room_id=eq.'+cur.id+'&select=round_no'),s=new Set(a.map(x=>x.round_no)),x=[];for(let i=1;i<=20;i++)if(!s.has(i))x.push({room_id:cur.id,round_no:i});if(x.length)await q('/pubg_rounds',{method:'POST',body:JSON.stringify(x)})}
async function enter(r){cur=r;lobby.classList.add('hidden');roomView.classList.remove('hidden');insideTitle.textContent=r.name;insideMeta.textContent='방장 '+r.host_name+' · '+cfg(r.team_count,r.players_per_team)+' · 총 '+r.team_count*r.players_per_team+'명 · 파티당 최대 4명';await ensure();await load();clearInterval(poll);poll=setInterval(load,1800)}
async function load(){if(!cur)return;let[r,p,ro]=await Promise.all([q('/pubg_rooms?id=eq.'+cur.id+'&select=*'),q('/pubg_players?room_id=eq.'+cur.id+'&select=*&order=position.asc'),q('/pubg_rounds?room_id=eq.'+cur.id+'&select=*&order=round_no.asc')]);cur=r[0]||cur;P=p;RO=ro;S=RO.length?await q('/pubg_round_player_stats?select=*&round_id=in.('+RO.map(x=>x.id).join(',')+')'):[];if(!editing)render()}
function st(r,p){return S.find(x=>x.round_id===r&&x.player_id===p)||{kills:0,died:false}}function totals(p){let raw=0,minus=0;RO.forEach(r=>{let s=st(r.id,p.id);raw+=n(s.kills);if(s.died&&!(r.top10&&cur.top10_no_death_penalty))minus+=n(p.death_penalty)});return{raw,minus,score:raw-minus}}
async function pickProfile(id,name){pickId=id;pickName=name;let r=await fetch('/api/soop-search?nickname='+encodeURIComponent(name)),j=r.ok?await r.json():{results:[]};pt.textContent='SOOP 계정 선택';ph.textContent='“'+name+'” 검색 결과';cands.innerHTML=(j.results||[]).map(a=>'<div class="cand" data-id="'+e(a.user_id)+'"><img src="'+e(a.profile_image)+'"><div><b>'+e(a.nickname||name)+'</b><div class="meta">'+e(a.user_id)+'</div></div><button class="btn">선택</button></div>').join('')||'<div class="empty">검색 결과 없음</div>';document.querySelectorAll('.cand').forEach(x=>x.onclick=()=>bind(x.dataset.id));picker.classList.remove('hidden')}
async function bind(id){await q('/pubg_players?id=eq.'+pickId,{method:'PATCH',body:JSON.stringify({nickname:pickName,soop_user_id:id,profile_image:pic(id)})});picker.classList.add('hidden');editing=false;load()}noPhoto.onclick=async()=>{await q('/pubg_players?id=eq.'+pickId,{method:'PATCH',body:JSON.stringify({nickname:pickName,soop_user_id:null,profile_image:null})});picker.classList.add('hidden');editing=false;load()};pc.onclick=()=>{picker.classList.add('hidden');editing=false;load()};
async function saveName(x){let name=x.value.trim(),id=x.dataset.name;await q('/pubg_players?id=eq.'+id,{method:'PATCH',body:JSON.stringify({nickname:name,soop_user_id:null,profile_image:null})});if(name)await pickProfile(id,name);else{editing=false;load()}}
function render(){
  ck.value=cur.chicken_kills;sk.value=cur.sanhok_chicken_kills;t10.checked=cur.top10_no_death_penalty;
  let out='';
  for(let side=1;side<=cur.team_count;side++){
    let all=sidePlayers(side),sideScore=0,ch=0;
    all.forEach(p=>sideScore+=totals(p).score);
    RO.filter(r=>r.chicken_team===side).forEach(r=>{ch++;sideScore+=r.map_type==='sanhok'?n(cur.sanhok_chicken_kills):n(cur.chicken_kills)});
    let parties='';
    for(let pi=0;pi<partyCountPerSide();pi++){
      let ps=partyPlayers(side,pi),letter=partyLetter(side,pi);
      parties+='<div class="team"><div class="th">'+letter+' TEAM</div><div class="plist">'+
        ps.map(p=>{let a=totals(p);return '<div class="slot" draggable="true" data-slot="'+p.id+'">'+
        (p.soop_user_id?'<img class="avatar" src="'+pic(p.soop_user_id)+'">':'<span class="avatarEmpty"></span>')+
        '<div><input class="name" data-name="'+p.id+'" value="'+e(p.nickname||'')+'" placeholder="이름 입력">'+
        '<div class="detail"><b>'+a.score+'</b> ( '+a.raw+' - '+a.minus+' )</div></div></div>'}).join('')+
        '</div></div>';
    }
    out+='<div class="sideGroup"><div class="sideHead">'+sidePartyLabel(side)+' TEAM · '+sideScore+(ch?' · 🍗 × '+ch:'')+'</div><div class="partyRow">'+parties+'</div></div>';
  }
  score.innerHTML=out;
  deathItems.innerHTML=P.map(p=>'<div class="di"><span>'+e(p.nickname||'PLAYER '+p.position)+'</span><input data-pen="'+p.id+'" type="number" value="'+n(p.death_penalty)+'"></div>').join('');
  document.querySelectorAll('[data-name]').forEach(x=>{x.onfocus=()=>editing=true;x.onkeydown=a=>{if(a.key==='Enter'){a.preventDefault();x.blur()}};x.onblur=()=>saveName(x)});
  document.querySelectorAll('[data-pen]').forEach(x=>x.onchange=()=>q('/pubg_players?id=eq.'+x.dataset.pen,{method:'PATCH',body:JSON.stringify({death_penalty:n(x.value)})}));
  drag();board()
}
function drag(){document.querySelectorAll('.slot').forEach(s=>{s.ondragstart=a=>{if(a.target.closest('input')){a.preventDefault();return}dragId=s.dataset.slot;s.classList.add('dragging');ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=(P.find(p=>p.id===dragId)?.nickname||'PLAYER');document.body.appendChild(ghost);document.addEventListener('dragover',moveGhost)};s.ondragover=a=>{if(!dragId||dragId===s.dataset.slot)return;a.preventDefault();document.querySelectorAll('.slot.over').forEach(x=>x!==s&&x.classList.remove('over'));s.classList.add('over')};s.ondragleave=()=>s.classList.remove('over');s.ondrop=async a=>{a.preventDefault();let b=s.dataset.slot;if(b!==dragId)await swap(dragId,b);endDrag();editing=false;load()};s.ondragend=endDrag})}function moveGhost(a){if(ghost){ghost.style.left=a.clientX+'px';ghost.style.top=a.clientY+'px'}}function endDrag(){dragId=null;document.querySelectorAll('.slot').forEach(x=>x.classList.remove('dragging','over'));document.removeEventListener('dragover',moveGhost);ghost?.remove();ghost=null}async function swap(aid,bid){let a=P.find(x=>x.id===aid),b=P.find(x=>x.id===bid),ap=a.position,bp=b.position;await q('/pubg_players?id=eq.'+a.id,{method:'PATCH',body:JSON.stringify({position:999999})});await q('/pubg_players?id=eq.'+b.id,{method:'PATCH',body:JSON.stringify({position:ap})});await q('/pubg_players?id=eq.'+a.id,{method:'PATCH',body:JSON.stringify({position:bp})})}
function board(){
  rounds.innerHTML='<div>#</div>'+RO.map(r=>'<div>'+r.round_no+'</div>').join('');
  const totalParties=cur.team_count*partyCountPerSide();
  teamboards.style.gridTemplateColumns='repeat('+totalParties+',minmax(0,1fr))';
  teamboards.innerHTML='';
  for(let side=1;side<=cur.team_count;side++){
    for(let pi=0;pi<partyCountPerSide();pi++){
      let ps=partyPlayers(side,pi),letter=partyLetter(side,pi),d=document.createElement('div');d.className='tb';
      d.innerHTML='<div class="tbtitle">'+letter+' TEAM <span style="margin-left:auto;opacity:.65">'+sidePartyLabel(side)+'진영</span></div>'+
      '<table class="tbl"><thead><tr><th>MAP</th><th>🍗</th>'+ps.map(p=>'<th>'+e(p.nickname||'PLAYER')+'</th>').join('')+'</tr></thead><tbody>'+
      RO.map(r=>'<tr><td><select data-map="'+r.id+'"><option value="normal" '+(r.map_type==='normal'?'selected':'')+'>일</option><option value="sanhok" '+(r.map_type==='sanhok'?'selected':'')+'>사</option></select></td>'+
      '<td><input data-ch="'+r.id+'" data-team="'+side+'" type="checkbox" '+(r.chicken_team===side?'checked':'')+'></td>'+
      ps.map(p=>{let s=st(r.id,p.id);return '<td><input data-k="'+r.id+'|'+p.id+'" type="number" value="'+n(s.kills)+'"> <input data-d="'+r.id+'|'+p.id+'" type="checkbox" '+(s.died?'checked':'')+'>☠</td>'}).join('')+
      '</tr>').join('')+'</tbody></table>';
      teamboards.appendChild(d)
    }
  }
  document.querySelectorAll('[data-map]').forEach(x=>x.onchange=()=>q('/pubg_rounds?id=eq.'+x.dataset.map,{method:'PATCH',body:JSON.stringify({map_type:x.value})}));
  document.querySelectorAll('[data-ch]').forEach(x=>x.onchange=()=>q('/pubg_rounds?id=eq.'+x.dataset.ch,{method:'PATCH',body:JSON.stringify({chicken_team:x.checked?+x.dataset.team:null})}));
  document.querySelectorAll('[data-k]').forEach(x=>x.onchange=()=>saveStat(x.dataset.k,n(x.value),null));
  document.querySelectorAll('[data-d]').forEach(x=>x.onchange=()=>saveStat(x.dataset.d,null,x.checked))
}
async function saveStat(key,k,d){let[r,p]=key.split('|'),o=S.find(x=>x.round_id===r&&x.player_id===p);if(o){let z={};if(k!==null)z.kills=k;if(d!==null)z.died=d;await q('/pubg_round_player_stats?id=eq.'+o.id,{method:'PATCH',body:JSON.stringify(z)})}else await q('/pubg_round_player_stats',{method:'POST',body:JSON.stringify({round_id:r,player_id:p,kills:k??0,died:d??false})})}
ck.onchange=()=>q('/pubg_rooms?id=eq.'+cur.id,{method:'PATCH',body:JSON.stringify({chicken_kills:n(ck.value)})});sk.onchange=()=>q('/pubg_rooms?id=eq.'+cur.id,{method:'PATCH',body:JSON.stringify({sanhok_chicken_kills:n(sk.value)})});t10.onchange=()=>q('/pubg_rooms?id=eq.'+cur.id,{method:'PATCH',body:JSON.stringify({top10_no_death_penalty:t10.checked})});addRound.onclick=async()=>{await q('/pubg_rounds',{method:'POST',body:JSON.stringify({room_id:cur.id,round_no:RO.length?Math.max(...RO.map(x=>x.round_no))+1:1})});editing=false;load()};back.onclick=()=>{cur=null;clearInterval(poll);roomView.classList.add('hidden');lobby.classList.remove('hidden');rooms()};rooms();setInterval(()=>{if(!cur)rooms()},4000);
</script></body></html>
