async function rooms(){let d=await q('/pubg_rooms?select=id,name,host_name,team_count,players_per_team,password_hash&order=created_at.desc');roomList.innerHTML=d.length?'':'<div class="empty">생성된 방이 없습니다.</div>';d.forEach((r,i)=>{let x=document.createElement('div');x.className='room';x.innerHTML='<div>'+(i+1)+'</div><div class="roomName">'+e(r.name)+'</div><div class="host">'+e(r.host_name)+'</div><div>'+cfg(r.team_count,r.players_per_team)+'</div><div class="lock">'+(r.password_hash?'●':'○')+'</div>';x.onclick=()=>ask(r);roomList.appendChild(x)})}
showCreate.onclick=()=>{ce.textContent='';createOv.classList.remove('hidden')};
cc.onclick=()=>createOv.classList.add('hidden');refresh.onclick=rooms;
cb.onclick=async()=>{
  let name=cn.value.trim(),host=ch.value.trim(),a=+tc.value,b=+pp.value,mode=document.getElementById('scoreMode')?.value||'separate';
  if(!name||!host)return ce.textContent='방제와 방장을 입력하세요';
  if(a<2||a>4)return ce.textContent='팀은 2~4팀까지만 가능합니다.';
  if(b<1||b>4)return ce.textContent='한 팀에는 최대 4명까지만 가능합니다.';
  if(a*b>16)return ce.textContent='최대 참여 인원은 16명입니다.';
  if(mode==='2v2'&&a!==4)return ce.textContent='A+B vs C+D 모드는 4팀일 때만 사용할 수 있습니다.';
  try{
    let id=await q('/rpc/create_pubg_room',{method:'POST',body:JSON.stringify({room_name:name,room_password:cp.value,room_host:host,room_team_count:a,room_players_per_team:b})});
    createOv.classList.add('hidden');
    let rr=(await q('/pubg_rooms?id=eq.'+id+'&select=*'))[0];
    if(rr){try{await q('/pubg_rooms?id=eq.'+id,{method:'PATCH',body:JSON.stringify({score_mode:mode})});rr.score_mode=mode}catch(_){}}
    enter(rr||{id,name,host_name:host,team_count:a,players_per_team:b,chicken_kills:8,sanhok_chicken_kills:5,top10_no_death_penalty:false,score_mode:mode});
  }catch(x){ce.textContent='방 생성 실패'}
};
function ask(r){pick=r;jt.textContent=r.name;jm.textContent='방장 '+r.host_name+' · '+cfg(r.team_count,r.players_per_team);jpf.classList.toggle('hidden',!r.password_hash);joinOv.classList.remove('hidden')}jc.onclick=()=>joinOv.classList.add('hidden');jb.onclick=async()=>{let id=await q('/rpc/join_pubg_room',{method:'POST',body:JSON.stringify({room_name:pick.name,room_password:jp.value})});if(!id)return je.textContent='비밀번호가 맞지 않습니다';joinOv.classList.add('hidden');enter((await q('/pubg_rooms?id=eq.'+id+'&select=*'))[0])};
async function ensure(){let a=await q('/pubg_rounds?room_id=eq.'+cur.id+'&select=round_no'),s=new Set(a.map(x=>x.round_no)),x=[];for(let i=1;i<=20;i++)if(!s.has(i))x.push({room_id:cur.id,round_no:i});if(x.length)await q('/pubg_rounds',{method:'POST',body:JSON.stringify(x)})}
async function enter(r){cur=r;lobby.classList.add('hidden');roomView.classList.remove('hidden');insideTitle.textContent=r.name;insideMeta.textContent='방장 '+r.host_name+' · '+cfg(r.team_count,r.players_per_team)+' · 총 '+r.team_count*r.players_per_team+'명 · 팀당 최대 4명';await ensure();await load();clearInterval(poll);poll=setInterval(load,2500);clearInterval(timerTick);timerTick=setInterval(refreshTimerBadge,250)}
async function load(){
  if(!cur)return;
  const roomId=cur.id;
  try{
    let[r,p,ro]=await Promise.all([
      q('/pubg_rooms?id=eq.'+roomId+'&select=*'),
      q('/pubg_players?room_id=eq.'+roomId+'&select=*&order=position.asc'),
      q('/pubg_rounds?room_id=eq.'+roomId+'&select=*&order=round_no.asc')
    ]);
    if(!cur || cur.id!==roomId)return;
    cur=r[0]||cur;P=p;RO=ro;
    S=RO.length?await q('/pubg_round_player_stats?select=*&round_id=in.('+RO.map(x=>x.id).join(',')+')'):[];
    if(uiLocked()){ pendingRemoteRender=true; return; }
    queueSafeRender();
  }catch(err){console.error('[load]',err)}
}
function st(r,p){return S.find(x=>x.round_id===r&&x.player_id===p)||{kills:0,died:false}}function totals(p){let raw=0,minus=0;RO.forEach(r=>{let s=st(r.id,p.id);raw+=n(s.kills);if(s.died&&!(r.top10&&cur.top10_no_death_penalty))minus+=n(p.death_penalty)});return{raw,minus,score:raw-minus}}
async function pickProfile(id,name){pickId=id;pickName=name;let r=await fetch('/api/soop-search?nickname='+encodeURIComponent(name)),j=r.ok?await r.json():{results:[]};pt.textContent='SOOP 계정 선택';ph.textContent='“'+name+'” 검색 결과';cands.innerHTML=(j.results||[]).map(a=>'<div class="cand" data-id="'+e(a.user_id)+'"><img src="'+e(a.profile_image)+'"><div><b>'+e(a.nickname||name)+'</b><div class="meta">'+e(a.user_id)+'</div></div><button class="btn">선택</button></div>').join('')||'<div class="empty">검색 결과 없음</div>';document.querySelectorAll('.cand').forEach(x=>x.onclick=()=>bind(x.dataset.id));picker.classList.remove('hidden')}
async function bind(id){await q('/pubg_players?id=eq.'+pickId,{method:'PATCH',body:JSON.stringify({nickname:pickName,soop_user_id:id,profile_image:pic(id)})});picker.classList.add('hidden');editing=false;load()}noPhoto.onclick=async()=>{await q('/pubg_players?id=eq.'+pickId,{method:'PATCH',body:JSON.stringify({nickname:pickName,soop_user_id:null,profile_image:null})});picker.classList.add('hidden');editing=false;load()};pc.onclick=()=>{picker.classList.add('hidden');editing=false;load()};
async function saveName(x){
  let name=x.value.trim(),id=x.dataset.name;
  await q('/pubg_players?id=eq.'+id,{method:'PATCH',body:JSON.stringify({nickname:name,soop_user_id:null,profile_image:null})});
  if(name)await pickProfile(id,name);
  else{editing=false;await load()}
}
function renderScore(){
  ck.value=cur.chicken_kills;sk.value=cur.sanhok_chicken_kills;t10.checked=cur.top10_no_death_penalty;
  let teamScores=[],out='';
  for(let t=1;t<=cur.team_count;t++){
    let ps=P.filter(p=>Math.floor((p.position-1)/cur.players_per_team)+1===t),teamScore=0,ch=0;
    ps.forEach(p=>teamScore+=totals(p).score);
    RO.filter(r=>r.chicken_team===t).forEach(r=>{ch++;teamScore+=r.map_type==='sanhok'?n(cur.sanhok_chicken_kills):n(cur.chicken_kills)});
    teamScores.push(teamScore);
    out+='<div class="team"><div class="total">'+teamScore+'</div><div class="plist">'+
      ps.map(p=>{let a=totals(p);return '<div class="slot" draggable="true" data-slot="'+p.id+'">'+
      (p.soop_user_id?'<img class="avatar" src="'+pic(p.soop_user_id)+'">':'<span class="avatarEmpty"></span>')+
      '<div class="playerInline"><input class="name" data-name="'+p.id+'" value="'+e(p.nickname||'')+'" placeholder="이름 입력">'+
      '<div class="detail"><b>'+a.score+'</b> ( '+a.raw+' - '+a.minus+' )</div></div></div>'}).join('')+
      '</div><div class="chicken">'+(ch?'🍗 × '+ch:'')+'</div></div>';
  }
  scoreboard.innerHTML=out;
  const mode=(scoreViewMode.value!=='auto'?scoreViewMode.value:(cur.score_mode||'separate'));
  const goal=cur.goal_kills??50;
  let center='';
  if(mode==='2v2' && cur.team_count===4){
    const left=(teamScores[0]||0)+(teamScores[1]||0),right=(teamScores[2]||0)+(teamScores[3]||0);
    center=captainName(1)+' '+left+' : '+right+' '+captainName(3);
  }else{
    center=teamScores.map((s,i)=>captainName(i+1)+' '+s).join('  ·  ');
  }
  totalBar.innerHTML='<span class="goalBadge">목표 '+goal+'</span><span>'+e(center)+'</span><span id="timerBadge" class="timerBadge">⏱ '+timerText()+'</span>';
  deathItems.innerHTML=P.map(p=>'<div class="di"><span>'+e(p.nickname||'PLAYER '+p.position)+'</span><input data-death="'+p.id+'" type="number" value="'+n(p.death_penalty)+'"></div>').join('');
  document.querySelectorAll('[data-name]').forEach(x=>{x.onfocus=()=>editing=true;x.onkeydown=a=>{if(a.key==='Enter'){a.preventDefault();x.blur()}};x.onblur=()=>saveName(x)});
  document.querySelectorAll('[data-death]').forEach(x=>{
    x.oninput=()=>{const p=P.find(p=>String(p.id)===String(x.dataset.death));if(p)p.death_penalty=n(x.value);refreshScoreTextOnly()};
    x.onchange=()=>q('/pubg_players?id=eq.'+x.dataset.death,{method:'PATCH',body:JSON.stringify({death_penalty:n(x.value)})}).catch(console.error)
  });
  drag();
}
function drag(){document.querySelectorAll('.slot').forEach(s=>{s.ondragstart=a=>{if(a.target.closest('input')){a.preventDefault();return}dragId=s.dataset.slot;s.classList.add('dragging');ghost=document.createElement('div');ghost.className='ghost';ghost.textContent=(P.find(p=>p.id===dragId)?.nickname||'PLAYER');document.body.appendChild(ghost);document.addEventListener('dragover',moveGhost)};s.ondragover=a=>{if(!dragId||dragId===s.dataset.slot)return;a.preventDefault();document.querySelectorAll('.slot.over').forEach(x=>x!==s&&x.classList.remove('over'));s.classList.add('over')};s.ondragleave=()=>s.classList.remove('over');s.ondrop=async a=>{a.preventDefault();let b=s.dataset.slot;if(b!==dragId)await swap(dragId,b);endDrag();editing=false;load()};s.ondragend=endDrag})}function moveGhost(a){if(ghost){ghost.style.left=a.clientX+'px';ghost.style.top=a.clientY+'px'}}function endDrag(){dragId=null;document.querySelectorAll('.slot').forEach(x=>x.classList.remove('dragging','over'));document.removeEventListener('dragover',moveGhost);ghost?.remove();ghost=null}async function swap(aid,bid){let a=P.find(x=>x.id===aid),b=P.find(x=>x.id===bid),ap=a.position,bp=b.position;await q('/pubg_players?id=eq.'+a.id,{method:'PATCH',body:JSON.stringify({position:999999})});await q('/pubg_players?id=eq.'+b.id,{method:'PATCH',body:JSON.stringify({position:ap})});await q('/pubg_players?id=eq.'+a.id,{method:'PATCH',body:JSON.stringify({position:bp})})}
function board(){
  roundCol.innerHTML='<div class="roundHead">#</div>'+RO.map(r=>'<div class="roundCell">'+r.round_no+'</div>').join('');
  killBoard.style.gridTemplateColumns='repeat('+cur.team_count+',minmax(0,1fr))';
  killBoard.innerHTML='';
  for(let t=1;t<=cur.team_count;t++){
    let ps=P.filter(p=>Math.floor((p.position-1)/cur.players_per_team)+1===t),d=document.createElement('div');d.className='teamBlock';
    d.innerHTML='<div class="teamBlockTitle">'+teamLetter(t)+' TEAM</div><table class="tbl"><thead><tr><th>MAP</th><th>🍗</th>'+
    ps.map(p=>'<th>'+e(p.nickname||'PLAYER')+'</th>').join('')+'</tr></thead><tbody>'+
    RO.map(r=>'<tr><td><select data-map="'+r.id+'"><option value="normal" '+(r.map_type==='normal'?'selected':'')+'>일</option><option value="sanhok" '+(r.map_type==='sanhok'?'selected':'')+'>사</option></select></td><td><input data-chicken="'+r.id+'" data-team="'+t+'" type="checkbox" '+(r.chicken_team===t?'checked':'')+'></td>'+
    ps.map(p=>{let s=st(r.id,p.id);return '<td><input data-k="'+r.id+'|'+p.id+'" type="number" value="'+n(s.kills)+'"> <input data-d="'+r.id+'|'+p.id+'" type="checkbox" '+(s.died?'checked':'')+'>☠</td>'}).join('')+'</tr>').join('')+'</tbody></table>';
    killBoard.appendChild(d)
  }
  document.querySelectorAll('[data-map]').forEach(x=>x.onchange=()=>{
    const r=RO.find(r=>String(r.id)===String(x.dataset.map));if(r)r.map_type=x.value;refreshScoreTextOnly();
    q('/pubg_rounds?id=eq.'+x.dataset.map,{method:'PATCH',body:JSON.stringify({map_type:x.value})}).catch(console.error)
  });
  document.querySelectorAll('[data-chicken]').forEach(x=>x.onchange=()=>{
    const rid=x.dataset.chicken,team=x.checked?+x.dataset.team:null;
    const r=RO.find(r=>String(r.id)===String(rid));if(r)r.chicken_team=team;
    document.querySelectorAll('[data-chicken="'+rid+'"]').forEach(y=>{if(y!==x)y.checked=false});
    refreshScoreTextOnly();
    q('/pubg_rounds?id=eq.'+rid,{method:'PATCH',body:JSON.stringify({chicken_team:team})}).catch(console.error)
  });
  document.querySelectorAll('[data-k]').forEach(x=>x.oninput=()=>updateLocalStat(x.dataset.k,n(x.value),null));
  document.querySelectorAll('[data-k]').forEach(x=>x.onchange=()=>saveStat(x.dataset.k,n(x.value),null).catch(console.error));
  document.querySelectorAll('[data-d]').forEach(x=>x.onchange=()=>{updateLocalStat(x.dataset.d,null,x.checked);saveStat(x.dataset.d,null,x.checked).catch(console.error)})
}
async function saveStat(key,k,d){let[r,p]=key.split('|'),o=S.find(x=>x.round_id===r&&x.player_id===p);if(o){let z={};if(k!==null)z.kills=k;if(d!==null)z.died=d;await q('/pubg_round_player_stats?id=eq.'+o.id,{method:'PATCH',body:JSON.stringify(z)})}else await q('/pubg_round_player_stats',{method:'POST',body:JSON.stringify({round_id:r,player_id:p,kills:k??0,died:d??false})})}
ck.oninput=()=>{cur.chicken_kills=n(ck.value);refreshScoreTextOnly()};
ck.onchange=()=>q('/pubg_rooms?id=eq.'+cur.id,{method:'PATCH',body:JSON.stringify({chicken_kills:n(ck.value)})}).catch(console.error);

if(goalKills){
  goalKills.oninput=()=>{

if(timerMode)timerMode.onchange=()=>{
  const end=timerMode.value==='endtime';
  if(timerSecondsWrap)timerSecondsWrap.style.display=end?'none':'block';
  if(timerEndWrap)timerEndWrap.style.display=end?'block':'none';

if(timerStart)timerStart.onclick=async()=>{
  if(!cur)return;
  const mode=timerMode.value;
  const patch={timer_mode:mode};
  if(mode==='endtime'){
    if(!timerEndAt.value)return;
    patch.timer_end_at=new Date(timerEndAt.value).toISOString();
    patch.timer_started_at=null;
  }else{
    patch.timer_seconds=Math.max(0,Math.round((parseFloat(timerMinutes.value)||0)*60));
    patch.timer_started_at=new Date().toISOString();
    patch.timer_end_at=null;
  }
  await q('/pubg_rooms?id=eq.'+cur.id,{method:'PATCH',body:JSON.stringify(patch)});

function applyChroma(){
  const on=!!chromaOn?.checked,color=chromaColor?.value||'#00ff00';

  captureStage.style.padding=on?'14px':'0';

  if(!cur)return;
  const u=new URL(location.href);u.searchParams.set('scoreonly','1');u.searchParams.set('room',cur.id);
  window.open(u.toString(),'dreams_score','popup=yes,width=760,height=430,resizable=yes,scrollbars=no');

if(pipScore)pipScore.onclick=async()=>{
  if(!cur)return;
  if('documentPictureInPicture' in window){
    try{
      const pip=await documentPictureInPicture.requestWindow({width:760,height:430});
      const style=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\\n');
      pip.document.head.innerHTML='<style>'+style+'body{margin:0;background:transparent}.scoreWrap{overflow:visible;padding:0}.score{gap:0}</style>';
      pip.document.body.innerHTML='<div id="pipStage"></div>';
      const sync=()=>{const node=document.querySelector('#captureStage .scoreFrame');if(node)pip.document.getElementById('pipStage').innerHTML=node.outerHTML};
      sync();const ob=new MutationObserver(sync);ob.observe(captureStage,{childList:true,subtree:true,characterData:true,attributes:true});
      pip.addEventListener('pagehide',()=>ob.disconnect());
    }catch(e){popupScore?.click()}
  }else popupScore?.click()
};
if(new URLSearchParams(location.search).get('scoreonly')==='1'){
  document.documentElement.classList.add('overlayOnly');

  (async()=>{let r=(await q('/pubg_rooms?id=eq.'+encodeURIComponent(rid)+'&select=*'))[0];if(r){await enterRoom(r);document.documentElement.classList.add('overlayOnly')}})();

rooms();setInterval(()=>{if(!cur && !hasEditableFocus())rooms()},5000);
