<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>메인</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans KR",sans-serif;background:#fff;color:#111}

main{min-height:calc(100vh - 58px)}

/* ===== GLOBAL NAVIGATION ===== */
.globalNav{
  position:sticky;
  top:0;
  z-index:9999;
  width:100%;
  height:58px;
  background:rgba(12,14,17,.94);
  border-bottom:1px solid rgba(255,255,255,.08);
  box-shadow:0 8px 22px rgba(0,0,0,.12);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.globalNavInner{
  width:min(1180px,calc(100% - 32px));
  height:58px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.globalNavBrand{
  display:flex;
  align-items:center;
  height:58px;
  color:#fff;
  text-decoration:none;
  font-size:15px;
  font-weight:950;
  letter-spacing:2.4px;
}
.globalNavLinks{
  height:58px;
  display:flex;
  align-items:center;
  gap:4px;
}
.globalNavLink{
  position:relative;
  height:58px;
  padding:0 16px;
  display:flex;
  align-items:center;
  color:#9ea5ad;
  text-decoration:none;
  font-size:13px;
  font-weight:900;
  letter-spacing:-.15px;
  transition:color .14s ease,background .14s ease;
}
.globalNavLink:hover{
  color:#fff;
  background:rgba(255,255,255,.035);
}
.globalNavLink.active{
  color:#fff;
}
.globalNavLink.active:after{
  content:"";
  position:absolute;
  left:16px;
  right:16px;
  bottom:0;
  height:2px;
  background:#fff;
}
@media(max-width:700px){
  .globalNavInner{width:calc(100% - 18px)}
  .globalNavBrand{font-size:13px;letter-spacing:1.8px}
  .globalNavLink{padding:0 10px;font-size:12px}
  .globalNavLink.active:after{left:10px;right:10px}
}

</style>
</head>
<body>
<nav class="globalNav">
  <div class="globalNavInner">
    <a class="globalNavBrand" href="index.html">MUJE</a>
    <div class="globalNavLinks">
      <a class="globalNavLink navMain active" href="index.html">메인</a>
      <a class="globalNavLink navPubg" href="pubg.html">배틀그라운드</a>
    </div>
  </div>
</nav>

<main></main>
</body>
</html>
