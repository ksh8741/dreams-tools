<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>공통 상단 메뉴</title>
<base target="_top">
<style>
@font-face{font-family:'Griun Yeeun';src:url('https://d26ciffk7xlrlz.cloudfront.net/free-fonts/yeeun/Griun_Yeeun-Rg.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}

*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:58px;overflow:hidden;background:#0c0e11;font-family:"Griun Yeeun","Malgun Gothic",sans-serif}
nav{height:58px;border-bottom:1px solid rgba(255,255,255,.08)}
.inner{width:min(1180px,calc(100% - 32px));height:58px;margin:0 auto;display:flex;align-items:center;justify-content:flex-start}
.links{display:flex;height:58px;align-items:center;max-width:100%;overflow-x:auto;scrollbar-width:none}.links::-webkit-scrollbar{display:none}
a{position:relative;height:58px;display:flex;align-items:center;justify-content:center;padding:0 16px;border:0;background:transparent;color:#9ea5ad;text-decoration:none;font-size:18px;font-weight:400;line-height:1;white-space:nowrap}
a:hover,a.active{color:#fff}
a.active::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:#edbdd4}
a:focus-visible{outline:2px solid #fff;outline-offset:-5px}
@media(max-width:700px){.inner{width:calc(100% - 18px)}a{padding:0 10px;font-size:16px}a.active::after{left:10px;right:10px}}
</style>
</head>
<body>
<nav aria-label="방송도구 메뉴"><div class="inner"><div class="links">
<a data-page="pubg" href="pubg.html" target="_top">배틀그라운드</a>
<a data-page="starcraft" href="starcraft.html" target="_top">티어표</a>
<a data-page="elo" href="elo.html" target="_top">전적</a>
<a data-page="notices" href="notices.html" target="_top">공지</a>
<a data-page="clips" href="clips.html" target="_top">클립</a>
<a data-page="quiz" href="quiz.html" target="_top">닝잘알</a>
<a data-page="menu" href="menu.html" target="_top">모먹지</a>
<a data-page="sig" href="sig.html" target="_top">시그표제작</a>
</div></div></nav>
<script>
(()=>{
try{const host=window.parent;if(host!==window&&!host.document.getElementById('yoning-title-font')){const style=host.document.createElement('style');style.id='yoning-title-font';style.textContent="/* Griun Yeeun — official webfont: https://www.griun.co.kr/fonts/yeeun */\n@font-face{font-family:'Griun Yeeun';src:url('https://d26ciffk7xlrlz.cloudfront.net/free-fonts/yeeun/Griun_Yeeun-Rg.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;}\nh1,h2,h3,h4,h5,h6,[role=\"heading\"],.pageTitle,.page-title,.sectionTitle,.section-title,.cardTitle,.card-title{font-family:\"Griun Yeeun\",\"Malgun Gothic\",sans-serif!important;font-weight:400!important;}";host.document.head.appendChild(style)}}catch(_){}
let path='';
try{path=window.parent.location.pathname}catch(_){try{path=new URL(document.referrer).pathname}catch(_){}}
const file=path.split('/').pop().toLowerCase();
const current=file==='pubg.html'?'pubg':file==='starcraft.html'?'starcraft':file==='notices.html'?'notices':file==='clips.html'?'clips':file==='quiz.html'?'quiz':file==='menu.html'?'menu':file==='sig.html'?'sig':file==='elo.html'?'elo':'';
for(const link of document.querySelectorAll('[data-page]')){
const active=link.dataset.page===current;
link.classList.toggle('active',active);
if(active)link.setAttribute('aria-current','page');
}
try{
 const host=window.parent;
 if(host!==window && !new URLSearchParams(host.location.search).has('overlay') && !host.document.getElementById('notice-client-script')){
  const script=host.document.createElement('script');script.id='notice-client-script';
  script.src=new URL('notice-client.js',location.href).href;host.document.head.appendChild(script);
 }
}catch(_){}
})();
</script>
</body>
</html>
