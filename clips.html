<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>클립 · 요닝 방송도구함</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#101010;color:#fff;font-family:"Nanum Square Round","Noto Sans KR",Arial,sans-serif}.globalNavbarFrame{display:block;width:100%;height:58px;border:0}.clipHeader{height:52px;display:flex;align-items:center;justify-content:space-between;max-width:1120px;margin:auto;padding:0 24px}.clipHeader h1{font-size:17px;margin:0}.clipHeader span{font-size:11px;color:#aaa}#clipFeed{height:calc(100vh - 110px);height:calc(100dvh - 110px);overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior-y:contain;outline:none}#clipFeed::-webkit-scrollbar{display:none}.clipSlide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;padding:12px 66px 22px;display:flex;align-items:center;justify-content:center}.clipCard{width:min(100%,1040px);min-width:0}.clipStage{position:relative;aspect-ratio:16/9;max-height:calc(100dvh - 238px);background:#000;border-radius:15px 15px 0 0;overflow:hidden}.clipPoster,.clipPlayer{position:absolute;inset:0;width:100%;height:100%}.clipPoster{object-fit:contain}.clipPlayer{border:0;pointer-events:auto;background:#000}.clipMeta{display:flex;align-items:flex-start;gap:16px;padding-top:17px}.clipInfo{min-width:0;flex:1}.clipInfo h2{font-size:16px;line-height:1.45;margin:0 0 7px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.clipInfo p{font-size:11px;color:#aaa;margin:0;line-height:1.6}.clipNav{position:fixed;right:18px;top:50%;display:flex;flex-direction:column;gap:12px;z-index:10}.clipNav button{width:38px;height:38px;border:1px solid #555;border-radius:50%;background:#222;color:#fff;font-size:22px;cursor:pointer}.clipNav button:disabled{opacity:.3;cursor:default}#clipStatus{position:fixed;left:50%;top:130px;transform:translateX(-50%);z-index:20;font-size:12px;background:#303030;padding:12px 18px;border-radius:9px;max-width:calc(100vw - 40px);text-align:center}#clipStatus[hidden]{display:none}@media(max-width:640px){.clipHeader{height:45px;padding:0 16px}.clipHeader span{font-size:10px}#clipFeed{height:calc(100dvh - 103px)}.clipSlide{padding:0 12px 22px;align-items:center}.clipStage{aspect-ratio:9/13;max-height:calc(100dvh - 265px);border-radius:12px 12px 0 0}.clipMeta{padding:14px 2px 0;display:block}.clipInfo h2{font-size:14px}.clipNav{right:13px;top:auto;bottom:14px;flex-direction:row}.clipNav button{width:32px;height:32px;font-size:17px}}
.clipProgress{width:100%;height:5px;background:#3a3a3a;overflow:hidden}.clipProgressFill{height:100%;width:100%;background:#ff3040;transform:scaleX(0);transform-origin:left center;transition:transform .15s linear}.clipNav button:focus-visible{outline:2px solid #fff;outline-offset:3px}@media(prefers-reduced-motion:reduce){.clipProgressFill{transition:none}}
.clipHeading{display:flex;align-items:center;gap:18px}.clipSort{display:flex;gap:5px}.clipSort button{border:1px solid #424242;border-radius:20px;background:transparent;color:#aaa;font:inherit;font-size:11px;padding:7px 12px;cursor:pointer}.clipSort button[aria-pressed=true]{background:#fff;color:#111;border-color:#fff}.clipSort button:focus-visible{outline:2px solid #fff;outline-offset:3px}.clipPlayer[hidden]{display:none}@media(max-width:640px){.clipHeading{gap:12px}.clipSort button{padding:6px 10px;font-size:10px}}
#clipAutoplay{display:flex;align-items:center;gap:7px;padding:0;border:0;background:none;color:#bbb;font:inherit;font-size:11px;cursor:pointer}#clipAutoplay .autoState{display:grid;place-items:center;width:37px;height:22px;border-radius:20px;border:1px solid #505050;background:#252525;color:#aaa;font-size:9px;font-weight:800}#clipAutoplay[aria-checked=true] .autoState{background:#ff3040;border-color:#ff3040;color:#fff}#clipAutoplay:focus-visible{outline:2px solid #fff;outline-offset:5px}@media(max-width:640px){.clipHeading{gap:9px}#clipAutoplay{font-size:10px;gap:5px}#clipAutoplay .autoState{width:32px;height:20px}.clipHeader #clipCounter{font-size:9px}}

#clipFeed{height:calc(100vh - 58px);height:calc(100dvh - 58px)}
.clipStage{max-height:calc(100dvh - 180px)}
.clipToolbar{position:relative;flex-shrink:0;align-self:flex-end;margin-left:auto;display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid #ffffff24;border-radius:12px;background:#151515c9;backdrop-filter:blur(8px)}
.clipToolbar[hidden]{display:none}.clipToolbar .clipHeading{gap:12px;flex-wrap:wrap}.clipMeta{align-items:flex-end}.clipToolbar{background:#181818;backdrop-filter:none}.clipStage{max-height:calc(100dvh - 230px)}.clipCounter{font-size:10px;color:#bbb;white-space:nowrap}
.clipProgress{position:relative;height:14px;background:transparent;overflow:visible}
.clipProgress:before{content:"";position:absolute;left:0;right:0;top:4px;height:5px;background:#3a3a3a}
.clipProgressFill{position:absolute;top:4px;height:5px}
.clipSeek{position:absolute;inset:0;z-index:1;width:100%;height:14px;margin:0;opacity:0;cursor:pointer;touch-action:none}
.clipProgress:focus-within{outline:1px solid #fff;outline-offset:2px}
@media(max-width:640px){#clipFeed{height:calc(100dvh - 58px)}.clipToolbar{padding:6px 8px;gap:8px;margin-top:12px;width:max-content;max-width:100%}.clipToolbar .clipHeading{gap:8px}.clipToolbar .clipCounter{display:none}.clipStage{max-height:calc(100dvh - 255px)}}
</style></head><body>
<iframe class="globalNavbarFrame" src="navbar.html" title="상단 메뉴" scrolling="no"></iframe>
<div id="clipToolbar" class="clipToolbar" hidden><div class="clipHeading"><div class="clipSort" role="group" aria-label="클립 정렬"><button type="button" data-clip-sort="popular" aria-pressed="true">인기순</button><button type="button" data-clip-sort="reg_date" aria-pressed="false">최신순</button></div><button id="clipAutoplay" type="button" role="switch" aria-checked="false" aria-label="영상 종료 후 다음 클립 자동재생"><span>자동재생</span><span class="autoState">OFF</span></button></div><span id="clipCounter" class="clipCounter"></span></div>
<main id="clipFeed" tabindex="0" aria-label="클립 피드"></main>
<div class="clipNav"><button id="clipPrev" type="button" aria-label="이전 클립">↑</button><button id="clipNext" type="button" aria-label="다음 클립">↓</button></div>
<p id="clipStatus" role="status">클립을 불러오는 중입니다.</p>
<script>
(()=>{
'use strict';
const feed=document.getElementById('clipFeed'),status=document.getElementById('clipStatus'),counter=document.getElementById('clipCounter');
const prev=document.getElementById('clipPrev'),next=document.getElementById('clipNext'),ORIGIN='https://vod.sooplive.com';
let clips=[],page=0,hasMore=true,loading=false,active=-1,frame=null,ready=false,currentTime=0,raf=0,loadedVideoId='',readyVideoId='',sort='popular',generation=0,requestController=null;
const autoButton=document.getElementById('clipAutoplay'),toolbar=document.getElementById('clipToolbar');
let autoNext=false,endedForId='',loadPromise=null,seekDragging=false;
try{autoNext=localStorage.getItem('yoning_clips_autoplay')==='1'}catch(_){}
function updateAutoplay(){
 if(!autoButton)return;
 autoButton.setAttribute('aria-checked',String(autoNext));
 autoButton.querySelector('.autoState').textContent=autoNext?'ON':'OFF';
}
if(autoButton)autoButton.onclick=()=>{
 autoNext=!autoNext;
 try{localStorage.setItem('yoning_clips_autoplay',autoNext?'1':'0')}catch(_){}
 updateAutoplay();
};
updateAutoplay();
function say(text){status.textContent=text;status.hidden=!text}
function valid(c){return c&&/^\d+$/.test(c.id)&&typeof c.title==='string'}
function command(data){if(frame?.contentWindow)frame.contentWindow.postMessage(data,ORIGIN)}
let pendingPlaybackId='',playTimers=[];
function cancelPlaybackStart(){
 pendingPlaybackId='';playTimers.forEach(clearTimeout);playTimers=[];
}
function requestPlaybackStart(id){
 if(pendingPlaybackId!==id||clips[active]?.id!==id||readyVideoId!==id||document.hidden)return;
 command({cmd:'Pplay'});
}
function armPlaybackStart(id){
 cancelPlaybackStart();if(document.hidden)return;
 pendingPlaybackId=id;
 // Allow the new route's Pload state to settle before asking it to play.
 for(const delay of [120,700,1800])playTimers.push(setTimeout(()=>requestPlaybackStart(id),delay));
}
function configure(){
 const clip=clips[active];if(!ready||!clip||loadedVideoId===clip.id)return;
 loadedVideoId=clip.id;
 command({cmd:'Pload',id:clip.id,no:null,mutePlay:false,showChat:false,autoPlay:!document.hidden,isAdShow:true,isAdPause:false,isViewCnt:true,isRecommendShow:false,isEndRecommendShow:false,showQualityBox:true,startVideoSeconds:currentTime,endVideoSeconds:0,fromApi:1,apiKey:''});
}
function updateProgress(){
 const bar=feed.children[active]?.querySelector('.clipProgress');
 if(!bar)return;
 const duration=Number(clips[active]?.duration)||0;
 const ratio=duration>0?Math.max(0,Math.min(1,currentTime/duration)):0;
 bar.querySelector('.clipProgressFill').style.transform='scaleX('+ratio+')';
 bar.setAttribute('aria-valuenow',String(Math.round(ratio*100)));
 const seek=bar.querySelector('.clipSeek');if(seek&&!seekDragging)seek.value=String(Math.round(ratio*1000));
}
function positionPlayer(){
 if(!frame||active<0||document.fullscreenElement)return;
 const stage=feed.children[active]?.querySelector('.clipStage');if(!stage)return;
 const rect=stage.getBoundingClientRect(),bounds=feed.getBoundingClientRect();
 Object.assign(frame.style,{position:'fixed',inset:'auto',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',zIndex:'2',borderRadius:'12px 12px 0 0',
  clipPath:'inset('+Math.max(0,bounds.top-rect.top)+'px 0 '+Math.max(0,rect.bottom-bounds.bottom)+'px 0)'});


}
function activate(index){
 if(index<0||index>=clips.length)return;
 if(index===active&&frame){positionPlayer();return}
 // Each clip gets a fresh SOOP document so video, audio and controls agree.
 cancelPlaybackStart();active=index;ready=false;loadedVideoId='';readyVideoId='';endedForId='';currentTime=0;seekDragging=false;updateProgress();
 const clip=clips[index];
 if(!frame){
  frame=document.createElement('iframe');frame.className='clipPlayer';frame.allow='autoplay; fullscreen; encrypted-media; picture-in-picture';frame.allowFullscreen=true;
  document.body.appendChild(frame);
 }
 frame.src=ORIGIN+'/player/'+clip.id+'/embed?fromApi=1';
 if(toolbar){feed.children[index].querySelector('.clipMeta').appendChild(toolbar);toolbar.hidden=false}
 frame.hidden=false;frame.title=clip.title;positionPlayer();
 prev.disabled=index===0;next.disabled=index===clips.length-1&&!hasMore;counter.textContent=(index+1)+' / '+clips.length+(hasMore?' +':'');
 if(index>=clips.length-4)loadMore();
}

async function move(direction,automatic=false){
 const moveGeneration=generation,fromId=clips[active]?.id;
 let index=active+direction;
 if(index>=clips.length&&hasMore){await loadMore();if(moveGeneration!==generation||clips[active]?.id!==fromId)return;index=active+direction}
 if(index<0||index>=clips.length||automatic&&(!autoNext||document.hidden))return;
 feed.children[index].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}
function renderNew(items){
 for(const clip of items){
  const section=document.createElement('section');section.className='clipSlide';section.setAttribute('aria-label',clip.title);
  const card=document.createElement('article');card.className='clipCard';
  const stage=document.createElement('div');stage.className='clipStage';
  if(clip.thumbnail){const poster=document.createElement('img');poster.className='clipPoster';poster.alt='';poster.loading='lazy';poster.src=clip.thumbnail;stage.appendChild(poster)}
  const progress=document.createElement('div');progress.className='clipProgress';
  progress.setAttribute('role','progressbar');progress.setAttribute('aria-label','영상 재생 진행률');progress.setAttribute('aria-valuemin','0');progress.setAttribute('aria-valuemax','100');progress.setAttribute('aria-valuenow','0');
  const fill=document.createElement('div');fill.className='clipProgressFill';progress.appendChild(fill);
  const seek=document.createElement('input');seek.type='range';seek.className='clipSeek';seek.min='0';seek.max='1000';seek.step='1';seek.value='0';seek.setAttribute('aria-label','영상 재생 위치');
  seek.onpointerdown=()=>{if(clips[active]?.id===clip.id)seekDragging=true};
  const finishSeek=()=>{seekDragging=false};seek.onpointerup=finishSeek;seek.onpointercancel=finishSeek;seek.onblur=finishSeek;
  seek.oninput=()=>{
   if(clips[active]?.id!==clip.id||!ready||readyVideoId!==clip.id)return;
   currentTime=Math.max(0,Math.min(1,Number(seek.value)/1000))*Number(clip.duration||0);
   updateProgress();command({cmd:'PseekTo',seconds:{time:currentTime,seekType:'timelink'}});
  };
  progress.appendChild(seek);
  const meta=document.createElement('div');meta.className='clipMeta';const info=document.createElement('div');info.className='clipInfo';
  const title=document.createElement('h2');title.textContent=clip.title;const detail=document.createElement('p');detail.textContent=[clip.author,clip.date.slice(0,10),Number(clip.views).toLocaleString('ko-KR')+'회'].filter(Boolean).join(' · ');info.append(title,detail);
  meta.appendChild(info);card.append(stage,progress,meta);section.appendChild(card);feed.appendChild(section);
 }
}
async function fetchNextPage(){
 if(loading||!hasMore)return;loading=true;
 const requestGeneration=generation,requestSort=sort;
 const controller=new AbortController();requestController=controller;
 try{
  const response=await fetch('/api/clips?page='+(page+1)+'&sort='+requestSort,{signal:AbortSignal.any([controller.signal,AbortSignal.timeout(18000)])});
  if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();
  if(requestGeneration!==generation)return;
  if(!Array.isArray(data.clips)||!data.clips.every(valid))throw Error('Invalid clip response');
  const ids=new Set(clips.map(c=>c.id)),added=data.clips.filter(c=>{if(ids.has(c.id))return false;ids.add(c.id);return true});clips.push(...added);page=data.page;hasMore=!!data.hasMore;
  renderNew(added);say(clips.length?'':'등록된 클립이 없습니다.');
  if(active<0&&clips.length)activate(0);
  if(active>=0){next.disabled=active===clips.length-1&&!hasMore;counter.textContent=(active+1)+' / '+clips.length+(hasMore?' +':'')}
 }catch(_){if(requestGeneration!==generation)return;say('클립을 불러오지 못했습니다. 눌러서 다시 시도해주세요.');status.onclick=()=>{say('클립을 불러오는 중입니다.');loadMore()}}
 finally{if(requestGeneration===generation){loading=false;if(requestController===controller)requestController=null}}
}
function loadMore(){
 if(loadPromise)return loadPromise;
 const pending=fetchNextPage();
 const wrapped=pending.finally(()=>{if(loadPromise===wrapped)loadPromise=null});
 loadPromise=wrapped;return wrapped;
}
function updateSortButtons(){
 for(const button of document.querySelectorAll('[data-clip-sort]')){
  const selected=button.dataset.clipSort===sort;button.setAttribute('aria-pressed',String(selected));
 }
}
function changeSort(value){
 if(!['popular','reg_date'].includes(value)||value===sort)return;
 cancelPlaybackStart();generation++;requestController?.abort();requestController=null;loading=false;loadPromise=null;sort=value;
 command({cmd:'Ppause'});if(frame)frame.hidden=true;
 clips=[];page=0;hasMore=true;active=-1;currentTime=0;loadedVideoId='';
 feed.replaceChildren();feed.scrollTop=0;counter.textContent='';prev.disabled=true;next.disabled=true;
 updateSortButtons();say('클립을 불러오는 중입니다.');loadMore();
}
for(const button of document.querySelectorAll('[data-clip-sort]'))button.onclick=()=>changeSort(button.dataset.clipSort);
updateSortButtons();
feed.addEventListener('scroll',()=>{
 if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(feed.clientHeight)activate(Math.max(0,Math.min(clips.length-1,Math.round(feed.scrollTop/feed.clientHeight))))});
},{passive:true});
prev.onclick=()=>move(-1);next.onclick=()=>move(1);
window.addEventListener('resize',positionPlayer);
window.addEventListener('keydown',event=>{
 if(['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName)||event.altKey||event.ctrlKey||event.metaKey)return;
 if(['ArrowDown','PageDown','ArrowUp','PageUp'].includes(event.key)){event.preventDefault();move(['ArrowDown','PageDown'].includes(event.key)?1:-1)}
});
window.addEventListener('message',event=>{
 if(event.origin!==ORIGIN||event.source!==frame?.contentWindow||!event.data||typeof event.data!=='object')return;
 const data=event.data;
 if(data.cmd==='PonReady'){
  const id=String(data.id??'');
  if(id!==clips[active]?.id||readyVideoId===id)return;
  // SOOP navigates internally on the first Pload for another ID.
  // That new route sends PonReady again and needs its own initial Pload.
  ready=true;readyVideoId=id;loadedVideoId='';configure();armPlaybackStart(id);
 }
 if(data.cmd==='PupdateMediaEvent'){
  if(data.id!==undefined&&String(data.id)!==clips[active]?.id)return;
  const media=data.event||{};
  if(media.type==='play')cancelPlaybackStart();
  if(media.type==='buffer'&&pendingPlaybackId)requestPlaybackStart(pendingPlaybackId);
  if(media.type==='timeUpdate'&&Number.isFinite(media.currentTime)&&!seekDragging){currentTime=media.currentTime;updateProgress()}
  if(media.type==='end'){
   cancelPlaybackStart();
   currentTime=Number(clips[active]?.duration)||0;updateProgress();
   const id=clips[active]?.id;
   if(autoNext&&!document.hidden&&id&&endedForId!==id){endedForId=id;move(1,true)}
  }
 }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelPlaybackStart();command({cmd:'Ppause'})}});
window.addEventListener('pagehide',()=>{cancelPlaybackStart();if(frame){frame.remove();frame=null;ready=false;loadedVideoId=''}});
window.addEventListener('pageshow',event=>{if(event.persisted&&active>=0&&!frame)activate(active)});
loadMore();
})();

</script>
</body></html>
