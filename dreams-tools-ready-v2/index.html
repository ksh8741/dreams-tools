<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DREAMS PUBG</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#18212b;font-family:Arial,"Noto Sans KR",sans-serif}header{height:56px;background:#111820;color:#fff;padding:0 18px;display:flex;align-items:center;gap:28px}.brand{font-weight:900}nav{font-size:12px;color:#9ba7b4}.on{color:#fff}main{padding:10px 12px;max-width:1700px;margin:auto}.panel{background:#fff;border:1px solid #dfe4e8;border-radius:10px;padding:9px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:8px}.score{display:flex;gap:7px;overflow-x:auto}.team{width:170px;flex:0 0 170px;border:1px solid #202832;border-radius:9px;overflow:hidden}.th{background:#121920;color:#fff;text-align:center;padding:7px;font-size:11px;font-weight:900}.total{text-align:center;font-size:25px;font-weight:900;padding:8px}.slot{position:relative;display:grid;grid-template-columns:34px 1fr;gap:7px;align-items:center;padding:7px;border-top:1px solid #edf0f2;min-height:49px;cursor:grab;transition:.15s}.slot.dragging{opacity:.2;transform:scale(.96)}.slot.over{background:#fff5d9;box-shadow:inset 0 0 0 2px #d49a24}.slot.over:after{content:"교체";position:absolute;right:5px;top:3px;font-size:8px;font-weight:900;color:#9a6500}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover}.avatar-empty{width:34px;height:34px}.name{border:0;width:100%;font-size:14px;font-weight:850;padding:4px;background:transparent;outline:0}.name:focus{background:#eef2f5;border-radius:5px}.detail{font-size:10px;color:#69747e;padding-left:4px}.detail b{font-size:12px;color:#111}.chicken{text-align:center;min-height:29px;padding:6px;border-top:1px solid #edf0f2;background:#fafafa}.settings{font-size:10px}.settings label{display:block;margin:6px 0}.settings input[type=number]{width:70px;padding:4px}.death{display:grid;grid-template-columns:1fr 45px;gap:4px;align-items:center;margin:4px 0}.kill{margin-top:8px;overflow:hidden}.board{display:grid;grid-template-columns:32px 1fr}.rounds>div{height:29px;border:1px solid #e2e6ea;display:grid;place-items:center;font-size:9px}.rounds>div:first-child{background:#151c23;color:#fff}.teamboards{display:grid;gap:4px;min-width:0}.tb{min-width:0;border:1px solid #dfe4e8}.tbtitle{height:29px;background:#151c23;color:#fff;font-size:9px;font-weight:900;display:flex;align-items:center;padding:0 6px}.tb table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:clamp(5px,.42vw,9px)}th,td{height:29px;border-top:1px solid #e5e9ed;border-right:1px solid #e5e9ed;text-align:center;padding:1px;overflow:hidden}th{background:#f6f7f8}td input[type=number]{width:60%;min-width:0}.ghost{position:fixed;z-index:999;pointer-events:none;background:#151c23ee;color:#fff;border:1px solid #d49a24;border-radius:8px;padding:8px 11px;font-size:12px;font-weight:900;box-shadow:0 12px 30px #0005;transform:translate(12px,12px)}.ghost img{width:26px;height:26px;border-radius:50%;vertical-align:middle;margin-right:7px}.modalbg{position:fixed;inset:0;background:#10182088;display:grid;place-items:center;z-index:50}.hidden{display:none!important}.modal{width:min(430px,94vw);background:#fff;border-radius:12px;padding:18px;max-height:80vh;overflow:auto}.candidate{display:grid;grid-template-columns:42px 1fr;gap:9px;align-items:center;border:1px solid #e1e5e9;border-radius:8px;padding:8px;margin:7px 0;cursor:pointer}.candidate img{width:42px;height:42px;border-radius:50%;object-fit:cover}.btn{border:1px solid #d8dee5;background:#fff;border-radius:6px;padding:6px 9px;font-weight:700;cursor:pointer}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="brand">⚾ DREAMS</div><nav><span class="on">BATTLEGROUNDS</span></nav></header>
<main><div class="top"><div><b id="roomTitle">DREAMS PUBG</b><div style="font-size:9px;color:#84909b">현황에서 이름 입력 · 슬롯끼리 드래그하면 정확히 맞교환</div></div></div>
<div class="grid"><section class="panel"><b style="font-size:13px">킬 현황</b><div id="score" class="score"></div></section>
<section class="panel settings"><b style="font-size:13px">게임 세팅</b><label>일반 치킨 보너스 <input id="normalChicken" type="number" value="8"></label><label>사녹 치킨 보너스 <input id="sanhokChicken" type="number" value="5"></label><label><input id="top10" type="checkbox"> 탑텐 시 마이너스 없음</label><hr><b>데스당 마이너스</b><div id="deathSettings"></div></section></div>
<section class="panel kill"><b style="font-size:13px">킬 기록</b><div class="board"><div id="rounds" class="rounds"></div><div id="teamboards" class="teamboards"></div></div><button id="addRound" class="btn" style="width:100%;margin-top:6px">추가</button></section>
</main>
<div id="picker" class="modalbg hidden"><div class="modal"><b id="pickerTitle">SOOP 계정 선택</b><div id="candidates"></div><button id="noPhoto" class="btn">사진 없이 사용</button> <button id="cancelPicker" class="btn">취소</button></div></div>
<script>
const qs=new URLSearchParams(location.search),room=qs.get('room')||localStorage.getItem('dreams_room')||'demo';
const SB='https://llqikrcqavwfbuajykig.supabase.co/rest/v1',KEY='sb_publishable_aLPzJI_jQLlywmoQsiLRtw_ElX_aslF',HEAD={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
let R=null,P=[],RO=[],S=[],editing=false,dragId=null,ghost=null,pickId=null,pickName='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=x=>Math.max(0,parseInt(x)||0),pic=id=>'https://stimg.sooplive.com/LOGO/'+id.slice(0,2)+'/'+id+'/m/'+id+'.webp';
async function api(path,opt={}){let r=await fetch(SB+path,{...opt,headers:{...HEAD,...(opt.headers||{})}}),t=await r.text();if(!r.ok)throw Error(t);return t?JSON.parse(t):null}
async function load(){
 let rr=await api('/pubg_rooms?id=eq.'+encodeURIComponent(room)+'&select=*'); if(!rr.length)return;
 R=rr[0];roomTitle.textContent=R.name||'DREAMS PUBG';
 [P,RO]=await Promise.all([api('/pubg_players?room_id=eq.'+R.id+'&select=*&order=position.asc'),api('/pubg_rounds?room_id=eq.'+R.id+'&select=*&order=round_no.asc')]);
 S=RO.length?await api('/pubg_round_player_stats?select=*&round_id=in.('+RO.map(x=>x.id).join(',')+')'):[];
 if(!editing)render();
}
function stat(r,p){return S.find(x=>x.round_id===r&&x.player_id===p)||{kills:0,died:false}}
function totals(p){let raw=0,minus=0;RO.forEach(r=>{let s=stat(r.id,p.id);raw+=num(s.kills);if(s.died&&!(r.top10&&R.top10_no_death_penalty))minus+=num(p.death_penalty)});return{raw,minus,score:raw-minus}}
function render(){
 normalChicken.value=R.chicken_kills??8;sanhokChicken.value=R.sanhok_chicken_kills??5;top10.checked=!!R.top10_no_death_penalty;
 let out='';for(let t=1;t<=R.team_count;t++){let ps=P.filter(p=>Math.floor((p.position-1)/R.players_per_team)+1===t),team=0,ch=0;ps.forEach(p=>team+=totals(p).score);RO.filter(r=>r.chicken_team===t).forEach(r=>{ch++;team+=r.map_type==='sanhok'?num(R.sanhok_chicken_kills):num(R.chicken_kills)});
 out+='<div class="team"><div class="th">'+t+' TEAM</div><div class="total">'+team+'</div>'+ps.map(p=>{let a=totals(p);return '<div class="slot" draggable="true" data-slot="'+p.id+'">'+(p.soop_user_id?'<img class="avatar" src="'+pic(p.soop_user_id)+'">':'<span class="avatar-empty"></span>')+'<div><input class="name" data-name="'+p.id+'" value="'+esc(p.nickname||'')+'" placeholder="이름 입력"><div class="detail"><b>'+a.score+'</b> ( '+a.raw+' - '+a.minus+' )</div></div></div>'}).join('')+'<div class="chicken">'+(ch?'🍗 × '+ch:'')+'</div></div>'}score.innerHTML=out;
 deathSettings.innerHTML=P.map(p=>'<div class="death"><span>'+esc(p.nickname||'PLAYER '+p.position)+'</span><input data-pen="'+p.id+'" type="number" value="'+num(p.death_penalty)+'"></div>').join('');
 document.querySelectorAll('[data-name]').forEach(x=>{x.onfocus=()=>editing=true;x.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();x.blur()}};x.onblur=()=>saveName(x)});
 document.querySelectorAll('[data-pen]').forEach(x=>x.onchange=()=>api('/pubg_players?id=eq.'+x.dataset.pen,{method:'PATCH',body:JSON.stringify({death_penalty:num(x.value)})}));
 wireDrag();renderBoard();
}
async function saveName(x){let name=x.value.trim();pickId=x.dataset.name;pickName=name;await api('/pubg_players?id=eq.'+pickId,{method:'PATCH',body:JSON.stringify({nickname:name,soop_user_id:null,profile_image:null})});if(!name){editing=false;load();return}let r=await fetch('/api/soop-search?nickname='+encodeURIComponent(name)),j=r.ok?await r.json():{results:[]};pickerTitle.textContent='“'+name+'” SOOP 계정 선택';candidates.innerHTML=(j.results||[]).map(a=>'<div class="candidate" data-cand="'+esc(a.user_id)+'"><img src="'+esc(a.profile_image)+'"><div><b>'+esc(a.nickname||name)+'</b><div style="font-size:10px;color:#77838e">'+esc(a.user_id)+'</div></div></div>').join('')||'<div style="padding:18px;color:#77838e">검색 결과 없음</div>';document.querySelectorAll('[data-cand]').forEach(c=>c.onclick=()=>bind(c.dataset.cand));picker.classList.remove('hidden')}
async function bind(id){await api('/pubg_players?id=eq.'+pickId,{method:'PATCH',body:JSON.stringify({nickname:pickName,soop_user_id:id,profile_image:pic(id)})});picker.classList.add('hidden');editing=false;load()}
noPhoto.onclick=async()=>{await api('/pubg_players?id=eq.'+pickId,{method:'PATCH',body:JSON.stringify({nickname:pickName,soop_user_id:null,profile_image:null})});picker.classList.add('hidden');editing=false;load()};cancelPicker.onclick=()=>{picker.classList.add('hidden');editing=false;load()};
function wireDrag(){document.querySelectorAll('.slot').forEach(s=>{s.ondragstart=e=>{if(e.target.matches('input')){e.preventDefault();return}dragId=s.dataset.slot;s.classList.add('dragging');makeGhost(P.find(p=>p.id===dragId));e.dataTransfer.effectAllowed='move'};s.ondragover=e=>{if(!dragId||dragId===s.dataset.slot)return;e.preventDefault();document.querySelectorAll('.slot.over').forEach(x=>x!==s&&x.classList.remove('over'));s.classList.add('over')};s.ondragleave=()=>s.classList.remove('over');s.ondrop=async e=>{e.preventDefault();let b=s.dataset.slot;s.classList.remove('over');if(b!==dragId)await swap(dragId,b);finishDrag();editing=false;load()};s.ondragend=finishDrag})}
async function swap(aid,bid){let a=P.find(x=>x.id===aid),b=P.find(x=>x.id===bid),ap=a.position,bp=b.position;await api('/pubg_players?id=eq.'+a.id,{method:'PATCH',body:JSON.stringify({position:999999})});await api('/pubg_players?id=eq.'+b.id,{method:'PATCH',body:JSON.stringify({position:ap})});await api('/pubg_players?id=eq.'+a.id,{method:'PATCH',body:JSON.stringify({position:bp})})}
function makeGhost(p){ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=(p.soop_user_id?'<img src="'+pic(p.soop_user_id)+'">':'')+esc(p.nickname||'PLAYER');document.body.appendChild(ghost);document.addEventListener('dragover',moveGhost)}
function moveGhost(e){if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}}function finishDrag(){dragId=null;document.querySelectorAll('.slot').forEach(x=>x.classList.remove('dragging','over'));document.removeEventListener('dragover',moveGhost);ghost?.remove();ghost=null}
function renderBoard(){rounds.innerHTML='<div>#</div>'+RO.map(r=>'<div>'+r.round_no+'</div>').join('');teamboards.style.gridTemplateColumns='repeat('+R.team_count+',minmax(0,1fr))';teamboards.innerHTML='';for(let t=1;t<=R.team_count;t++){let ps=P.filter(p=>Math.floor((p.position-1)/R.players_per_team)+1===t),d=document.createElement('div');d.className='tb';d.innerHTML='<div class="tbtitle">'+t+' TEAM</div><table><thead><tr><th>MAP</th><th>🍗</th>'+ps.map(p=>'<th>'+esc(p.nickname||'PLAYER')+'</th>').join('')+'</tr></thead><tbody>'+RO.map(r=>'<tr><td><select data-map="'+r.id+'"><option value="normal" '+(r.map_type==='normal'?'selected':'')+'>일</option><option value="sanhok" '+(r.map_type==='sanhok'?'selected':'')+'>사</option></select></td><td><input data-ch="'+r.id+'" data-team="'+t+'" type="checkbox" '+(r.chicken_team===t?'checked':'')+'></td>'+ps.map(p=>{let s=stat(r.id,p.id);return '<td><input data-k="'+r.id+'|'+p.id+'" type="number" value="'+num(s.kills)+'"> <input data-d="'+r.id+'|'+p.id+'" type="checkbox" '+(s.died?'checked':'')+'>☠</td>'}).join('')+'</tr>').join('')+'</tbody></table>';teamboards.appendChild(d)}
 document.querySelectorAll('[data-map]').forEach(x=>x.onchange=()=>api('/pubg_rounds?id=eq.'+x.dataset.map,{method:'PATCH',body:JSON.stringify({map_type:x.value})}));
 document.querySelectorAll('[data-ch]').forEach(x=>x.onchange=()=>api('/pubg_rounds?id=eq.'+x.dataset.ch,{method:'PATCH',body:JSON.stringify({chicken_team:x.checked?+x.dataset.team:null})}));
 document.querySelectorAll('[data-k]').forEach(x=>x.onchange=()=>saveStat(x.dataset.k,num(x.value),null));document.querySelectorAll('[data-d]').forEach(x=>x.onchange=()=>saveStat(x.dataset.d,null,x.checked))}
async function saveStat(key,k,d){let[r,p]=key.split('|'),o=S.find(x=>x.round_id===r&&x.player_id===p);if(o){let z={};if(k!==null)z.kills=k;if(d!==null)z.died=d;await api('/pubg_round_player_stats?id=eq.'+o.id,{method:'PATCH',body:JSON.stringify(z)})}else await api('/pubg_round_player_stats',{method:'POST',body:JSON.stringify({round_id:r,player_id:p,kills:k??0,died:d??false})})}
normalChicken.onchange=()=>api('/pubg_rooms?id=eq.'+R.id,{method:'PATCH',body:JSON.stringify({chicken_kills:num(normalChicken.value)})});sanhokChicken.onchange=()=>api('/pubg_rooms?id=eq.'+R.id,{method:'PATCH',body:JSON.stringify({sanhok_chicken_kills:num(sanhokChicken.value)})});top10.onchange=()=>api('/pubg_rooms?id=eq.'+R.id,{method:'PATCH',body:JSON.stringify({top10_no_death_penalty:top10.checked})});addRound.onclick=async()=>{await api('/pubg_rounds',{method:'POST',body:JSON.stringify({room_id:R.id,round_no:RO.length?Math.max(...RO.map(x=>x.round_no))+1:1})});load()};load();setInterval(load,1800);
</script></body></html>
