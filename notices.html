<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공지 · 요닝 방송도구함</title>
<style>
*{box-sizing:border-box}html{overflow-y:scroll;scrollbar-gutter:stable}body{margin:0;background:#fafafa;color:#262626;font-family:"Nanum Square Round","Noto Sans KR",Arial,sans-serif}.globalNavbarFrame{display:block;width:100%;height:58px;border:0}main{max-width:1010px;margin:38px auto 70px;padding:0 24px}.noticeHeader{padding:0 0 22px;margin-bottom:26px;border-bottom:1px solid #dbdbdb;display:flex;align-items:center;gap:12px}.noticeHeader h1{font-size:23px;font-weight:800;margin:0;letter-spacing:-.6px}#noticeList{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}#noticeList li{min-width:0}.noticeCard{border:1px solid #dbdbdb;border-radius:9px;background:#fff;overflow:hidden}.postHeader{display:flex;align-items:center;gap:11px;padding:14px 16px}.avatarRing{width:40px;height:40px;flex-shrink:0;padding:2px;border-radius:50%;background:linear-gradient(35deg,#ffd776,#ff834d,#e3448e,#9d4edd);display:grid;place-items:center;color:#fff}.avatarRing img{width:36px;height:36px;object-fit:cover;border:2px solid #fff;border-radius:50%}.postIdentity{display:flex;flex-direction:column;gap:4px;min-width:0}.postIdentity strong{font-size:13px;font-weight:800;overflow-wrap:anywhere}.postIdentity time{font-size:10px;color:#8e8e8e}.postGallery{position:relative;background:#f5f5f5}.photoTrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.photoTrack::-webkit-scrollbar{display:none}.photoTrack img{display:block;flex:0 0 100%;width:100%;min-width:0;aspect-ratio:1/1;object-fit:contain;scroll-snap-align:start;cursor:pointer}.photoPrev,.photoNext{position:absolute;top:50%;transform:translateY(-50%);border:0;border-radius:50%;background:#ffffffec;color:#262626;width:28px;height:28px;font-size:23px;line-height:1;box-shadow:0 1px 5px #0002;cursor:pointer}.photoPrev{left:11px}.photoNext{right:11px}.photoPrev[hidden],.photoNext[hidden]{display:none}.photoCount{position:absolute;right:12px;top:12px;background:#0009;color:#fff;border-radius:20px;font-size:10px;padding:5px 9px}.noticeBody{padding:17px 17px 19px}.title{display:block;border:0;background:none;color:#262626;padding:0;text-align:left;font:inherit;font-size:15px;font-weight:800;line-height:1.5;cursor:pointer;overflow-wrap:anywhere;margin-bottom:8px}.preview{font-size:13px;line-height:1.8;margin:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.readPost{border:0;background:none;color:#8e8e8e;font:inherit;font-size:12px;padding:9px 0 0;cursor:pointer}.readPost:hover{color:#262626}button:focus-visible{outline:2px solid #0095f6;outline-offset:3px}#noticeMore{display:block;margin:32px auto 0;border:1px solid #dbdbdb;border-radius:7px;background:#fff;color:#262626;padding:11px 25px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}#noticeMore[hidden],#noticeStatus[hidden]{display:none}#noticeStatus{text-align:center;padding:28px;color:#8e8e8e;font-size:13px}#noticeMore:disabled{cursor:wait}@media(max-width:640px){main{margin:26px auto 45px;padding:0 14px}.noticeHeader{margin-bottom:20px;padding-bottom:18px}#noticeList{grid-template-columns:1fr;gap:24px}.noticeCard{border-radius:8px}.noticeHeader h1{font-size:21px}}
</style></head><body>
<iframe class="globalNavbarFrame" src="navbar.html" title="상단 메뉴" scrolling="no"></iframe>
<main><header class="noticeHeader"><h1>공지</h1></header>
<p id="noticeStatus" role="status">공지를 불러오는 중입니다.</p><ul id="noticeList"></ul><button id="noticeMore" type="button" hidden>이전 공지 더 보기</button></main>
<script id="notice-client-script" src="notice-client.js"></script>
</body></html>
