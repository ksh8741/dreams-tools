<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타크래프트 티어표</title><link rel="stylesheet" href="navbar.css">






<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
  margin:0;
  color:#16191d;
  font-family:Inter,Arial,"Noto Sans KR",sans-serif;
  background:#f6f6f4;
}
main{
  width:min(1480px,calc(100% - 160px));
  margin:34px auto 110px;
}
.pageTitleWrap{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin:0 0 24px;padding:0 4px;
}
.pageTitleWrap h1{
  margin:0;font-size:32px;font-weight:1000;letter-spacing:-1.9px;
}
.pageSub{
  margin-top:5px;font-size:10px;font-weight:900;letter-spacing:1.7px;color:#9a9da2;
}

/* no giant outer table */
.board{
  display:flex;flex-direction:column;gap:34px;
  background:transparent;border:0;box-shadow:none;overflow:visible;
}

/* magazine section */
.tier{
  position:relative;display:block;min-height:0;
  border:0;background:transparent;box-shadow:none;overflow:visible;
  scroll-margin-top:28px;
}
.tierLabel{
  position:relative;
  height:45px;padding:0 2px 13px;
  display:flex;align-items:flex-end;justify-content:flex-start;
  writing-mode:initial;transform:none;
  border-bottom:2px solid #181b1f;
  background:transparent;color:#17191d;
  font-size:23px;font-weight:1000;letter-spacing:-1.1px;
}
.tierLabel:before{
  content:"";width:7px;height:7px;margin:0 10px 6px 1px;
  border-radius:50%;background:#181b1f;
}
.tierLabel:after{
  content:"ROSTER";
  margin-left:auto;margin-bottom:3px;
  font-size:8px;font-weight:1000;letter-spacing:2px;color:#a2a5aa;
}

.members{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:24px 16px;
  padding:18px 0 0;
  align-items:start;
}

/* ===== V13: editorial portrait tile, almost no card container ===== */
.playerCard{
  --race:#7f858c;
  position:relative;display:block;min-width:0;
  color:#181b1f;text-decoration:none;
  background:transparent;border:0;border-radius:0;overflow:visible;
  transition:transform .18s ease;
}
.playerCard:hover{transform:translateY(-5px)}
.playerCard.T{--race:#2877c9}
.playerCard.Z{--race:#7848b2}
.playerCard.P{--race:#c18f00}

.portrait{
  position:relative;width:100%;aspect-ratio:5/6.15;
  margin:0;overflow:hidden;
  border:0;border-radius:16px 16px 16px 3px;
  background:#fff;
  box-shadow:0 10px 24px rgba(26,30,36,.09);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 19px),calc(100% - 19px) 100%,0 100%);
}
.portrait:after{
  content:"";display:block;
  position:absolute;z-index:4;
  left:0;bottom:0;width:46px;height:5px;
  background:var(--race);
}
.profileImg{
  position:relative;z-index:1;display:block;
  width:100%;height:100%;object-fit:cover;background:#fff;
}
.blankPortrait{
  position:absolute;inset:0;z-index:0;background:#fff;
}

/* identity is typography, not another box */
.namePlate{
  position:relative;margin:0;padding:10px 3px 0;
  min-height:37px;
  display:flex;align-items:center;justify-content:flex-start;gap:6px;
  border:0;background:transparent;box-shadow:none;
  color:#1b1e22;font-size:13px;font-weight:1000;
}
.playerName{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.raceText{
  flex:0 0 auto;width:auto;height:auto;
  display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:0;background:transparent;
  color:var(--race);font-size:11px;font-weight:1000;
}
.raceText:before{
  content:"/";margin-right:5px;color:#c0c3c7;font-weight:700;
}

/* LIVE is an editorial red dot + label */
.liveBadge{
  order:-1;
  flex:0 0 auto;height:auto;padding:0;
  display:inline-flex;align-items:center;gap:4px;
  border-radius:0;background:transparent;color:#e72d45;
  font-size:8px;font-weight:1000;letter-spacing:.45px;
}
.liveBadge:before{
  content:"";width:6px;height:6px;border-radius:50%;background:#e72d45;
  box-shadow:0 0 0 3px rgba(231,45,69,.10);
}

/* university mark: small square seal */
.univBadge{
  position:absolute;left:9px;top:9px;z-index:8;
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;background:rgba(255,255,255,.91);
  border:1px solid rgba(225,227,230,.9);
  box-shadow:0 4px 12px rgba(0,0,0,.13);overflow:hidden;
}
.univBadge img{width:29px;height:29px;object-fit:contain}

/* status tags run vertically down right side */
.cornerBadges{
  position:absolute;right:8px;top:8px;bottom:auto;z-index:8;
  display:flex;flex-direction:column;align-items:flex-end;gap:5px;
}
.stateBadge{
  height:21px;padding:0 7px;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,.45);border-radius:6px;
  color:#fff;font-size:8px;font-weight:1000;letter-spacing:.6px;
  backdrop-filter:blur(5px);
  box-shadow:0 3px 10px rgba(0,0,0,.14);
}
.stateBadge.up{background:rgba(221,49,61,.94)}
.stateBadge.new{background:rgba(19,22,26,.94)}
.stateBadge.repair{background:rgba(225,133,19,.95)}

/* promotion: only the signature line and portrait shadow glow */
.playerCard.soon .portrait{
  animation:v13Glow .9s ease-in-out infinite alternate;
}
.playerCard.soon .portrait:after{
  animation:v13Line  .9s ease-in-out infinite alternate;
}
@keyframes v13Glow{
  from{box-shadow:0 10px 24px rgba(26,30,36,.09)}
  to{
    box-shadow:
      0 10px 26px rgba(26,30,36,.10),
      0 0 0 2px color-mix(in srgb,var(--race) 45%,transparent),
      0 0 18px color-mix(in srgb,var(--race) 28%,transparent);
  }
}
@keyframes v13Line{
  from{width:46px;box-shadow:0 0 3px var(--race)}
  to{width:76px;box-shadow:0 0 14px var(--race)}
}

/* inactive */
.playerCard.idle{
  opacity:.42;filter:grayscale(.92) saturate(.18);
}
.playerCard.idle .portrait:after{background:#8e9297}
.playerCard.idle .raceText{color:#8e9297}
.playerCard.missing{opacity:.84}

/* fixed menu intentionally preserved */
.tierRail{
  position:fixed;right:22px;top:50%;transform:translateY(-50%);
  z-index:9000;width:82px;padding:9px 7px 10px;
  border:1px solid rgba(218,221,226,.9);border-radius:22px;
  background:rgba(250,250,251,.86);backdrop-filter:blur(18px);
  box-shadow:0 18px 55px rgba(21,24,30,.13);
}
.tierRailTitle{
  height:25px;display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:1000;letter-spacing:1.8px;color:#a1a6ad;
}
.tierJump{
  position:relative;height:30px;margin:2px 0;padding:0 5px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;text-decoration:none;background:transparent;
  color:#666c74;font-size:10px;font-weight:900;transition:.15s;
}
.tierJump:before{
  content:"";position:absolute;left:4px;width:3px;height:3px;
  border-radius:50%;background:#c8ccd2;transition:.15s;
}
.tierJump:hover{background:#eceef1;color:#16181c}
.tierJump.active{
  background:#17191d;color:#fff;box-shadow:0 5px 14px rgba(23,25,29,.18);
}
.tierJump.active:before{background:#fff;height:12px;border-radius:3px}

.loading{padding:30px;color:#8c929a}
@media(max-width:950px){
  main{width:calc(100% - 24px)}
  .tierRail{display:none}
}
@media(max-width:700px){
  .members{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 10px}
  .tierLabel{font-size:19px}
}
</style>





</head>
<body>
<nav id="global-navbar" class="globalNav"><div class="globalNavInner"><a class="globalNavBrand" href="index.html">MUJE</a><div class="globalNavLinks"><a class="globalNavLink" href="pubg.html">배틀그라운드</a><a class="globalNavLink active" href="starcraft.html">스타크래프트</a></div></div></nav>
<main>
      <div class="pageTitleWrap">
        <div>
          <h1>스타크래프트 티어표</h1>
          <div class="pageSub">SOOP STARCRAFT TIER BOARD</div>
        </div>
      </div>
      <div id="board" class="board"><div class="loading">티어표 불러오는 중...</div></div>
    </main>
    <aside id="tierRail" class="tierRail">
      <div class="tierRailTitle">TIER</div>
    </aside>

<script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];
const RACE_ORDER={T:0,Z:1,P:2};
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flags(x){return Array.isArray(x.status_flags)?x.status_flags:[]}

function fallbackOrImage(x){
  const img=(x.soop_profile_image||'').trim();
  if(!img) return '<div class="blankPortrait" aria-label="프로필 이미지 없음"></div>';
  return `<img class="profileImg" src="${e(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=&quot;blankPortrait&quot;></div>')">`;
}

function universityBadge(x){
  const img=x.university_logo||x.school_logo||'';
  if(!img)return '';
  return `<span class="univBadge" title="${e(x.university_name||x.school_name||'소속')}"><img src="${e(img)}" alt="" onerror="this.parentElement.remove()"></span>`;
}

function cornerBadges(x){
  const f=flags(x),arr=[];
  if(f.includes('up'))arr.push('<span class="stateBadge up">UP</span>');
  if(f.includes('new'))arr.push('<span class="stateBadge new">NEW</span>');
  if(f.includes('repair'))arr.push('<span class="stateBadge repair">REPAIR</span>');
  return arr.length?'<span class="cornerBadges">'+arr.join('')+'</span>':'';
}

function card(x){
  const f=flags(x);
  const cls=['playerCard',x.race||'',f.includes('soon')?'soon':'',f.includes('idle')?'idle':'',x.soop_user_id?'':'missing'].filter(Boolean).join(' ');
  const live=!!(x.live||x.is_live||x.broadcast_live);
  const href=x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#';
  const name=e(x.display_name||x.soop_nickname||x.player_name);
  return `<a class="${cls}" href="${href}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>
    <div class="portrait">
      ${fallbackOrImage(x)}
      ${universityBadge(x)}
      ${cornerBadges(x)}
    </div>
    <div class="namePlate">
      ${live?'<span class="liveBadge">LIVE</span>':''}
      <span class="playerName">${name}</span>
      <span class="raceText">${e(String(x.race||'').toUpperCase())}</span>
    </div>
  </a>`;
}

function tierId(t){return 'tier-'+String(t).replace(/[^0-9A-Za-z가-힣]/g,'-')}
function buildRail(){
  tierRail.innerHTML='<div class="tierRailTitle">TIER</div>'+TIERS.map(t=>`<a class="tierJump" href="#${tierId(t)}">${t}</a>`).join('');
}
function setupRailObserver(){
  const links=[...document.querySelectorAll('.tierJump')];
  const sections=[...document.querySelectorAll('.tier')];
  if(!sections.length)return;
  const io=new IntersectionObserver(entries=>{
    const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(!visible)return;
    links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+visible.target.id));
  },{rootMargin:'-35% 0px -50% 0px',threshold:[0,.2,.5,.8]});
  sections.forEach(s=>io.observe(s));
}
async function load(){
  const r=await fetch('/api/star-public',{cache:'no-store'});
  if(!r.ok){board.innerHTML='<div class="loading">티어표 불러오기 실패</div>';return}
  const j=await r.json(),a=j.players||[];
  board.innerHTML=TIERS.map(t=>{
    const p=a.filter(x=>x.tier===t).sort((a,b)=>{
      const ai=flags(a).includes('idle')?1:0;
      const bi=flags(b).includes('idle')?1:0;
      return ai-bi ||
        (RACE_ORDER[a.race]??9)-(RACE_ORDER[b.race]??9) ||
        (Number(a.sort_order||0)-Number(b.sort_order||0));
    });
    return `<div class="tier" id="${tierId(t)}"><div class="tierLabel">${t}</div><div class="members">${p.map(card).join('')}</div></div>`;
  }).join('');
  buildRail();
  setupRailObserver();
}
load();
</script>
<script src="navbar.js"></script>
</body></html>
