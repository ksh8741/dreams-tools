<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타크래프트 티어표</title><link rel="stylesheet" href="navbar.css">

<style>
*{box-sizing:border-box}
html{overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;background:#f4f5f7;color:#15171a;font-family:Arial,"Noto Sans KR",sans-serif}
main{width:min(1280px,calc(100% - 30px));margin:30px auto 70px}
h1{font-size:24px;margin:0 0 16px}
.board{border:1px solid #d8dce1;background:#fff}
.tier{display:grid;grid-template-columns:90px 1fr;min-height:150px;border-bottom:1px solid #e2e5e9}
.tier:last-child{border-bottom:0}
.tierLabel{display:flex;align-items:center;justify-content:center;border-right:1px solid #ddd;font-size:18px;font-weight:1000;background:#f8f9fa}
.members{display:flex;align-items:flex-start;flex-wrap:wrap;gap:14px;padding:16px}

.playerCard{
  --race:#7c8796;
  position:relative;
  width:154px;
  text-decoration:none;
  color:inherit;
  display:block;
  border-radius:12px;
  transition:transform .12s ease,filter .12s ease
}
.playerCard:hover{transform:translateY(-2px)}
.playerCard.T{--race:#3488ff}
.playerCard.Z{--race:#9b5cff}
.playerCard.P{--race:#e0ad00}

.playerCard.idle{filter:grayscale(.72) saturate(.35);opacity:.62}
.playerCard.idle .portrait{border-color:color-mix(in srgb,var(--race) 35%,#8e9297 65%)}
.playerCard.idle .namePlate{color:color-mix(in srgb,var(--race) 30%,#6f747b 70%)}

.portrait{
  position:relative;
  width:154px;
  height:154px;
  overflow:hidden;
  border-radius:12px;
  border:3px solid var(--race);
  background:#edf0f3;
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}
.portrait img{display:block;width:100%;height:100%;object-fit:cover;position:relative;z-index:1}

.userFallback{position:absolute;inset:0;background:#e9edf1;z-index:0}
.userFallback::before{
  content:"";
  position:absolute;
  width:48px;height:48px;border-radius:50%;
  background:#aeb5bd;top:33px;left:50%;transform:translateX(-50%)
}
.userFallback::after{
  content:"";
  position:absolute;
  width:86px;height:58px;border-radius:50% 50% 18px 18px;
  background:#aeb5bd;bottom:23px;left:50%;transform:translateX(-50%)
}

.univBadge{
  position:absolute;left:7px;top:7px;width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  border-radius:9px;background:rgba(12,14,17,.86);
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 2px 8px rgba(0,0,0,.22);z-index:5
}
.univBadge img{width:28px;height:28px;object-fit:contain}

.playerCard.soon .portrait{animation:raceGlow 1.15s ease-in-out infinite alternate}
@keyframes raceGlow{
  from{box-shadow:0 0 0 1px color-mix(in srgb,var(--race) 45%,transparent),0 0 8px color-mix(in srgb,var(--race) 50%,transparent)}
  to{box-shadow:0 0 0 2px var(--race),0 0 20px var(--race),0 0 30px color-mix(in srgb,var(--race) 65%,transparent)}
}

.cornerBadges{
  position:absolute;right:7px;bottom:7px;z-index:6;
  display:flex;flex-direction:column;align-items:flex-end;gap:4px
}
.stateBadge{
  display:inline-flex;align-items:center;justify-content:center;
  height:22px;padding:0 7px;border-radius:5px;
  font-size:10px;font-weight:1000;letter-spacing:.25px;color:#fff;
  border:1px solid rgba(255,255,255,.48);
  box-shadow:0 2px 7px rgba(0,0,0,.28)
}
.stateBadge.up{background:#ff3e3e}
.stateBadge.new{background:#17191d}
.stateBadge.repair{background:#ff8a00}

.namePlate{
  margin-top:7px;min-height:34px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:6px 8px;
  border:1px solid color-mix(in srgb,var(--race) 58%,#d8dce1 42%);
  border-radius:8px;background:#fff;color:var(--race);
  font-size:13px;font-weight:1000
}
.playerName{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.raceText{flex:0 0 auto;font-weight:1000;color:var(--race)}

.liveBadge{
  flex:0 0 auto;height:18px;display:inline-flex;align-items:center;justify-content:center;
  padding:0 5px;border-radius:4px;background:#ff2647;color:#fff;
  font-size:9px;font-weight:1000;letter-spacing:.3px
}
.playerCard.missing{opacity:.82}
.loading{padding:26px;color:#888}

@media(max-width:650px){
  .tier{grid-template-columns:58px 1fr}
  .tierLabel{font-size:15px}
  .members{gap:10px;padding:10px}
  .playerCard,.portrait{width:136px}
  .portrait{height:136px}
}
</style>
</head>
<body>
<nav id="global-navbar" class="globalNav"><div class="globalNavInner"><a class="globalNavBrand" href="index.html">MUJE</a><div class="globalNavLinks"><a class="globalNavLink" href="pubg.html">배틀그라운드</a><a class="globalNavLink active" href="starcraft.html">스타크래프트</a></div></div></nav>
<main><h1>스타크래프트 티어표</h1><div id="board" class="board"><div class="loading">티어표 불러오는 중...</div></div></main>

<script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];
const RACE_ORDER={T:0,Z:1,P:2};
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flags(x){return Array.isArray(x.status_flags)?x.status_flags:[]}

function fallbackOrImage(x){
  const img=x.soop_profile_image||'';
  if(!img)return '<div class="userFallback" aria-label="프로필 이미지 없음"></div>';
  return `<div class="userFallback" aria-hidden="true"></div><img src="${e(img)}" alt="" onerror="this.remove()">`;
}

function universityBadge(x){
  const img=x.university_logo||x.school_logo||'';
  if(!img)return '';
  return `<span class="univBadge" title="${e(x.university_name||x.school_name||'소속')}"><img src="${e(img)}" alt="" onerror="this.parentElement.remove()"></span>`;
}

function cornerBadges(x){
  const f=flags(x),arr=[];
  if(f.includes('up'))arr.push('<span class="stateBadge up">UP</span>');
  if(f.includes('new'))arr.push('<span class="stateBadge new">NEW</span>');
  if(f.includes('repair'))arr.push('<span class="stateBadge repair">REPAIR</span>');
  return arr.length?'<span class="cornerBadges">'+arr.join('')+'</span>':'';
}

function card(x){
  const f=flags(x);
  const cls=['playerCard',x.race||'',f.includes('soon')?'soon':'',f.includes('idle')?'idle':'',x.soop_user_id?'':'missing'].filter(Boolean).join(' ');
  const live=!!(x.live||x.is_live||x.broadcast_live);
  const href=x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#';
  const name=e(x.display_name||x.soop_nickname||x.player_name);
  return `<a class="${cls}" href="${href}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>
    <div class="portrait">
      ${fallbackOrImage(x)}
      ${universityBadge(x)}
      ${cornerBadges(x)}
    </div>
    <div class="namePlate">
      ${live?'<span class="liveBadge">LIVE</span>':''}
      <span class="playerName">${name}</span>
      <span class="raceText">${e(String(x.race||'').toUpperCase())}</span>
    </div>
  </a>`;
}

async function load(){
  const r=await fetch('/api/star-public',{cache:'no-store'});
  if(!r.ok){board.innerHTML='<div class="loading">티어표 불러오기 실패</div>';return}
  const j=await r.json(),a=j.players||[];
  board.innerHTML=TIERS.map(t=>{
    const p=a.filter(x=>x.tier===t).sort((a,b)=>{
      // 휴면은 해당 티어의 맨 뒤. 휴면끼리는 종족 → 기존 순서 유지.
      const ai=flags(a).includes('idle')?1:0;
      const bi=flags(b).includes('idle')?1:0;
      return ai-bi ||
        (RACE_ORDER[a.race]??9)-(RACE_ORDER[b.race]??9) ||
        (Number(a.sort_order||0)-Number(b.sort_order||0));
    });
    return `<div class="tier"><div class="tierLabel">${t}</div><div class="members">${p.map(card).join('')}</div></div>`;
  }).join('');
}
load();
</script>
<script src="navbar.js"></script>
</body></html>
