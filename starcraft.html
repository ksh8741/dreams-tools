<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타크래프트 티어표</title><link rel="stylesheet" href="navbar.css">
<style>
*{box-sizing:border-box}html{overflow-y:scroll;scrollbar-gutter:stable}body{margin:0;background:#f4f5f7;color:#15171a;font-family:Arial,"Noto Sans KR",sans-serif}main{width:min(1180px,calc(100% - 30px));margin:30px auto 70px}h1{font-size:24px;margin:0 0 16px}.board{border:1px solid #d8dce1;background:#fff}.tier{display:grid;grid-template-columns:86px 1fr;min-height:94px;border-bottom:1px solid #e2e5e9}.tier:last-child{border-bottom:0}.tierLabel{display:flex;align-items:center;justify-content:center;border-right:1px solid #ddd;font-size:17px;font-weight:1000;background:#f8f9fa}.members{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px}.streamer{position:relative;width:158px;height:68px;border:1px solid #d9dde2;background:#fff;display:flex;align-items:center;padding:8px;gap:8px;text-decoration:none;color:inherit}.streamer:hover{border-color:#888}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#eee;flex:0 0 auto}.info{min-width:0;flex:1}.line{display:flex;align-items:center;gap:4px;min-width:0}.name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#999;margin-top:5px}.badges{display:flex;gap:2px;flex-shrink:0}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 2px;border:1px solid #ddd;background:#fafafa;font-size:10px}.missing{opacity:.55}.loading{padding:26px;color:#888}</style></head>
<body>
<nav id="global-navbar" class="globalNav"><div class="globalNavInner"><a class="globalNavBrand" href="index.html">MUJE</a><div class="globalNavLinks"><a class="globalNavLink" href="pubg.html">배틀그라운드</a><a class="globalNavLink active" href="starcraft.html">스타크래프트</a></div></div></nav>
<main><h1>스타크래프트 티어표</h1><div id="board" class="board"><div class="loading">티어표 불러오는 중...</div></div></main>
<script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];
const FLAGS={soon:['⏫','티어상승임박'],up:['▲','최근티어상승'],idle:['⏸','휴면'],repair:['🔧','수리'],new:['✦','신규']};
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function badges(x){const a=Array.isArray(x.status_flags)?x.status_flags:[];return '<span class="badges">'+a.filter(k=>FLAGS[k]).map(k=>`<span class="badge" title="${FLAGS[k][1]}">${FLAGS[k][0]}</span>`).join('')+'</span>'}
async function load(){const r=await fetch('/api/star-public',{cache:'no-store'});if(!r.ok){board.innerHTML='<div class="loading">티어표 불러오기 실패</div>';return}const j=await r.json(),a=j.players||[];board.innerHTML=TIERS.map(t=>{const p=a.filter(x=>x.tier===t);return `<div class="tier"><div class="tierLabel">${t}</div><div class="members">${p.map(x=>`<a class="streamer ${x.soop_user_id?'':'missing'}" href="${x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#'}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>${x.soop_profile_image?`<img class="avatar" src="${e(x.soop_profile_image)}">`:`<div class="avatar"></div>`}<div class="info"><div class="line"><div class="name">${e(x.display_name||x.soop_nickname||x.player_name)}</div>${badges(x)}</div><div class="meta">${x.race}</div></div></a>`).join('')}</div></div>`}).join('')}load();
</script><script src="navbar.js"></script>
</body></html>
