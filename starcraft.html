<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타크래프트 티어표</title><link rel="stylesheet" href="navbar.css">








<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
  margin:0;background:#f2f3f5;color:#15181c;
  font-family:Inter,Arial,"Noto Sans KR",sans-serif;
}
main{width:min(1450px,calc(100% - 165px));margin:34px auto 110px}
.pageTitleWrap{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin:0 0 22px;padding:0 2px 17px;border-bottom:1px solid #d9dde2
}
.pageTitleWrap h1{margin:0;font-size:31px;font-weight:1000;letter-spacing:-1.8px}
.pageSub{margin-top:5px;font-size:9px;font-weight:900;letter-spacing:2px;color:#979da4}

.board{display:flex;flex-direction:column;gap:18px;background:transparent;border:0;box-shadow:none;overflow:visible}
.tier{
  display:block;overflow:hidden;min-height:0;
  border:1px solid #dce1e6;border-radius:22px;background:#fff;
  box-shadow:0 12px 34px rgba(27,33,41,.06);scroll-margin-top:24px
}
.tierLabel{
  height:55px;padding:0 22px;
  display:flex;align-items:center;justify-content:flex-start;
  writing-mode:initial;transform:none;background:#171a1f;color:#fff;
  font-size:19px;font-weight:1000;letter-spacing:-.5px
}
.tierLabel:before{
  content:"";width:5px;height:20px;border-radius:99px;background:#fff;margin-right:11px;opacity:.9
}
.tierLabel:after{
  content:"STARCRAFT TIER";margin-left:auto;
  font-size:8px;letter-spacing:1.8px;color:#6f7780;font-weight:900
}

/* Every race gets its own row */
.members{display:block;padding:0}
.raceGroup{
  --race:#7c838b;
  display:grid;grid-template-columns:78px 1fr;
  min-height:165px;border-bottom:1px solid #eceff2
}
.raceGroup:last-child{border-bottom:0}
.raceGroup.T{--race:#2c78d2}
.raceGroup.Z{--race:#8050c1}
.raceGroup.P{--race:#c99a00}
.raceGroup.empty{display:none}
.raceHead{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  background:#f7f8fa;border-right:1px solid #e7eaee;
  color:var(--race);font-weight:1000
}
.raceLetter{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--race);color:#fff;font-size:14px;font-weight:1000
}
.raceName{font-size:9px;letter-spacing:-.2px;color:#777e86}
.racePlayers{
  display:flex;align-items:flex-start;flex-wrap:wrap;
  gap:18px;padding:18px 20px 20px
}

/* V15: circular medallion player, no conventional rectangular card */
.playerCard{
  --race:#7c838b;position:relative;width:132px;display:block;
  text-decoration:none;color:#171a1f;text-align:center;
  background:transparent;border:0;transition:transform .16s ease
}
.playerCard:hover{transform:translateY(-4px)}
.playerCard.T{--race:#2c78d2}
.playerCard.Z{--race:#8050c1}
.playerCard.P{--race:#c99a00}

.portrait{
  position:relative;width:118px;height:118px;aspect-ratio:1/1;
  margin:0 auto;overflow:hidden;border-radius:50%;
  background:#fff;border:5px solid #fff;
  box-shadow:0 0 0 2px var(--race),0 8px 20px rgba(25,31,39,.12)
}
.profileImg{
  position:relative;z-index:1;display:block;width:100%;height:100%;
  object-fit:cover;border-radius:50%;background:#fff
}
.blankPortrait{position:absolute;inset:0;z-index:0;border-radius:50%;background:#fff}

/* small race tab below the medallion */
.portrait:after{
  content:attr(data-race);
  position:absolute;z-index:6;right:4px;bottom:4px;
  width:25px;height:25px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--race);color:#fff;border:2px solid #fff;
  font-size:9px;font-weight:1000
}

.namePlate{
  margin:8px 0 0;padding:0 3px;min-height:27px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  border:0;background:transparent;box-shadow:none;
  color:#202328;font-size:12px;font-weight:1000
}
.playerName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.raceText{display:none}

/* live is attached to name, not photo */
.liveBadge{
  position:static;order:-1;height:17px;padding:0 5px;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#ed2947;color:#fff;font-size:7px;font-weight:1000;letter-spacing:.45px;
  box-shadow:none
}
.liveBadge:before{display:none}

/* university seal */
.univBadge{
  position:absolute;left:2px;top:2px;z-index:8;width:31px;height:31px;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:#fff;border:2px solid #fff;box-shadow:0 3px 9px rgba(0,0,0,.16);overflow:hidden
}
.univBadge img{width:26px;height:26px;object-fit:contain}

/* badges fan out at lower right */
.cornerBadges{
  position:absolute;right:-4px;bottom:5px;top:auto;z-index:9;
  display:flex;flex-direction:column;align-items:flex-end;gap:3px
}
.stateBadge{
  height:19px;padding:0 6px;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-size:7px;font-weight:1000;letter-spacing:.55px;
  border:2px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.14)
}
.stateBadge.up{background:#eb3448}
.stateBadge.new{background:#171a1f}
.stateBadge.repair{background:#e38b19}

/* promotion = circular halo */
.playerCard.soon .portrait{animation:halo 1s ease-in-out infinite alternate}
@keyframes halo{
  from{box-shadow:0 0 0 2px var(--race),0 8px 20px rgba(25,31,39,.12)}
  to{box-shadow:0 0 0 3px var(--race),0 0 18px var(--race),0 0 31px color-mix(in srgb,var(--race) 32%,transparent)}
}
.playerCard.idle{opacity:.42;filter:grayscale(.92) saturate(.18)}
.playerCard.idle .portrait{box-shadow:0 0 0 2px #91969c,0 7px 17px rgba(25,31,39,.08)}
.playerCard.missing{opacity:.86}

/* fixed menu preserved */
.tierRail{
  position:fixed;right:22px;top:50%;transform:translateY(-50%);
  z-index:9000;width:82px;padding:9px 7px 10px;
  border:1px solid rgba(218,221,226,.9);border-radius:22px;
  background:rgba(250,250,251,.86);backdrop-filter:blur(18px);
  box-shadow:0 18px 55px rgba(21,24,30,.13)
}
.tierRailTitle{height:25px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:1000;letter-spacing:1.8px;color:#a1a6ad}
.tierJump{
  position:relative;height:30px;margin:2px 0;padding:0 5px;
  display:flex;align-items:center;justify-content:center;border-radius:10px;
  text-decoration:none;background:transparent;color:#666c74;font-size:10px;font-weight:900;transition:.15s
}
.tierJump:before{content:"";position:absolute;left:4px;width:3px;height:3px;border-radius:50%;background:#c8ccd2;transition:.15s}
.tierJump:hover{background:#eceef1;color:#16181c}
.tierJump.active{background:#17191d;color:#fff;box-shadow:0 5px 14px rgba(23,25,29,.18)}
.tierJump.active:before{background:#fff;height:12px;border-radius:3px}
.loading{padding:30px;color:#8c929a}

@media(max-width:950px){
  main{width:calc(100% - 24px)} .tierRail{display:none}
}
@media(max-width:650px){
  .raceGroup{grid-template-columns:50px 1fr}
  .racePlayers{gap:13px;padding:14px 10px}
  .playerCard{width:110px}
  .portrait{width:100px;height:100px}
  .raceName{display:none}
}
</style>







</head>
<body>
<nav id="global-navbar" class="globalNav"><div class="globalNavInner"><a class="globalNavBrand" href="index.html">MUJE</a><div class="globalNavLinks"><a class="globalNavLink" href="pubg.html">배틀그라운드</a><a class="globalNavLink active" href="starcraft.html">스타크래프트</a></div></div></nav>
<main>
      <div class="pageTitleWrap">
        <div>
          <h1>스타크래프트 티어표</h1>
          <div class="pageSub">SOOP STARCRAFT TIER BOARD</div>
        </div>
      </div>
      <div id="board" class="board"><div class="loading">티어표 불러오는 중...</div></div>
    </main>
    <aside id="tierRail" class="tierRail">
      <div class="tierRailTitle">TIER</div>
    </aside>

<script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];
const RACE_ORDER={T:0,Z:1,P:2};
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flags(x){return Array.isArray(x.status_flags)?x.status_flags:[]}

function fallbackOrImage(x){
  const img=(x.soop_profile_image||'').trim();
  if(!img) return '<div class="blankPortrait" aria-label="프로필 이미지 없음"></div>';
  return `<img class="profileImg" src="${e(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=&quot;blankPortrait&quot;></div>')">`;
}

function universityBadge(x){
  const img=x.university_logo||x.school_logo||'';
  if(!img)return '';
  return `<span class="univBadge" title="${e(x.university_name||x.school_name||'소속')}"><img src="${e(img)}" alt="" onerror="this.parentElement.remove()"></span>`;
}

function cornerBadges(x){
  const f=flags(x),arr=[];
  if(f.includes('up'))arr.push('<span class="stateBadge up">UP</span>');
  if(f.includes('new'))arr.push('<span class="stateBadge new">NEW</span>');
  if(f.includes('repair'))arr.push('<span class="stateBadge repair">REPAIR</span>');
  return arr.length?'<span class="cornerBadges">'+arr.join('')+'</span>':'';
}

function card(x){
  const f=flags(x);
  const cls=['playerCard',x.race||'',f.includes('soon')?'soon':'',f.includes('idle')?'idle':'',x.soop_user_id?'':'missing'].filter(Boolean).join(' ');
  const live=!!(x.live||x.is_live||x.broadcast_live);
  const href=x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#';
  const name=e(x.display_name||x.soop_nickname||x.player_name);
  return `<a class="${cls}" href="${href}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>
    <div class="portrait" data-race="${e(String(x.race||'').toUpperCase())}">
      ${fallbackOrImage(x)}
      ${universityBadge(x)}
      ${cornerBadges(x)}
    </div>
    <div class="namePlate">
      ${live?'<span class="liveBadge">LIVE</span>':''}
      <span class="playerName">${name}</span>
      <span class="raceText">${e(String(x.race||'').toUpperCase())}</span>
    </div>
  </a>`;
}

function tierId(t){return 'tier-'+String(t).replace(/[^0-9A-Za-z가-힣]/g,'-')}
function buildRail(){
  tierRail.innerHTML='<div class="tierRailTitle">TIER</div>'+TIERS.map(t=>`<a class="tierJump" href="#${tierId(t)}">${t}</a>`).join('');
}
function setupRailObserver(){
  const links=[...document.querySelectorAll('.tierJump')];
  const sections=[...document.querySelectorAll('.tier')];
  if(!sections.length)return;
  const io=new IntersectionObserver(entries=>{
    const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(!visible)return;
    links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+visible.target.id));
  },{rootMargin:'-35% 0px -50% 0px',threshold:[0,.2,.5,.8]});
  sections.forEach(s=>io.observe(s));
}
async function load(){
  const r=await fetch('/api/star-public',{cache:'no-store'});
  if(!r.ok){board.innerHTML='<div class="loading">티어표 불러오기 실패</div>';return}
  const j=await r.json(),a=j.players||[];
  board.innerHTML=TIERS.map(t=>{
    const all=a.filter(x=>x.tier===t);
    const raceRow=(race,label)=>{
      const p=all.filter(x=>String(x.race||'').toUpperCase()===race).sort((a,b)=>{
        const ai=flags(a).includes('idle')?1:0;
        const bi=flags(b).includes('idle')?1:0;
        return ai-bi || (Number(a.sort_order||0)-Number(b.sort_order||0));
      });
      return `<div class="raceGroup ${race} ${p.length?'':'empty'}">
        <div class="raceHead"><span class="raceLetter">${race}</span><span class="raceName">${label}</span></div>
        <div class="racePlayers">${p.map(card).join('')}</div>
      </div>`;
    };
    return `<div class="tier" id="${tierId(t)}">
      <div class="tierLabel">${t}</div>
      <div class="members">
        ${raceRow('T','테란')}
        ${raceRow('Z','저그')}
        ${raceRow('P','프로토스')}
      </div>
    </div>`;
  }).join('');
  buildRail();
  setupRailObserver();
}
load();
</script>
<script src="navbar.js"></script>
</body></html>
