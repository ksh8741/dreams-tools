<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>스타크래프트 티어표</title>
    <link rel="stylesheet" href="navbar.css">









    <style>
             * {
                 box-sizing: border-box
             }

             html {
                 scroll-behavior: smooth;
                 scrollbar-gutter: stable
             }

             body {
                 margin: 0;
                 background: #f3f4f6;
                 color: #15181c;
                 font-family: Inter,Arial,"Noto Sans KR",sans-serif
             }

             main {
                 width: min(1200px,calc(100% - 16px));
                 box-sizing: border-box;
                 padding-left: 8px;
                 padding-right: 8px;
                 margin: 34px auto 110px
             }

             .pageTitleWrap {
                 display: flex;
                 align-items: flex-end;
                 justify-content: space-between;
                 margin: 0 0 22px;
                 padding: 0 2px 17px;
                 border-bottom: 1px solid #d9dde2
             }

                 .pageTitleWrap h1 {
                     margin: 0;
                     font-size: 31px;
                     font-weight: 1000;
                     letter-spacing: -1.8px
                 }

             .pageSub {
                 margin-top: 5px;
                 font-size: 9px;
                 font-weight: 900;
                 letter-spacing: 2px;
                 color: #979da4
             }

             .board {
                 display: flex;
                 flex-direction: column;
                 gap: 18px;
                 background: transparent;
                 border: 0;
                 box-shadow: none;
                 overflow: visible
             }

             .tier {
                 display: block;
                 overflow: hidden;
                 min-height: 0;
                 border: 1px solid #dce1e6;
                 border-radius: 22px;
box-shadow: 0 12px 34px rgba(27,33,41,.06);
                 scroll-margin-top: 24px
             }

             .tierLabel {
                 height: 55px;
                 padding: 0 22px;
                 display: flex;
                 align-items: center;
                 justify-content: flex-start;
                 writing-mode: initial;
                 transform: none;
color: #fff;
                 font-size: 19px;
                 font-weight: 1000;
                 letter-spacing: -.5px
             }

                 .tierLabel:before {
                     content: "";
                     width: 5px;
                     height: 20px;
                     border-radius: 99px;
margin-right: 11px;
                     opacity: .9
                 }

                 .tierLabel:after {
                     content: none
                 }

             .tierCounts {
                 margin-left: auto;
                 
                 letter-spacing: -.1px;
                 
                 
  color:#000!important;
  font-size:12px!important;
  font-weight:900!important;
  padding:0!important;
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
  border-radius:0!important;
  outline:0!important;
}

             .members {
                 display: block;
                 padding: 0
             }

             .raceGroup {
                 --race: #7c838b;
                 display: grid;
                 grid-template-columns: 78px 1fr;
                 min-height: 168px;
                 border-bottom: 1px solid #eceff2
             }

                 .raceGroup:last-child {
                     border-bottom: 0
                 }

                 .raceGroup.T {
                     --race: #2c78d2
                 }

                 .raceGroup.Z {
                     --race: #8050c1
                 }

                 .raceGroup.P {
                     --race: #c99a00
                 }

                 .raceGroup.empty {
                     display: none
                 }

             .raceHead {
                 display: flex;
                 flex-direction: column;
                 align-items: center;
                 justify-content: center;
                 gap: 7px;
                 background: #f7f8fa;
                 border-right: 1px solid #e7eaee;
                 color: var(--race);
                 font-weight: 1000
             }

             .raceLetter {
                 width: 34px;
                 height: 34px;
                 border-radius: 50%;
                 display: flex;
                 align-items: center;
                 justify-content: center;
                 background: var(--race);
                 color: #fff;
                 font-size: 14px;
                 font-weight: 1000
             }

             .raceName {
                 font-size: 9px;
                 color: #777e86
             }

             .racePlayers {
                 display: flex;
                 align-items: flex-start;
                 flex-wrap: wrap;
                 gap: 18px;
                 padding: 18px 20px 20px
             }

             /* circular player */
             .playerCard {
                 --race: #7c838b;
                 position: relative;
                 width: 132px;
                 display: block;
                 text-decoration: none;
                 color: #171a1f;
                 text-align: center;
                 background: transparent;
                 border: 0;
                 transition: transform .16s ease
             }

                 .playerCard:hover {
                     transform: translateY(-4px)
                 }

                 .playerCard.T {
                     --race: #2c78d2
                 }

                 .playerCard.Z {
                     --race: #8050c1
                 }

                 .playerCard.P {
                     --race: #c99a00
                 }

             .portrait {
                 position: relative;
                 width: 118px;
                 height: 118px;
                 aspect-ratio: 1/1;
                 margin: 0 auto;
                 overflow: visible;
                 border-radius: 50%;
                 background: transparent
             }

             .profileCore {
                 position: absolute;
                 inset: 0;
                 overflow: hidden;
                 border-radius: 50%;
                 background: #fff;
                 border: 5px solid #fff;
                 box-shadow: 0 0 0 2px var(--race),0 8px 20px rgba(25,31,39,.12)
             }

             .profileImg {
                 position: relative;
                 z-index: 1;
                 display: block;
                 width: 100%;
                 height: 100%;
                 object-fit: cover;
                 border-radius: 50%;
                 background: #fff
             }

             .blankPortrait {
                 position: absolute;
                 inset: 0;
                 z-index: 0;
                 border-radius: 50%;
                 background: #fff
             }

             /* university badge: top-left */
             .univBadge {
                 position: absolute;
                 left: -1px;
                 top: -1px;
                 z-index: 10;
                 width: 32px;
                 height: 32px;
                 display: flex;
                 align-items: center;
                 justify-content: center;
                 border-radius: 50%;
                 background: #fff;
                 border: 2px solid #fff;
                 box-shadow: 0 3px 9px rgba(0,0,0,.16);
                 overflow: hidden
             }

                 .univBadge img {
                     width: 27px;
                     height: 27px;
                     object-fit: contain
                 }

             /* dedicated state positions */
             .upBadge {
                 position: absolute;
                 right: -2px;
                 top: 4px;
                 z-index: 11;
                 width: 28px;
                 height: 28px;
                 border-radius: 50%;
                 display: flex;
                 align-items: center;
                 justify-content: center;
                 background: #ef3549;
                 color: #fff;
                 border: 3px solid #fff;
                 box-shadow: 0 3px 10px rgba(239,53,73,.28);
             }

                 .upBadge:before {
                     content: "";
                     width: 8px;
                     height: 8px;
                     border-top: 2px solid #fff;
                     border-right: 2px solid #fff;
                     transform: translate(-1px,1px) rotate(-45deg)
                 }

                 .upBadge:after {
                     content: "";
                     position: absolute;
                     width: 2px;
                     height: 10px;
                     background: #fff;
                     transform: translate(-2px,3px) rotate(45deg);
                     border-radius: 2px
                 }

             .newBadge {
                 position: absolute;
                 right: -6px;
                 bottom: 7px;
                 z-index: 11;
                 height: 22px;
                 padding: 0 8px;
                 border-radius: 11px;
                 display: flex;
                 align-items: center;
                 justify-content: center;
                 background: #171a1f;
                 color: #fff;
                 border: 2px solid #fff;
                 box-shadow: 0 3px 10px rgba(0,0,0,.16);
                 font-size: 8px;
                 font-weight: 1000;
                 letter-spacing: .7px
             }

             .repairBadge {
                 position: absolute;
                 left: -4px;
                 bottom: 6px;
                 z-index: 11;
                 width: 27px;
                 height: 27px;
                 border-radius: 50%;
                 display: flex;
                 align-items: center;
                 justify-content: center;
                 background: #e28a18;
                 border: 3px solid #fff;
                 box-shadow: 0 3px 10px rgba(226,138,24,.24)
             }

                 .repairBadge:before {
                     content: "";
                     width: 11px;
                     height: 4px;
                     background: #fff;
                     border-radius: 3px;
                     transform: rotate(-45deg)
                 }

                 .repairBadge:after {
                     content: "";
                     position: absolute;
                     width: 5px;
                     height: 5px;
                     border: 2px solid #fff;
                     border-radius: 50%;
                     transform: translate(4px,-4px)
                 }

             /* remove generic state stack from old version */
             .cornerBadges {
                 display: none !important
             }

             /* name line */
             .namePlate {
                 margin: 8px 0 0;
                 padding: 0 3px;
                 min-height: 27px;
                 display: flex;
                 align-items: center;
                 justify-content: center;
                 gap: 5px;
                 border: 0;
                 background: transparent;
                 box-shadow: none;
                 color: #202328;
                 font-size: 12px;
                 font-weight: 1000
             }

             .playerName {
                 min-width: 0;
                 overflow: hidden;
                 text-overflow: ellipsis;
                 white-space: nowrap
             }

             .raceText {
                 display: none
             }

             .liveBadge {
                 position: static;
                 order: -1;
                 height: 17px;
                 padding: 0 5px;
                 border-radius: 5px;
                 display: inline-flex;
                 align-items: center;
                 justify-content: center;
                 background: #ed2947;
                 color: #fff;
                 font-size: 7px;
                 font-weight: 1000;
                 letter-spacing: .45px;
                 box-shadow: none
             }

                 .liveBadge:before {
                     display: none
                 }

             /* promotion soon = halo only */
             .playerCard.soon .profileCore {
                 animation: halo 1s ease-in-out infinite alternate
             }

             @keyframes halo {
                 from {
                     box-shadow: 0 0 0 2px var(--race), 0 8px 20px rgba(25,31,39,.12)
                 }

                 to {
                     box-shadow: 0 0 0 3px var(--race), 0 0 18px var(--race), 0 0 32px color-mix(in srgb,var(--race) 34%,transparent)
                 }
             }

             /* idle */
             .playerCard.idle {
                 opacity: .42;
                 filter: grayscale(.92) saturate(.18)
             }

                 .playerCard.idle .profileCore {
                     box-shadow: 0 0 0 2px #91969c,0 7px 17px rgba(25,31,39,.08)
                 }

             .playerCard.missing {
                 opacity: .86
             }

             /* fixed menu preserved */
             .tierRail {
                 position: fixed;
                 right: 18px;
                 top: 50%;
                 transform: translateY(-50%);
                 z-index: 9000;
                 width: 82px;
                 padding: 9px 7px 10px;
                 border: 1px solid rgba(218,221,226,.9);
                 border-radius: 22px;
backdrop-filter: blur(18px);
                 box-shadow: 0 18px 55px rgba(21,24,30,.13)
             }

             .tierRailTitle {
                 height: 25px;
                 display: flex;
                 align-items: center;
                 justify-content: center;
                 font-size: 8px;
                 font-weight: 1000;
                 letter-spacing: 1.8px;
                 color: #a1a6ad
             }

             .tierJump {
                 position: relative;
                 height: 26px;
                 margin: 1px 0;
                 padding: 0 7px;
                 display: flex;
                 align-items: center;
                 justify-content: center;
                 border-radius: 9px;
                 text-decoration: none;
color: #666c74;
                 font-size: 10px;
                 font-weight: 900;
                 transition: .15s
             }

                 .tierJump:before {
                     content: "";
                     position: absolute;
                     left: 4px;
                     width: 3px;
                     height: 3px;
                     border-radius: 50%;
transition: .15s
                 }

                 .tierJump:hover {color: #16181c
                 }

                 .tierJump.active {color: #fff;
                     box-shadow: 0 5px 14px rgba(23,25,29,.18)
                 }

                     .tierJump.active:before {height: 12px;
                         border-radius: 3px
                     }

             .loading {
                 padding: 30px;
                 color: #8c929a
             }

             @media(max-width:950px) {
                 main {
                     width: calc(100% - 24px)
                 }

                 .tierRail {
                     display: none
                 }
             }

             @media(max-width:650px) {
                 .raceGroup {
                     grid-template-columns: 50px 1fr
                 }

                 .racePlayers {
                     gap: 13px;
                     padding: 14px 10px
                 }

                 .playerCard {
                     width: 110px
                 }

                 .portrait {
                     width: 100px;
                     height: 100px
                 }

                 .raceName {
                     display: none
                 }
             }

             .liveOnlyBox {
                 margin: 5px 1px 8px;
                 padding: 7px 4px 8px;
                 border-top: 1px solid rgba(205,210,216,.8);
                 border-bottom: 1px solid rgba(205,210,216,.8);
                 display: flex;
                 flex-direction: column;
                 align-items: center;
                 gap: 5px
             }

             .liveOnlyLabel {
                 font-size: 7px;
                 line-height: 1;
                 font-weight: 1000;
                 letter-spacing: .8px;
                 color: #777e86;
                 white-space: nowrap
             }

             .liveSwitch {
                 position: relative;
                 width: 34px;
                 height: 19px;
                 display: block;
                 cursor: pointer
             }

                 .liveSwitch input {
                     position: absolute;
                     opacity: 0;
                     pointer-events: none
                 }

             .liveSwitchTrack {
                 position: absolute;
                 inset: 0;
                 border-radius: 99px;
                 background: #cfd4da;
                 box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
                 transition: .16s ease
             }

                 .liveSwitchTrack:after {
                     content: "";
                     position: absolute;
                     width: 15px;
                     height: 15px;
                     left: 2px;
                     top: 2px;
                     border-radius: 50%;
                     background: #fff;
                     box-shadow: 0 1px 4px rgba(0,0,0,.20);
                     transition: .16s ease
                 }

             .liveSwitch input:checked + .liveSwitchTrack {
                 background: #ef2947
             }

                 .liveSwitch input:checked + .liveSwitchTrack:after {
                     transform: translateX(15px)
                 }

             .livePreview {
                 position: fixed;
                 display: none;
                 width: 320px;
                 z-index: 20000;
                 pointer-events: none;
                 overflow: hidden;
                 border: 1px solid rgba(255,255,255,.12);
                 border-radius: 13px;
                 background: #15181d;
                 color: #fff;
                 box-shadow: 0 18px 46px rgba(0,0,0,.30)
             }

                 .livePreview.on {
                     display: block
                 }

             .livePreviewImg {
                 width: 100%;
                 aspect-ratio: 16/9;
                 display: block;
                 object-fit: cover;
                 background: #24282e
             }

             .livePreviewBody {
                 padding: 10px 11px 11px
             }

             .livePreviewLive {
                 display: inline-flex;
                 height: 18px;
                 padding: 0 6px;
                 align-items: center;
                 justify-content: center;
                 margin-bottom: 6px;
                 border-radius: 5px;
                 background: #ef2947;
                 font-size: 8px;
                 font-weight: 1000;
                 letter-spacing: .6px
             }

             .livePreviewTitle {
                 font-size: 12px;
                 line-height: 1.42;
                 font-weight: 900;
                 word-break: keep-all;
                 overflow: hidden;
                 display: -webkit-box;
                 -webkit-line-clamp: 2;
                 -webkit-box-orient: vertical
             }

             .liveStatusLoading {
                 padding: 24px;
                 color: #80868e;
                 font-size: 12px;
                 text-align: center
             }

             .univFilterBox {
                 margin: 0 1px 7px;
                 padding: 7px 3px 8px;
                 border-bottom: 1px solid rgba(205,210,216,.8)
             }

             .univFilterBtn {
                 width: 100%;
                 height: 28px;
                 border: 1px solid #d7dbe0;
                 border-radius: 8px;
                 background: #fff;
                 color: #3c424a;
                 font-size: 9px;
                 font-weight: 900;
                 cursor: pointer
             }

             .univPopover {
                 position: fixed;
                 z-index: 20050;
                 width: 120px;
                 max-height: 360px;
                 overflow: auto;
                 display: none;
                 padding: 8px;
                 border: 1px solid #d9dde2;
                 border-radius: 12px;
                 background: #fff;
                 box-shadow: 0 16px 40px rgba(20,25,32,.18)
             }

                 .univPopover.on {
                     display: block
                 }

             .univOption {
                 width: 100%;
                 min-height: 34px;
                 padding: 7px 10px;
                 border: 0;
                 border-radius: 8px;
                 background: transparent;
                 text-align: left;
                 color: #2b3036;
                 font-size: 11px;
                 font-weight: 800;
                 cursor: pointer
             }

                 .univOption:hover, .univOption.active {
                     background: #f0f2f5;
                     color: #111
                 }



             .livePreviewLive #livePreviewElapsed {
                 display: inline-block;
                 margin-left: 7px;
                 font-size: 11px;
                 font-weight: 900;
                 letter-spacing: .1px;
                 color: #fff;
                 opacity: .92
             }

             #universityMenu, .universityMenu, .uniMenu, .universityPopup, .uniPopup {
                 width: 120px !important;
                 right: 82px !important;
             }

    <script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];
const RACES=[['T','테란'],['Z','저그'],['P','프로토스']];
let players=[];
let universities=[];
let liveOnly=true;
let universityFilter='all';
let railObserver=null;
const FAVORITE_TIER_KEY='starcraft_favorite_tier';
let favoriteTier=localStorage.getItem(FAVORITE_TIER_KEY)||'';
let favoriteJumpDone=false;

function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flags(x){return Array.isArray(x.status_flags)?x.status_flags:[]}
function tierId(t){return 'tier-'+String(t).replace(/[^0-9A-Za-z가-힣]/g,'-')}

function fallbackOrImage(x){
  const img=(x.soop_profile_image||'').trim();
  if(!img)return '<div class="blankPortrait"></div>';
  return `<img class="profileImg" src="${e(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`;
}
function universityBadge(x){
  const img=x.university_logo||x.school_logo||'';
  if(!img)return '';
  return `<span class="univBadge" title="${e(x.university_name||x.school_name||'소속')}"><img src="${e(img)}" alt="" onerror="this.parentElement.remove()"></span>`;
}

function card(x){
  const f=flags(x);
  const isLive=!!x._live;
  const cls=['playerCard',x.race||'',f.includes('soon')?'soon':'',f.includes('idle')?'idle':'',x.soop_user_id?'':'missing',isLive?'live':'off'].filter(Boolean).join(' ');
  const liveUrl=x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#';
  const stationUrl=x.soop_user_id?'https://www.sooplive.co.kr/station/'+encodeURIComponent(x.soop_user_id):'#';
  const href=isLive?liveUrl:stationUrl;
  const name=e(x.display_name||x.soop_nickname||x.player_name);

  const up=f.includes('up')?'<span class="upBadge" title="최근 승급"></span>':'';
  const newly=f.includes('new')?'<span class="newBadge" title="신규">NEW</span>':'';
  const repair=f.includes('repair')?'<span class="repairBadge" title="수리"></span>':'';

  return `<a class="${cls}" data-player-id="${x.id}" href="${href}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>
    <div class="portrait">
      <div class="profileCore">${fallbackOrImage(x)}</div>
      ${universityBadge(x)}
      ${up}${newly}${repair}
    </div>
    <div class="namePlate">
      ${isLive?'<span class="liveBadge">LIVE</span>':''}
      <span class="playerName">${name}</span><span class="raceInline">${e(String(x.race||"").toUpperCase())}</span>
    </div>
  </a>`;
}

function comparePlayers(a,b){
  const aIdle=flags(a).includes('idle')?1:0;
  const bIdle=flags(b).includes('idle')?1:0;
  if(aIdle!==bIdle)return aIdle-bIdle;

  const aSoon=flags(a).includes('soon')?0:1;
  const bSoon=flags(b).includes('soon')?0:1;
  if(aSoon!==bSoon)return aSoon-bSoon;

  return Number(a.sort_order||0)-Number(b.sort_order||0);
}

function universityMatch(x){
  if(universityFilter==='all')return true;
  if(universityFilter==='none')return x.university_id==null;
  return String(x.university_id||'')===String(universityFilter);
}

function raceRow(all,race,label){
  const p=all
    .filter(x=>String(x.race||'').toUpperCase()===race)
    .filter(universityMatch)
    .filter(x=>!liveOnly || x._live || !x._liveKnown)
    .sort(comparePlayers);

  return `<div class="raceGroup ${race} ${p.length?'':'empty'}">
    <div class="racePlayers">${p.map(card).join('')}</div>
  </div>`;
}

function passesUniversity(x){
  if(universityFilter==='all')return true;
  if(universityFilter==='none')return !x.university_id;
  return String(x.university_id||'')===String(universityFilter);
}

function visibleInTier(all){
  return all.some(x=>universityMatch(x) && (!liveOnly || x._live || !x._liveKnown));
}

function render(){
  board.innerHTML=TIERS.map(t=>{
    const all=players.filter(x=>x.tier===t);
    const scoped=all.filter(x=>passesUniversity(x));
    return `<div class="tier" id="${tierId(t)}">
      <div class="tierLabel"><strong class="tierName">${t}</strong><span class="tierCounts">총 ${scoped.length}명 · 방송중 ${scoped.filter(x=>x._live).length}명</span></div>
      <div class="members">${RACES.map(([r,l])=>raceRow(all,r,l)).join('')}</div>
    </div>`;
  }).join('');
  wirePreview();
  setupRailObserver();
  setupVisibleMetaPrefetch();
}

function buildRail(){
  const currentUniv=
    universityFilter==='all'?'전체':
    universityFilter==='none'?'무소속':
    (universities.find(u=>String(u.id)===String(universityFilter))?.name||'전체');

  tierRail.innerHTML=
    '<div class="tierRailTitle">TIER</div>'+
    `<div class="liveOnlyBox">
      <div class="liveOnlyLabel">방송중</div>
      <label class="liveSwitch" title="라이브만 보기">
        <input id="liveOnlyToggle" type="checkbox" ${liveOnly?'checked':''}>
        <span class="liveSwitchTrack"></span>
      </label>
    </div>`+
    `<div class="univFilterBox">
      <button id="univFilterBtn" class="univFilterBtn" title="${e(currentUniv)}">대학 ▾</button>
    </div>`+
    TIERS.map(t=>`<div class="tierJumpRow"><a class="tierJump" href="#${tierId(t)}">${t}</a><button class="tierFavorite ${favoriteTier===t?'on':''}" type="button" data-favorite-tier="${e(t)}">${favoriteTier===t?'★':'☆'}</button></div>`).join('');

  liveOnlyToggle.addEventListener('change',ev=>{
    liveOnly=!!ev.target.checked;
    render();
    buildRail();
  });

  univFilterBtn.addEventListener('click',ev=>{
    ev.stopPropagation();
    openUniversityPopover(univFilterBtn);
  });

  tierRail.querySelectorAll('[data-favorite-tier]').forEach(button=>{
    button.addEventListener('click',ev=>{
      ev.preventDefault();ev.stopPropagation();
      const tier=button.dataset.favoriteTier||'';
      favoriteTier=favoriteTier===tier?'':tier;
      if(favoriteTier)localStorage.setItem(FAVORITE_TIER_KEY,favoriteTier);
      else localStorage.removeItem(FAVORITE_TIER_KEY);
      buildRail();
    });
  });

}

function openUniversityPopover(btn){
  const options=[
    {id:'all',name:'전체 대학'},
    {id:'none',name:'무소속'},
    ...universities.map(u=>({id:String(u.id),name:u.name}))
  ];
  univPopover.innerHTML=options.map(o=>`<button class="univOption ${String(o.id)===String(universityFilter)?'active':''}" data-univ="${e(o.id)}">${e(o.name)}</button>`).join('');
  const r=btn.getBoundingClientRect(),w=96;
  univPopover.style.width=w+'px';
  univPopover.style.left=Math.max(10,r.left-w-6)+'px';
  univPopover.classList.add('on');
  const menuH=univPopover.scrollHeight;
  univPopover.style.top=Math.max(10,Math.min(r.top-30,innerHeight-menuH-10))+'px';

  univPopover.querySelectorAll('.univOption').forEach(b=>{
    b.onclick=()=>{
      universityFilter=b.dataset.univ;
      univPopover.classList.remove('on');
      render();
      buildRail();
    };
  });
}
document.addEventListener('click',ev=>{
  if(!ev.target.closest?.('#univPopover') && !ev.target.closest?.('#univFilterBtn'))univPopover.classList.remove('on');
});

function updateActiveTierByScroll(){
  const links=[...document.querySelectorAll('.tierJump')];
  const sections=[...document.querySelectorAll('.tier')];
  if(!links.length||!sections.length)return;

  const anchor=Math.max(110,innerHeight*.28);
  let current=sections[0];

  for(const s of sections){
    const r=s.getBoundingClientRect();
    if(r.top<=anchor)current=s;
    else break;
  }

  links.forEach(a=>a.classList.toggle(
    'active',
    a.getAttribute('href')==='#'+current.id
  ));
}

function setupRailObserver(){
  updateActiveTierByScroll();
}

function wirePreview(){
  document.querySelectorAll('.playerCard.live .portrait').forEach(p=>{
    p.addEventListener('mouseenter',showPreview);
    p.addEventListener('mousemove',movePreview);
    p.addEventListener('mouseleave',hidePreview);
  });
}

function freshThumbnailUrl(url){
  if(!url)return '';
  const sep=url.includes('?')?'&':'?';
  return url+sep+'t='+Math.floor(Date.now()/10000);
}

function formatViewerCount(v){
  const n=Number(v||0);
  return Number.isFinite(n) ? n.toLocaleString('ko-KR') : '0';
}

function formatLiveElapsed(startAt){
  if(!startAt)return '';
  const ms=Date.now()-new Date(startAt).getTime();
  if(!Number.isFinite(ms)||ms<0)return '';
  const totalMinutes=Math.floor(ms/60000);
  if(totalMinutes<60)return `${totalMinutes}분 전`;
  return `${Math.floor(totalMinutes/60)}시간 전`;
}

let currentPreviewPlayerId=0;
let previewRequestSeq=0;

async function hydrateLiveMeta(x){
  if(!x?.soop_user_id)return;

  const targetPlayerId=Number(x.id||0);
  const seq=++previewRequestSeq;
  const j=await fetchLiveMetaCached(x);
  if(!j)return;

  // A response from a previous hover must never overwrite the new hover.
  if(
    !livePreview.classList.contains('on') ||
    currentPreviewPlayerId!==targetPlayerId ||
    seq!==previewRequestSeq
  ) return;

  livePreviewElapsed.textContent=formatLiveElapsed(x._liveStartedAt);
  livePreviewViewers.textContent=formatViewerCount(x._viewerCount);
  if(x._liveTitle)livePreviewTitle.textContent=x._liveTitle;
}




let metaPrefetchObserver=null;
const metaFetches=new Map();

async function fetchLiveMetaCached(x){
  if(!x?.soop_user_id)return null;

  const now=Date.now();
  if(x._metaFetchedAt && now-x._metaFetchedAt<10000){
    return {
      started_at:x._liveStartedAt||'',
      title:x._liveTitle||'',
      viewer_count:Number(x._viewerCount||0)
    };
  }

  const key=String(x.soop_user_id);
  if(metaFetches.has(key))return metaFetches.get(key);

  const job=(async()=>{
    try{
      const r=await fetch('/api/soop-live-meta?id='+encodeURIComponent(x.soop_user_id),{cache:'no-store'});
      if(!r.ok)return null;
      const j=await r.json();

      if(j.started_at)x._liveStartedAt=j.started_at;
      if(j.title)x._liveTitle=j.title;
      if(Number.isFinite(Number(j.viewer_count)))x._viewerCount=Number(j.viewer_count);
      x._metaFetchedAt=Date.now();
      return j;
    }catch(_){
      return null;
    }finally{
      metaFetches.delete(key);
    }
  })();

  metaFetches.set(key,job);
  return job;
}

function setupVisibleMetaPrefetch(){
  metaPrefetchObserver?.disconnect();

  const cards=[...document.querySelectorAll('.playerCard.live')];
  if(!cards.length)return;

  metaPrefetchObserver=new IntersectionObserver(entries=>{
    for(const entry of entries){
      if(!entry.isIntersecting)continue;

      const card=entry.target;
      metaPrefetchObserver.unobserve(card);

      const id=Number(card.dataset.playerId||0);
      const x=players.find(v=>Number(v.id)===id);
      if(!x)return;

      // Delay very slightly so profile images / initial paint get priority.
      setTimeout(()=>fetchLiveMetaCached(x),120);
    }
  },{root:null,rootMargin:'220px 0px',threshold:0.01});

  cards.forEach(card=>metaPrefetchObserver.observe(card));
}

let previewElapsedTimer=null;
let previewThumbTimer=null;
function showPreview(ev){
  const card=ev.currentTarget.closest('.playerCard');
  const id=Number(card?.dataset?.playerId||0);
  const x=players.find(v=>Number(v.id)===id);
  if(!x?._live)return;

  currentPreviewPlayerId=id;
  previewRequestSeq++;

  // Paint this player's cached values immediately.
  livePreviewTitle.textContent=x._liveTitle||x.display_name||x.soop_nickname||x.player_name||'LIVE';
  livePreviewElapsed.textContent=formatLiveElapsed(x._liveStartedAt);
  livePreviewViewers.textContent=formatViewerCount(x._viewerCount);

  if(x._thumbnail){
    livePreviewImg.src=freshThumbnailUrl(x._thumbnail);
    livePreviewImg.style.display='block';
  }else{
    livePreviewImg.removeAttribute('src');
    livePreviewImg.style.display='none';
  }

  livePreview.classList.add('on');
  movePreview(ev);

  // Refresh only this player in the background.
  hydrateLiveMeta(x);

  clearInterval(previewElapsedTimer);
  clearInterval(previewThumbTimer);

  previewElapsedTimer=setInterval(()=>{
    if(
      livePreview.classList.contains('on') &&
      currentPreviewPlayerId===id
    ){
      livePreviewElapsed.textContent=formatLiveElapsed(x._liveStartedAt);
    }
  },10000);

  previewThumbTimer=setInterval(()=>{
    if(
      livePreview.classList.contains('on') &&
      currentPreviewPlayerId===id
    ){
      if(x._thumbnail)livePreviewImg.src=freshThumbnailUrl(x._thumbnail);
      hydrateLiveMeta(x);
    }
  },10000);
}
function movePreview(ev){
  const w=320,g=14;
  let x=ev.clientX+g,y=ev.clientY+g;
  if(x+w>innerWidth-10)x=ev.clientX-w-g;
  if(y+230>innerHeight-10)y=Math.max(10,ev.clientY-230);
  livePreview.style.left=x+'px';
  livePreview.style.top=y+'px';
}
function hidePreview(){
  currentPreviewPlayerId=0;
  previewRequestSeq++;
  livePreview.classList.remove('on');
  clearInterval(previewElapsedTimer);
  clearInterval(previewThumbTimer);
  previewElapsedTimer=null;
  previewThumbTimer=null;
}



async function load(){
  liveOnly=true;
  universityFilter='all';

  const r=await fetch('/api/star-public',{cache:'no-store'});
  if(!r.ok){board.innerHTML='<div class="loading">티어표 불러오기 실패</div>';return}

  const j=await r.json();
  universities=j.universities||[];
  if(universityFilter!=='all' && universityFilter!=='none' && !universities.some(u=>String(u.id)===String(universityFilter)))universityFilter='all';

  players=(j.players||[]).map(x=>({
    ...x,
    _liveKnown:true,
    _live:!!x.live_cache_live,
    _liveTitle:x.live_cache_title||'',
    _thumbnail:x.live_cache_thumbnail||'',
    _bno:x.live_cache_bno||'',
    _liveStartedAt:x.live_cache_started_at||'',
    _viewerCount:Number(x.live_cache_viewer_count||0)
  }));

  render();
  buildRail();
  if(!favoriteJumpDone&&favoriteTier){
    favoriteJumpDone=true;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      document.getElementById(tierId(favoriteTier))?.scrollIntoView({behavior:'smooth',block:'start'});
    }));
  }
}


document.addEventListener('click',ev=>{
  const a=ev.target.closest?.('.tierJump');
  if(!a)return;
  const id=(a.getAttribute('href')||'').slice(1);
  const target=document.getElementById(id);
  if(!target){
    ev.preventDefault();
  }
});

addEventListener('scroll',updateActiveTierByScroll,{passive:true});
addEventListener('resize',updateActiveTierByScroll,{passive:true});

load();

// 5-minute automatic refresh.
setInterval(async()=>{
  if(!players.length)return;
  await refreshAllLiveStatuses();
},300000);
    </script>
