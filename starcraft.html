<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타크래프트 티어표</title><link rel="stylesheet" href="navbar.css">




<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
  margin:0;
  color:#17191d;
  font-family:Inter,Arial,"Noto Sans KR",sans-serif;
  background:#eef1f4;
}
main{
  width:min(1460px,calc(100% - 160px));
  margin:34px auto 100px;
}

/* page header */
.pageTitleWrap{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  margin:0 2px 20px;
  padding:0 2px;
}
.pageTitleWrap h1{
  margin:0;
  font-size:31px;
  font-weight:1000;
  letter-spacing:-1.7px;
  color:#111318;
}
.pageSub{
  margin-top:6px;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.7px;
  color:#8d949c;
}

/* completely new board language */
.board{
  display:flex;
  flex-direction:column;
  gap:14px;
  border:0;
  background:transparent;
  box-shadow:none;
  overflow:visible;
}

/* each tier becomes an independent floating section */
.tier{
  position:relative;
  display:block;
  min-height:0;
  border:1px solid #dfe4ea;
  border-radius:20px;
  background:#fff;
  overflow:hidden;
  box-shadow:
    0 10px 30px rgba(31,38,48,.055),
    0 1px 3px rgba(31,38,48,.035);
  scroll-margin-top:28px;
}

/* horizontal tier header, no vertical black slab */
.tierLabel{
  position:relative;
  height:54px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding:0 22px;
  background:
    linear-gradient(180deg,#fbfcfd 0%,#f6f8fa 100%);
  border-bottom:1px solid #e8ebef;
  color:#191c21;
  font-size:17px;
  font-weight:1000;
  writing-mode:initial;
  transform:none;
  letter-spacing:-.3px;
}
.tierLabel::before{
  content:"";
  width:8px;
  height:8px;
  border-radius:50%;
  background:#111318;
  margin-right:10px;
}
.tierLabel::after{
  content:"PLAYERS";
  margin-left:auto;
  font-size:8px;
  font-weight:900;
  letter-spacing:1.7px;
  color:#a3a9b0;
}

/* roster layout */
.members{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
  gap:18px 14px;
  padding:18px 20px 22px;
  align-items:start;
}

/* ===== totally different card: "profile tile + footer strip" ===== */
.playerCard{
  --race:#7c858e;
  position:relative;
  display:block;
  min-width:0;
  text-decoration:none;
  color:#181b20;
  border-radius:16px;
  background:#f8f9fb;
  border:1px solid #e4e8ed;
  overflow:hidden;
  transition:
    transform .16s ease,
    box-shadow .16s ease,
    border-color .16s ease;
}
.playerCard:hover{
  transform:translateY(-4px);
  border-color:#cfd5dc;
  box-shadow:0 14px 32px rgba(27,33,42,.10);
}
.playerCard.T{--race:#2f79d1}
.playerCard.Z{--race:#7b4db9}
.playerCard.P{--race:#c99500}

/* portrait is square-ish and inset, not poster framed */
.portrait{
  position:relative;
  width:auto;
  aspect-ratio:1/1;
  margin:10px 10px 0;
  overflow:hidden;
  border:0;
  border-radius:12px;
  background:#fff;
  box-shadow:none;
}
.portrait:after{
  display:none;
}
.profileImg{
  position:relative;
  z-index:1;
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#fff;
}
.blankPortrait{
  position:absolute;
  inset:0;
  z-index:0;
  background:#fff;
}

/* race mark is now a slim vertical signal bar */
.playerCard::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:4px;
  background:var(--race);
  z-index:5;
}

/* university badge */
.univBadge{
  position:absolute;
  left:9px;
  top:9px;
  z-index:8;
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:rgba(255,255,255,.94);
  border:1px solid rgba(219,224,230,.95);
  box-shadow:0 4px 12px rgba(22,27,34,.12);
  overflow:hidden;
}
.univBadge img{
  width:29px;
  height:29px;
  object-fit:contain;
}

/* state badges */
.cornerBadges{
  position:absolute;
  right:8px;
  top:8px;
  bottom:auto;
  z-index:7;
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:5px;
}
.stateBadge{
  min-width:34px;
  height:20px;
  padding:0 7px;
  border:0;
  border-radius:10px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  font-weight:1000;
  letter-spacing:.55px;
  color:#fff;
  box-shadow:0 3px 9px rgba(0,0,0,.14);
}
.stateBadge.up{background:#e13f47}
.stateBadge.new{background:#16191e}
.stateBadge.repair{background:#e9911c}

/* bottom info strip is the identity area */
.namePlate{
  margin:0;
  min-height:48px;
  padding:10px 12px 11px 14px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:6px;
  border:0;
  background:#fff;
  box-shadow:none;
  color:#1f2328;
  font-size:13px;
  font-weight:950;
}
.playerName{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.raceText{
  flex:0 0 auto;
  width:auto;
  height:auto;
  border-radius:0;
  background:transparent;
  color:var(--race);
  font-size:11px;
  font-weight:1000;
}
.liveBadge{
  flex:0 0 auto;
  height:17px;
  padding:0 6px;
  border-radius:9px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:#ef2947;
  color:#fff;
  font-size:8px;
  font-weight:1000;
  letter-spacing:.5px;
}

/* soon = outer aura + race signal bar */
.playerCard.soon{
  animation:cardGlow 1.05s ease-in-out infinite alternate;
}
@keyframes cardGlow{
  from{
    box-shadow:
      0 0 0 1px color-mix(in srgb,var(--race) 22%,transparent),
      0 8px 20px rgba(26,31,40,.06);
  }
  to{
    box-shadow:
      0 0 0 2px color-mix(in srgb,var(--race) 76%,transparent),
      0 0 19px color-mix(in srgb,var(--race) 34%,transparent),
      0 10px 26px rgba(26,31,40,.08);
  }
}

/* idle */
.playerCard.idle{
  opacity:.46;
  filter:grayscale(.85) saturate(.28);
}
.playerCard.idle::before{
  background:#8f949a;
}
.playerCard.idle .raceText{
  color:#8f949a;
}
.playerCard.missing{
  opacity:.84;
}

/* keep current tier rail — user likes it */
.tierRail{
  position:fixed;
  right:22px;
  top:50%;
  transform:translateY(-50%);
  z-index:9000;
  width:82px;
  padding:9px 7px 10px;
  border:1px solid rgba(218,221,226,.9);
  border-radius:22px;
  background:rgba(250,250,251,.86);
  backdrop-filter:blur(18px);
  box-shadow:0 18px 55px rgba(21,24,30,.13);
}
.tierRailTitle{
  height:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  font-weight:1000;
  letter-spacing:1.8px;
  color:#a1a6ad;
}
.tierJump{
  position:relative;
  height:30px;
  margin:2px 0;
  padding:0 5px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  text-decoration:none;
  background:transparent;
  color:#666c74;
  font-size:10px;
  font-weight:900;
  transition:.15s;
}
.tierJump:before{
  content:"";
  position:absolute;
  left:4px;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#c8ccd2;
  transition:.15s;
}
.tierJump:hover{
  background:#eceef1;
  color:#16181c;
}
.tierJump.active{
  background:#17191d;
  color:#fff;
  box-shadow:0 5px 14px rgba(23,25,29,.18);
}
.tierJump.active:before{
  background:#fff;
  height:12px;
  border-radius:3px;
}

.loading{padding:30px;color:#8c929a}

@media(max-width:950px){
  main{width:calc(100% - 24px)}
  .tierRail{display:none}
}
@media(max-width:700px){
  .tier{border-radius:16px}
  .tierLabel{height:46px;padding:0 16px;font-size:14px}
  .members{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px}
}
</style>



</head>
<body>
<nav id="global-navbar" class="globalNav"><div class="globalNavInner"><a class="globalNavBrand" href="index.html">MUJE</a><div class="globalNavLinks"><a class="globalNavLink" href="pubg.html">배틀그라운드</a><a class="globalNavLink active" href="starcraft.html">스타크래프트</a></div></div></nav>
<main>
      <div class="pageTitleWrap">
        <div>
          <h1>스타크래프트 티어표</h1>
          <div class="pageSub">SOOP STARCRAFT TIER BOARD</div>
        </div>
      </div>
      <div id="board" class="board"><div class="loading">티어표 불러오는 중...</div></div>
    </main>
    <aside id="tierRail" class="tierRail">
      <div class="tierRailTitle">TIER</div>
    </aside>

<script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];
const RACE_ORDER={T:0,Z:1,P:2};
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flags(x){return Array.isArray(x.status_flags)?x.status_flags:[]}

function fallbackOrImage(x){
  const img=(x.soop_profile_image||'').trim();
  if(!img) return '<div class="blankPortrait" aria-label="프로필 이미지 없음"></div>';
  return `<img class="profileImg" src="${e(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=&quot;blankPortrait&quot;></div>')">`;
}

function universityBadge(x){
  const img=x.university_logo||x.school_logo||'';
  if(!img)return '';
  return `<span class="univBadge" title="${e(x.university_name||x.school_name||'소속')}"><img src="${e(img)}" alt="" onerror="this.parentElement.remove()"></span>`;
}

function cornerBadges(x){
  const f=flags(x),arr=[];
  if(f.includes('up'))arr.push('<span class="stateBadge up">UP</span>');
  if(f.includes('new'))arr.push('<span class="stateBadge new">NEW</span>');
  if(f.includes('repair'))arr.push('<span class="stateBadge repair">REPAIR</span>');
  return arr.length?'<span class="cornerBadges">'+arr.join('')+'</span>':'';
}

function card(x){
  const f=flags(x);
  const cls=['playerCard',x.race||'',f.includes('soon')?'soon':'',f.includes('idle')?'idle':'',x.soop_user_id?'':'missing'].filter(Boolean).join(' ');
  const live=!!(x.live||x.is_live||x.broadcast_live);
  const href=x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#';
  const name=e(x.display_name||x.soop_nickname||x.player_name);
  return `<a class="${cls}" href="${href}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>
    <div class="portrait">
      ${fallbackOrImage(x)}
      ${universityBadge(x)}
      ${cornerBadges(x)}
    </div>
    <div class="namePlate">
      ${live?'<span class="liveBadge">LIVE</span>':''}
      <span class="playerName">${name}</span>
      <span class="raceText">${e(String(x.race||'').toUpperCase())}</span>
    </div>
  </a>`;
}

function tierId(t){return 'tier-'+String(t).replace(/[^0-9A-Za-z가-힣]/g,'-')}
function buildRail(){
  tierRail.innerHTML='<div class="tierRailTitle">TIER</div>'+TIERS.map(t=>`<a class="tierJump" href="#${tierId(t)}">${t}</a>`).join('');
}
function setupRailObserver(){
  const links=[...document.querySelectorAll('.tierJump')];
  const sections=[...document.querySelectorAll('.tier')];
  if(!sections.length)return;
  const io=new IntersectionObserver(entries=>{
    const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(!visible)return;
    links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+visible.target.id));
  },{rootMargin:'-35% 0px -50% 0px',threshold:[0,.2,.5,.8]});
  sections.forEach(s=>io.observe(s));
}
async function load(){
  const r=await fetch('/api/star-public',{cache:'no-store'});
  if(!r.ok){board.innerHTML='<div class="loading">티어표 불러오기 실패</div>';return}
  const j=await r.json(),a=j.players||[];
  board.innerHTML=TIERS.map(t=>{
    const p=a.filter(x=>x.tier===t).sort((a,b)=>{
      const ai=flags(a).includes('idle')?1:0;
      const bi=flags(b).includes('idle')?1:0;
      return ai-bi ||
        (RACE_ORDER[a.race]??9)-(RACE_ORDER[b.race]??9) ||
        (Number(a.sort_order||0)-Number(b.sort_order||0));
    });
    return `<div class="tier" id="${tierId(t)}"><div class="tierLabel">${t}</div><div class="members">${p.map(card).join('')}</div></div>`;
  }).join('');
  buildRail();
  setupRailObserver();
}
load();
</script>
<script src="navbar.js"></script>
</body></html>
