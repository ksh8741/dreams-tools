<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타크래프트 티어표</title><link rel="stylesheet" href="navbar.css">



<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
 margin:0;color:#17191d;
 font-family:Inter,Arial,"Noto Sans KR",sans-serif;
 background:#f3f4f6;
}
body:before{
 content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
 background:
 linear-gradient(rgba(17,24,39,.022) 1px,transparent 1px),
 linear-gradient(90deg,rgba(17,24,39,.022) 1px,transparent 1px);
 background-size:32px 32px;
}
main{width:min(1420px,calc(100% - 150px));margin:34px auto 100px}
.pageTitleWrap{display:flex;align-items:end;justify-content:space-between;margin:0 2px 18px}
.pageTitleWrap h1{margin:0;font-size:30px;font-weight:950;letter-spacing:-1.7px}
.pageSub{margin-top:5px;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#9aa0a8}

.board{
 overflow:hidden;border:1px solid #dfe2e7;border-radius:24px;
 background:#fff;box-shadow:0 22px 60px rgba(26,32,44,.08);
}
.tier{
 display:grid;grid-template-columns:88px 1fr;min-height:190px;
 border-bottom:1px solid #eceef1;scroll-margin-top:24px;
}
.tier:last-child{border-bottom:0}
.tierLabel{
 position:relative;display:flex;align-items:center;justify-content:center;
 background:#17191d;color:#fff;font-size:16px;font-weight:950;
 writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:2px
}
.tierLabel:before{
 content:"";position:absolute;left:50%;top:18px;width:1px;height:22px;
 background:rgba(255,255,255,.25)
}
.members{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
 gap:22px 16px;padding:22px 24px 26px;align-items:start;
}

/* completely new roster card */
.playerCard{
 --race:#858b93;position:relative;display:block;min-width:0;
 text-decoration:none;color:#16181c;transition:transform .16s ease;
}
.playerCard:hover{transform:translateY(-4px)}
.playerCard.T{--race:#2478d7}
.playerCard.Z{--race:#7542bb}
.playerCard.P{--race:#c99500}

.portrait{
 position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;
 border:0;border-radius:18px 18px 6px 6px;background:#fff;
 box-shadow:0 8px 20px rgba(23,25,29,.10);
}
.portrait:after{
 content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
 background:var(--race);z-index:3
}
.profileImg{
 position:relative;z-index:1;display:block;width:100%;height:100%;
 object-fit:cover;background:#fff
}
.blankPortrait{position:absolute;inset:0;z-index:0;background:#fff}

/* status becomes small hardware labels, not copied corner pills */
.cornerBadges{
 position:absolute;right:8px;top:8px;bottom:auto;z-index:7;
 display:flex;flex-direction:column;align-items:flex-end;gap:5px
}
.stateBadge{
 height:21px;padding:0 7px;border:0;border-radius:5px;
 display:inline-flex;align-items:center;justify-content:center;
 font-size:9px;font-weight:1000;letter-spacing:.65px;color:#fff;
 box-shadow:0 3px 9px rgba(0,0,0,.18)
}
.stateBadge.up{background:#e33b45}
.stateBadge.new{background:#181b20}
.stateBadge.repair{background:#e88b16}

/* university is a floating seal */
.univBadge{
 position:absolute;left:9px;top:9px;z-index:8;width:34px;height:34px;
 display:flex;align-items:center;justify-content:center;border-radius:50%;
 background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);
 box-shadow:0 3px 12px rgba(0,0,0,.18);overflow:hidden
}
.univBadge img{width:29px;height:29px;object-fit:contain}

/* name is no longer another bordered card */
.namePlate{
 margin:0;padding:11px 4px 0;min-height:34px;
 display:flex;align-items:center;justify-content:flex-start;gap:6px;
 border:0;background:transparent;box-shadow:none;color:#202328;
 font-size:13px;font-weight:950
}
.playerName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.raceText{
 flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
 width:20px;height:20px;border-radius:50%;background:var(--race);
 color:#fff;font-size:10px;font-weight:1000
}
.liveBadge{
 flex:0 0 auto;height:18px;padding:0 6px;border-radius:9px;
 display:inline-flex;align-items:center;justify-content:center;
 background:#ef2947;color:#fff;font-size:8px;font-weight:1000;letter-spacing:.5px
}

/* promotion: glow only the race accent, not a copied full colored frame */
.playerCard.soon .portrait:after{
 height:6px;animation:accentGlow .9s ease-in-out infinite alternate
}
@keyframes accentGlow{
 from{box-shadow:0 0 5px var(--race)}
 to{box-shadow:0 0 18px var(--race),0 0 28px color-mix(in srgb,var(--race) 55%,transparent)}
}
.playerCard.idle{opacity:.48;filter:grayscale(.82) saturate(.35)}
.playerCard.idle .portrait:after{background:#85898f}
.playerCard.idle .raceText{background:#85898f}
.playerCard.missing{opacity:.86}

/* premium compact navigator */
.tierRail{
 position:fixed;right:22px;top:50%;transform:translateY(-50%);
 z-index:9000;width:82px;padding:9px 7px 10px;
 border:1px solid rgba(218,221,226,.9);border-radius:22px;
 background:rgba(250,250,251,.86);backdrop-filter:blur(18px);
 box-shadow:0 18px 55px rgba(21,24,30,.13)
}
.tierRailTitle{
 height:25px;display:flex;align-items:center;justify-content:center;
 font-size:8px;font-weight:1000;letter-spacing:1.8px;color:#a1a6ad
}
.tierJump{
 position:relative;height:30px;margin:2px 0;padding:0 5px;
 display:flex;align-items:center;justify-content:center;
 border-radius:10px;text-decoration:none;background:transparent;
 color:#666c74;font-size:10px;font-weight:900;transition:.15s
}
.tierJump:before{
 content:"";position:absolute;left:4px;width:3px;height:3px;border-radius:50%;
 background:#c8ccd2;transition:.15s
}
.tierJump:hover{background:#eceef1;color:#16181c}
.tierJump.active{
 background:#17191d;color:#fff;box-shadow:0 5px 14px rgba(23,25,29,.18)
}
.tierJump.active:before{background:#fff;height:12px;border-radius:3px}

.loading{padding:30px;color:#8c929a}
@media(max-width:950px){
 main{width:calc(100% - 24px)}
 .tierRail{display:none}
}
@media(max-width:700px){
 .tier{grid-template-columns:54px 1fr}
 .members{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px;padding:14px}
 .tierLabel{font-size:13px}
}
</style>


</head>
<body>
<nav id="global-navbar" class="globalNav"><div class="globalNavInner"><a class="globalNavBrand" href="index.html">MUJE</a><div class="globalNavLinks"><a class="globalNavLink" href="pubg.html">배틀그라운드</a><a class="globalNavLink active" href="starcraft.html">스타크래프트</a></div></div></nav>
<main>
      <div class="pageTitleWrap">
        <div>
          <h1>스타크래프트 티어표</h1>
          <div class="pageSub">SOOP STARCRAFT TIER BOARD</div>
        </div>
      </div>
      <div id="board" class="board"><div class="loading">티어표 불러오는 중...</div></div>
    </main>
    <aside id="tierRail" class="tierRail">
      <div class="tierRailTitle">TIER</div>
    </aside>

<script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];
const RACE_ORDER={T:0,Z:1,P:2};
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flags(x){return Array.isArray(x.status_flags)?x.status_flags:[]}

function fallbackOrImage(x){
  const img=(x.soop_profile_image||'').trim();
  if(!img) return '<div class="blankPortrait" aria-label="프로필 이미지 없음"></div>';
  return `<img class="profileImg" src="${e(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=&quot;blankPortrait&quot;></div>')">`;
}

function universityBadge(x){
  const img=x.university_logo||x.school_logo||'';
  if(!img)return '';
  return `<span class="univBadge" title="${e(x.university_name||x.school_name||'소속')}"><img src="${e(img)}" alt="" onerror="this.parentElement.remove()"></span>`;
}

function cornerBadges(x){
  const f=flags(x),arr=[];
  if(f.includes('up'))arr.push('<span class="stateBadge up">UP</span>');
  if(f.includes('new'))arr.push('<span class="stateBadge new">NEW</span>');
  if(f.includes('repair'))arr.push('<span class="stateBadge repair">REPAIR</span>');
  return arr.length?'<span class="cornerBadges">'+arr.join('')+'</span>':'';
}

function card(x){
  const f=flags(x);
  const cls=['playerCard',x.race||'',f.includes('soon')?'soon':'',f.includes('idle')?'idle':'',x.soop_user_id?'':'missing'].filter(Boolean).join(' ');
  const live=!!(x.live||x.is_live||x.broadcast_live);
  const href=x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#';
  const name=e(x.display_name||x.soop_nickname||x.player_name);
  return `<a class="${cls}" href="${href}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>
    <div class="portrait">
      ${fallbackOrImage(x)}
      ${universityBadge(x)}
      ${cornerBadges(x)}
    </div>
    <div class="namePlate">
      ${live?'<span class="liveBadge">LIVE</span>':''}
      <span class="playerName">${name}</span>
      <span class="raceText">${e(String(x.race||'').toUpperCase())}</span>
    </div>
  </a>`;
}

function tierId(t){return 'tier-'+String(t).replace(/[^0-9A-Za-z가-힣]/g,'-')}
function buildRail(){
  tierRail.innerHTML='<div class="tierRailTitle">TIER</div>'+TIERS.map(t=>`<a class="tierJump" href="#${tierId(t)}">${t}</a>`).join('');
}
function setupRailObserver(){
  const links=[...document.querySelectorAll('.tierJump')];
  const sections=[...document.querySelectorAll('.tier')];
  if(!sections.length)return;
  const io=new IntersectionObserver(entries=>{
    const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(!visible)return;
    links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+visible.target.id));
  },{rootMargin:'-35% 0px -50% 0px',threshold:[0,.2,.5,.8]});
  sections.forEach(s=>io.observe(s));
}
async function load(){
  const r=await fetch('/api/star-public',{cache:'no-store'});
  if(!r.ok){board.innerHTML='<div class="loading">티어표 불러오기 실패</div>';return}
  const j=await r.json(),a=j.players||[];
  board.innerHTML=TIERS.map(t=>{
    const p=a.filter(x=>x.tier===t).sort((a,b)=>{
      const ai=flags(a).includes('idle')?1:0;
      const bi=flags(b).includes('idle')?1:0;
      return ai-bi ||
        (RACE_ORDER[a.race]??9)-(RACE_ORDER[b.race]??9) ||
        (Number(a.sort_order||0)-Number(b.sort_order||0));
    });
    return `<div class="tier" id="${tierId(t)}"><div class="tierLabel">${t}</div><div class="members">${p.map(card).join('')}</div></div>`;
  }).join('');
  buildRail();
  setupRailObserver();
}
load();
</script>
<script src="navbar.js"></script>
</body></html>
