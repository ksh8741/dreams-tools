<style>
*{box-sizing:border-box}
html{overflow-y:scroll;scrollbar-gutter:stable}
body{margin:0;background:#f4f5f7;color:#15171a;font-family:Arial,"Noto Sans KR",sans-serif}
main{width:min(1180px,calc(100% - 32px));margin:34px auto 70px}
.pageHead{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}
.pageHead h1{margin:0;font-size:24px;letter-spacing:-1px}
.pageHead p{margin:0;color:#7a8088;font-size:12px}
.board{border:1px solid #d8dce1;background:#fff}
.tier{display:grid;grid-template-columns:86px 1fr;min-height:94px;border-bottom:1px solid #e2e5e9}
.tier:last-child{border-bottom:0}
.tierLabel{display:flex;align-items:center;justify-content:center;border-right:1px solid #d8dce1;font-size:28px;font-weight:1000;background:#f8f9fa}
.tier[data-tier="S"] .tierLabel{background:#111;color:#fff}
.members{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px}
.streamer{position:relative;width:132px;height:66px;border:1px solid #d9dde2;background:#fff;display:flex;align-items:center;padding:8px;gap:8px;cursor:pointer;text-decoration:none;color:inherit;transition:.12s}
.streamer:hover{border-color:#9299a2;transform:translateY(-1px);z-index:20}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#eceff2;flex:0 0 auto}
.info{min-width:0}
.name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{margin-top:5px;font-size:10px;font-weight:900;display:flex;align-items:center;gap:5px}
.dot{width:6px;height:6px;border-radius:50%;background:#adb3ba}
.streamer.live .dot{background:#ff2449;box-shadow:0 0 0 3px rgba(255,36,73,.10)}
.streamer.live .state{color:#e6163b}
.streamer.off .state{color:#a1a6ad}
.streamer.off{opacity:.72}
.empty{padding:22px;color:#9aa0a7;font-size:12px}
.preview{position:fixed;display:none;width:300px;background:#111;color:#fff;border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 45px rgba(0,0,0,.28);z-index:99999;pointer-events:none}
.preview.show{display:block}
.preview img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#222}
.previewBody{padding:10px 11px}
.previewTitle{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.previewMeta{margin-top:5px;font-size:10px;color:#aeb4bb}
.notice{margin-top:12px;font-size:11px;color:#8a9098}
@media(max-width:650px){
  main{width:calc(100% - 18px);margin-top:20px}
  .tier{grid-template-columns:58px 1fr}
  .tierLabel{font-size:22px}
  .streamer{width:120px}
}

.tierLabel{font-size:17px!important;letter-spacing:-.5px}
.raceBadge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:5px;border:1px solid #d4d8dd;background:#f5f6f7;font-size:10px;font-weight:1000;color:#555}
.newBadge{margin-left:4px;padding:2px 4px;border:1px solid #d9dde2;font-size:8px;font-weight:900;color:#777;background:#fafafa}

</style>

const state=new Map();

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function profile(id){return 'https://profile.img.sooplive.co.kr/LOGO/'+String(id).slice(0,2)+'/'+id+'/'+id+'.jpg'}
function broadcastUrl(id){return id?'https://play.sooplive.co.kr/'+encodeURIComponent(id):'#'}

function render(){
  const board=document.getElementById('board');
  board.innerHTML=TIERS.map(tier=>{
    const rows=STREAMERS.filter(x=>x.tier===tier).map((x,index)=>({...x,_index:index,_live:state.get(x.user_id)||{live:false}}))
      .sort((a,b)=>Number(b._live.live)-Number(a._live.live)||a._index-b._index);

    return '<div class="tier" data-tier="'+tier+'">'+
      '<div class="tierLabel">'+tier+'</div>'+
      '<div class="members">'+(rows.length?rows.map(card).join(''):'<div class="empty">등록된 스트리머 없음</div>')+'</div>'+
    '</div>';
  }).join('');
  wire();
}

function card(x){
  const s=x._live;
  const live=!!s.live;
  const hasId=!!x.user_id;
  const img=x.profile_image||(hasId?profile(x.user_id):x.source_image)||'';
  const href=hasId?broadcastUrl(x.user_id):'#';
  return '<a class="streamer '+(live?'live':'off')+'" data-user="'+esc(x.user_id||'')+'" href="'+href+'" '+(hasId?'target="_blank" rel="noopener"':'onclick="return false"')+'>'+
    (img?'<img class="avatar" src="'+esc(img)+'" onerror="this.style.visibility=\'hidden\'">':'<div class="avatar" style="display:flex;align-items:center;justify-content:center;font-weight:900;color:#999">'+esc((x.nickname||'?').slice(0,1))+'</div>')+
    '<div class="info"><div class="name"><span class="raceBadge">'+esc(x.race||'')+'</span>'+esc(x.nickname||x.user_id)+(x.is_new?'<span class="newBadge">신규</span>':'')+'</div>'+
    '<div class="state"><span class="dot"></span>'+(hasId?(live?'LIVE':'OFF'):'SOOP 미연결')+'</div></div>'+
  '</a>';
}

function wire(){
  document.querySelectorAll('.streamer.live').forEach(el=>{
    el.addEventListener('mouseenter',()=>showPreview(el));
    el.addEventListener('mousemove',movePreview);
    el.addEventListener('mouseleave',hidePreview);
  });
}

function showPreview(el){
  const s=state.get(el.dataset.user)||{};
  if(!s.live)return;
  previewImg.src=s.thumbnail||'';
  previewImg.style.display=s.thumbnail?'block':'none';
  previewTitle.textContent=s.title||el.querySelector('.name')?.textContent||'LIVE';
  preview.classList.add('show');
}
function movePreview(e){
  const w=300,gap=14;
  let x=e.clientX+gap,y=e.clientY+gap;
  if(x+w>innerWidth-10)x=e.clientX-w-gap;
  if(y+220>innerHeight-10)y=Math.max(10,e.clientY-220);
  preview.style.left=x+'px';preview.style.top=y+'px';
}
function hidePreview(){preview.classList.remove('show')}

/*
  라이브 상태 함수.
  지금은 안전하게 OFF 기본값.
  다음 단계에서 네가 전에 사용한 SOOP live API 응답을 이 함수 하나에 연결하면
  정렬 / LIVE 표시 / 썸네일 / 클릭 기능은 그대로 즉시 작동한다.
*/
async function fetchLive(userId){
  try{
    const r=await fetch('/api/soop-live?user_id='+encodeURIComponent(userId),{cache:'no-store'});
    if(!r.ok)return {live:false};
    const j=await r.json();
    return {
      live:!!j.live,
      title:j.title||'',
      thumbnail:j.thumbnail||''
    };
  }catch(_){return {live:false}}
}

async function refreshLive(){
  const results=await Promise.all(STREAMERS.filter(x=>x.user_id).map(async x=>[x.user_id,await fetchLive(x.user_id)]));
  results.forEach(([id,s])=>state.set(id,s));
  render();
  updated.textContent='방송 상태 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 갱신';
}

render();
refreshLive();
setInterval(refreshLive,30000);
