<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타크래프트 티어표</title><link rel="stylesheet" href="navbar.css">









<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
  margin:0;background:#f3f4f6;color:#15181c;
  font-family:Inter,Arial,"Noto Sans KR",sans-serif
}
main{width:min(1450px,calc(100% - 165px));margin:34px auto 110px}
.pageTitleWrap{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin:0 0 22px;padding:0 2px 17px;border-bottom:1px solid #d9dde2
}
.pageTitleWrap h1{margin:0;font-size:31px;font-weight:1000;letter-spacing:-1.8px}
.pageSub{margin-top:5px;font-size:9px;font-weight:900;letter-spacing:2px;color:#979da4}

.board{display:flex;flex-direction:column;gap:18px;background:transparent;border:0;box-shadow:none;overflow:visible}
.tier{
  display:block;overflow:hidden;min-height:0;
  border:1px solid #dce1e6;border-radius:22px;background:#fff;
  box-shadow:0 12px 34px rgba(27,33,41,.06);scroll-margin-top:24px
}
.tierLabel{
  height:55px;padding:0 22px;
  display:flex;align-items:center;justify-content:flex-start;
  writing-mode:initial;transform:none;background:#171a1f;color:#fff;
  font-size:19px;font-weight:1000;letter-spacing:-.5px
}
.tierLabel:before{
  content:"";width:5px;height:20px;border-radius:99px;background:#fff;margin-right:11px;opacity:.9
}
.tierLabel:after{
  content:"STARCRAFT TIER";margin-left:auto;
  font-size:8px;letter-spacing:1.8px;color:#6f7780;font-weight:900
}

.members{display:block;padding:0}
.raceGroup{
  --race:#7c838b;
  display:grid;grid-template-columns:78px 1fr;
  min-height:168px;border-bottom:1px solid #eceff2
}
.raceGroup:last-child{border-bottom:0}
.raceGroup.T{--race:#2c78d2}
.raceGroup.Z{--race:#8050c1}
.raceGroup.P{--race:#c99a00}
.raceGroup.empty{display:none}
.raceHead{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  background:#f7f8fa;border-right:1px solid #e7eaee;color:var(--race);font-weight:1000
}
.raceLetter{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--race);color:#fff;font-size:14px;font-weight:1000
}
.raceName{font-size:9px;color:#777e86}
.racePlayers{
  display:flex;align-items:flex-start;flex-wrap:wrap;
  gap:18px;padding:18px 20px 20px
}

/* circular player */
.playerCard{
  --race:#7c838b;
  position:relative;width:132px;display:block;
  text-decoration:none;color:#171a1f;text-align:center;
  background:transparent;border:0;transition:transform .16s ease
}
.playerCard:hover{transform:translateY(-4px)}
.playerCard.T{--race:#2c78d2}
.playerCard.Z{--race:#8050c1}
.playerCard.P{--race:#c99a00}

.portrait{
  position:relative;width:118px;height:118px;aspect-ratio:1/1;
  margin:0 auto;overflow:visible;border-radius:50%;
  background:transparent
}
.profileCore{
  position:absolute;inset:0;
  overflow:hidden;border-radius:50%;
  background:#fff;border:5px solid #fff;
  box-shadow:0 0 0 2px var(--race),0 8px 20px rgba(25,31,39,.12)
}
.profileImg{
  position:relative;z-index:1;display:block;width:100%;height:100%;
  object-fit:cover;border-radius:50%;background:#fff
}
.blankPortrait{
  position:absolute;inset:0;z-index:0;border-radius:50%;background:#fff
}

/* university badge: top-left */
.univBadge{
  position:absolute;left:-1px;top:-1px;z-index:10;
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;background:#fff;border:2px solid #fff;
  box-shadow:0 3px 9px rgba(0,0,0,.16);overflow:hidden
}
.univBadge img{width:27px;height:27px;object-fit:contain}

/* dedicated state positions */
.upBadge{
  position:absolute;right:-2px;top:4px;z-index:11;
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#ef3549;color:#fff;border:3px solid #fff;
  box-shadow:0 3px 10px rgba(239,53,73,.28);
}
.upBadge:before{
  content:"";width:8px;height:8px;
  border-top:2px solid #fff;border-right:2px solid #fff;
  transform:translate(-1px,1px) rotate(-45deg)
}
.upBadge:after{
  content:"";position:absolute;width:2px;height:10px;
  background:#fff;transform:translate(-2px,3px) rotate(45deg);
  border-radius:2px
}

.newBadge{
  position:absolute;right:-6px;bottom:7px;z-index:11;
  height:22px;padding:0 8px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  background:#171a1f;color:#fff;border:2px solid #fff;
  box-shadow:0 3px 10px rgba(0,0,0,.16);
  font-size:8px;font-weight:1000;letter-spacing:.7px
}
.repairBadge{
  position:absolute;left:-4px;bottom:6px;z-index:11;
  width:27px;height:27px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#e28a18;border:3px solid #fff;
  box-shadow:0 3px 10px rgba(226,138,24,.24)
}
.repairBadge:before{
  content:"";width:11px;height:4px;background:#fff;border-radius:3px;
  transform:rotate(-45deg)
}
.repairBadge:after{
  content:"";position:absolute;width:5px;height:5px;
  border:2px solid #fff;border-radius:50%;
  transform:translate(4px,-4px)
}

/* remove generic state stack from old version */
.cornerBadges{display:none!important}

/* name line */
.namePlate{
  margin:8px 0 0;padding:0 3px;min-height:27px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  border:0;background:transparent;box-shadow:none;
  color:#202328;font-size:12px;font-weight:1000
}
.playerName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.raceText{display:none}
.liveBadge{
  position:static;order:-1;
  height:17px;padding:0 5px;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#ed2947;color:#fff;font-size:7px;font-weight:1000;letter-spacing:.45px;
  box-shadow:none
}
.liveBadge:before{display:none}

/* promotion soon = halo only */
.playerCard.soon .profileCore{
  animation:halo 1s ease-in-out infinite alternate
}
@keyframes halo{
  from{
    box-shadow:
      0 0 0 2px var(--race),
      0 8px 20px rgba(25,31,39,.12)
  }
  to{
    box-shadow:
      0 0 0 3px var(--race),
      0 0 18px var(--race),
      0 0 32px color-mix(in srgb,var(--race) 34%,transparent)
  }
}

/* idle */
.playerCard.idle{opacity:.42;filter:grayscale(.92) saturate(.18)}
.playerCard.idle .profileCore{
  box-shadow:0 0 0 2px #91969c,0 7px 17px rgba(25,31,39,.08)
}
.playerCard.missing{opacity:.86}

/* fixed menu preserved */
.tierRail{
  position:fixed;right:22px;top:50%;transform:translateY(-50%);
  z-index:9000;width:82px;padding:9px 7px 10px;
  border:1px solid rgba(218,221,226,.9);border-radius:22px;
  background:rgba(250,250,251,.86);backdrop-filter:blur(18px);
  box-shadow:0 18px 55px rgba(21,24,30,.13)
}
.tierRailTitle{
  height:25px;display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:1000;letter-spacing:1.8px;color:#a1a6ad
}
.tierJump{
  position:relative;height:30px;margin:2px 0;padding:0 5px;
  display:flex;align-items:center;justify-content:center;border-radius:10px;
  text-decoration:none;background:transparent;color:#666c74;
  font-size:10px;font-weight:900;transition:.15s
}
.tierJump:before{
  content:"";position:absolute;left:4px;width:3px;height:3px;
  border-radius:50%;background:#c8ccd2;transition:.15s
}
.tierJump:hover{background:#eceef1;color:#16181c}
.tierJump.active{
  background:#17191d;color:#fff;
  box-shadow:0 5px 14px rgba(23,25,29,.18)
}
.tierJump.active:before{background:#fff;height:12px;border-radius:3px}
.loading{padding:30px;color:#8c929a}

@media(max-width:950px){
  main{width:calc(100% - 24px)}.tierRail{display:none}
}
@media(max-width:650px){
  .raceGroup{grid-template-columns:50px 1fr}
  .racePlayers{gap:13px;padding:14px 10px}
  .playerCard{width:110px}
  .portrait{width:100px;height:100px}
  .raceName{display:none}
}

.liveOnlyBox{margin:5px 1px 8px;padding:7px 4px 8px;border-top:1px solid rgba(205,210,216,.8);border-bottom:1px solid rgba(205,210,216,.8);display:flex;flex-direction:column;align-items:center;gap:5px}
.liveOnlyLabel{font-size:7px;line-height:1;font-weight:1000;letter-spacing:.8px;color:#777e86;white-space:nowrap}
.liveSwitch{position:relative;width:34px;height:19px;display:block;cursor:pointer}
.liveSwitch input{position:absolute;opacity:0;pointer-events:none}
.liveSwitchTrack{position:absolute;inset:0;border-radius:99px;background:#cfd4da;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);transition:.16s ease}
.liveSwitchTrack:after{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.20);transition:.16s ease}
.liveSwitch input:checked + .liveSwitchTrack{background:#ef2947}
.liveSwitch input:checked + .liveSwitchTrack:after{transform:translateX(15px)}
.livePreview{position:fixed;display:none;width:320px;z-index:20000;pointer-events:none;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:#15181d;color:#fff;box-shadow:0 18px 46px rgba(0,0,0,.30)}
.livePreview.on{display:block}
.livePreviewImg{width:100%;aspect-ratio:16/9;display:block;object-fit:cover;background:#24282e}
.livePreviewBody{padding:10px 11px 11px}
.livePreviewLive{display:inline-flex;height:18px;padding:0 6px;align-items:center;justify-content:center;margin-bottom:6px;border-radius:5px;background:#ef2947;font-size:8px;font-weight:1000;letter-spacing:.6px}
.livePreviewTitle{font-size:12px;line-height:1.42;font-weight:900;word-break:keep-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.liveStatusLoading{padding:24px;color:#80868e;font-size:12px;text-align:center}
.univFilterBox{margin:0 1px 7px;padding:7px 3px 8px;border-bottom:1px solid rgba(205,210,216,.8)}
.univFilterLabel{text-align:center;font-size:7px;font-weight:1000;letter-spacing:.8px;color:#777e86;margin-bottom:5px}
.univFilterSelect{width:100%;height:28px;border:1px solid #d7dbe0;border-radius:8px;background:#fff;color:#3c424a;font-size:9px;font-weight:900;padding:0 3px;outline:none}


</style>








</head>
<body>
<nav id="global-navbar" class="globalNav"><div class="globalNavInner"><a class="globalNavBrand" href="index.html">MUJE</a><div class="globalNavLinks"><a class="globalNavLink" href="pubg.html">배틀그라운드</a><a class="globalNavLink active" href="starcraft.html">스타크래프트</a></div></div></nav>
<main>
      <div class="pageTitleWrap">
        <div>
          <h1>스타크래프트 티어표</h1>
          <div class="pageSub">SOOP STARCRAFT TIER BOARD</div>
        </div>
      </div>
      <div id="board" class="board"><div class="loading">티어표 불러오는 중...</div></div>
    </main>
    <aside id="tierRail" class="tierRail">
      <div class="tierRailTitle">TIER</div>
    </aside>


<script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];
const RACES=[['T','테란'],['Z','저그'],['P','프로토스']];
let players=[];
let universities=[];
let liveOnly=true;
let universityFilter='all';
let railObserver=null;

function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flags(x){return Array.isArray(x.status_flags)?x.status_flags:[]}
function tierId(t){return 'tier-'+String(t).replace(/[^0-9A-Za-z가-힣]/g,'-')}

function fallbackOrImage(x){
  const img=(x.soop_profile_image||'').trim();
  if(!img)return '<div class="blankPortrait"></div>';
  return `<img class="profileImg" src="${e(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`;
}
function universityBadge(x){
  const img=x.university_logo||x.school_logo||'';
  if(!img)return '';
  return `<span class="univBadge" title="${e(x.university_name||x.school_name||'소속')}"><img src="${e(img)}" alt="" onerror="this.parentElement.remove()"></span>`;
}

function card(x){
  const f=flags(x);
  const isLive=!!x._live;
  const cls=['playerCard',x.race||'',f.includes('soon')?'soon':'',f.includes('idle')?'idle':'',x.soop_user_id?'':'missing',isLive?'live':'off'].filter(Boolean).join(' ');
  const liveUrl=x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#';
  const stationUrl=x.soop_user_id?'https://www.sooplive.co.kr/station/'+encodeURIComponent(x.soop_user_id):'#';
  const href=isLive?liveUrl:stationUrl;
  const name=e(x.display_name||x.soop_nickname||x.player_name);

  const up=f.includes('up')?'<span class="upBadge" title="최근 승급"></span>':'';
  const newly=f.includes('new')?'<span class="newBadge" title="신규">NEW</span>':'';
  const repair=f.includes('repair')?'<span class="repairBadge" title="수리"></span>':'';

  return `<a class="${cls}" data-player-id="${x.id}" href="${href}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>
    <div class="portrait">
      <div class="profileCore">${fallbackOrImage(x)}</div>
      ${universityBadge(x)}
      ${up}${newly}${repair}
    </div>
    <div class="namePlate">
      ${isLive?'<span class="liveBadge">LIVE</span>':''}
      <span class="playerName">${name}</span>
    </div>
  </a>`;
}

function comparePlayers(a,b){
  const aIdle=flags(a).includes('idle')?1:0;
  const bIdle=flags(b).includes('idle')?1:0;
  if(aIdle!==bIdle)return aIdle-bIdle;

  const aSoon=flags(a).includes('soon')?0:1;
  const bSoon=flags(b).includes('soon')?0:1;
  if(aSoon!==bSoon)return aSoon-bSoon;

  return Number(a.sort_order||0)-Number(b.sort_order||0);
}

function universityMatch(x){
  if(universityFilter==='all')return true;
  if(universityFilter==='none')return x.university_id==null;
  return String(x.university_id||'')===String(universityFilter);
}

function raceRow(all,race,label){
  const p=all
    .filter(x=>String(x.race||'').toUpperCase()===race)
    .filter(universityMatch)
    .filter(x=>!liveOnly || x._live || !x._liveKnown)
    .sort(comparePlayers);

  return `<div class="raceGroup ${race} ${p.length?'':'empty'}">
    <div class="raceHead"><span class="raceLetter">${race}</span><span class="raceName">${label}</span></div>
    <div class="racePlayers">${p.map(card).join('')}</div>
  </div>`;
}

function visibleInTier(all){
  return all.some(x=>universityMatch(x) && (!liveOnly || x._live || !x._liveKnown));
}

function render(){
  board.innerHTML=TIERS.map(t=>{
    const all=players.filter(x=>x.tier===t);
    if(!visibleInTier(all))return '';
    return `<div class="tier" id="${tierId(t)}">
      <div class="tierLabel">${t}</div>
      <div class="members">${RACES.map(([r,l])=>raceRow(all,r,l)).join('')}</div>
    </div>`;
  }).join('');
  wirePreview();
  setupRailObserver();
}

function buildRail(){
  const visibleTiers=TIERS.filter(t=>visibleInTier(players.filter(x=>x.tier===t)));
  const univOptions=
    '<option value="all">전체 대학</option>'+
    '<option value="none">무소속</option>'+
    universities.map(u=>`<option value="${u.id}" ${String(universityFilter)===String(u.id)?'selected':''}>${e(u.name)}</option>`).join('');

  tierRail.innerHTML=
    '<div class="tierRailTitle">TIER</div>'+
    `<div class="liveOnlyBox">
      <div class="liveOnlyLabel">LIVE ONLY</div>
      <label class="liveSwitch" title="라이브만 보기">
        <input id="liveOnlyToggle" type="checkbox" ${liveOnly?'checked':''}>
        <span class="liveSwitchTrack"></span>
      </label>
    </div>`+
    `<div class="univFilterBox">
      <div class="univFilterLabel">UNIVERSITY</div>
      <select id="universityFilterSelect" class="univFilterSelect">${univOptions}</select>
    </div>`+
    visibleTiers.map(t=>`<a class="tierJump" href="#${tierId(t)}">${t}</a>`).join('');

  universityFilterSelect.value=String(universityFilter);
  universityFilterSelect.addEventListener('change',ev=>{
    universityFilter=ev.target.value;
    localStorage.setItem('star_university_filter',universityFilter);
    render();
    buildRail();
  });

  liveOnlyToggle.addEventListener('change',ev=>{
    liveOnly=!!ev.target.checked;
    localStorage.setItem('star_live_only',liveOnly?'1':'0');
    render();
    buildRail();
  });
}

function setupRailObserver(){
  if(railObserver)railObserver.disconnect();
  const links=[...document.querySelectorAll('.tierJump')];
  const sections=[...document.querySelectorAll('.tier')];
  railObserver=new IntersectionObserver(entries=>{
    const visible=entries.filter(v=>v.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(!visible)return;
    links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+visible.target.id));
  },{rootMargin:'-35% 0px -50% 0px',threshold:[0,.2,.5,.8]});
  sections.forEach(s=>railObserver.observe(s));
}

function wirePreview(){
  document.querySelectorAll('.playerCard.live .portrait').forEach(p=>{
    p.addEventListener('mouseenter',showPreview);
    p.addEventListener('mousemove',movePreview);
    p.addEventListener('mouseleave',hidePreview);
  });
}
function showPreview(ev){
  const card=ev.currentTarget.closest('.playerCard');
  const id=Number(card?.dataset?.playerId||0);
  const x=players.find(v=>Number(v.id)===id);
  if(!x?._live)return;

  livePreviewTitle.textContent=x._liveTitle||x.display_name||x.soop_nickname||x.player_name||'LIVE';
  if(x._thumbnail){
    livePreviewImg.src=x._thumbnail;
    livePreviewImg.style.display='block';
  }else{
    livePreviewImg.removeAttribute('src');
    livePreviewImg.style.display='none';
  }
  livePreview.classList.add('on');
  movePreview(ev);
}
function movePreview(ev){
  const w=320,g=14;
  let x=ev.clientX+g,y=ev.clientY+g;
  if(x+w>innerWidth-10)x=ev.clientX-w-g;
  if(y+230>innerHeight-10)y=Math.max(10,ev.clientY-230);
  livePreview.style.left=x+'px';
  livePreview.style.top=y+'px';
}
function hidePreview(){livePreview.classList.remove('on')}

async function fetchLiveChunk(chunk){
  try{
    const r=await fetch('/api/soop-live-status',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      cache:'no-store',
      body:JSON.stringify({ids:chunk})
    });
    if(!r.ok)return {};
    const j=await r.json();
    return j.status||{};
  }catch(_){
    return {};
  }
}

async function loadLiveStatusesProgressive(){
  const ids=[...new Set(players.filter(x=>x.soop_user_id).map(x=>x.soop_user_id))];
  const chunkSize=18;

  // Unknown status is intentionally visible at first so the page appears immediately.
  players=players.map(x=>({...x,_liveKnown:!x.soop_user_id,_live:false,_liveTitle:'',_thumbnail:'',_bno:''}));
  render();
  buildRail();

  for(let i=0;i<ids.length;i+=chunkSize){
    const chunk=ids.slice(i,i+chunkSize);
    const status=await fetchLiveChunk(chunk);

    players=players.map(x=>{
      if(!chunk.includes(x.soop_user_id))return x;
      const s=status[x.soop_user_id]||{live:false};
      return {
        ...x,
        _liveKnown:true,
        _live:!!s.live,
        _liveTitle:s.title||'',
        _thumbnail:s.thumbnail||'',
        _bno:s.bno||''
      };
    });

    // Update after every small batch instead of blocking on all 341 people.
    render();
    buildRail();

    // Yield so browser can paint/scroll smoothly between batches.
    await new Promise(resolve=>setTimeout(resolve,35));
  }
}

async function refreshAllLiveStatuses(){
  const ids=[...new Set(players.filter(x=>x.soop_user_id).map(x=>x.soop_user_id))];
  const chunkSize=30;

  for(let i=0;i<ids.length;i+=chunkSize){
    const chunk=ids.slice(i,i+chunkSize);
    const status=await fetchLiveChunk(chunk);

    players=players.map(x=>{
      if(!chunk.includes(x.soop_user_id))return x;
      const s=status[x.soop_user_id]||{live:false};
      return {
        ...x,
        _liveKnown:true,
        _live:!!s.live,
        _liveTitle:s.title||'',
        _thumbnail:s.thumbnail||'',
        _bno:s.bno||''
      };
    });

    render();
    buildRail();
    await new Promise(resolve=>setTimeout(resolve,35));
  }
}

async function load(){
  liveOnly=localStorage.getItem('star_live_only')!=='0';
  universityFilter=localStorage.getItem('star_university_filter')||'all';
  board.innerHTML='<div class="liveStatusLoading">티어표 불러오는 중...</div>';

  const r=await fetch('/api/star-public',{cache:'no-store'});
  if(!r.ok){board.innerHTML='<div class="loading">티어표 불러오기 실패</div>';return}

  const j=await r.json();
  universities=j.universities||[];
  if(universityFilter!=='all' && universityFilter!=='none' && !universities.some(u=>String(u.id)===String(universityFilter)))universityFilter='all';
  players=(j.players||[]).map(x=>({...x,_liveKnown:!x.soop_user_id,_live:false}));

  // DB list is painted immediately. LIVE checking follows in small sequential batches.
  render();
  buildRail();
  loadLiveStatusesProgressive();
}

load();

// 5-minute automatic refresh.
setInterval(async()=>{
  if(!players.length)return;
  await refreshAllLiveStatuses();
},300000);
</script>
