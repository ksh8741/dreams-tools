<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타크래프트 티어표</title><link rel="stylesheet" href="navbar.css">
<style>*{box-sizing:border-box}html{overflow-y:scroll;scrollbar-gutter:stable}body{margin:0;background:#f4f5f7;color:#15171a;font-family:Arial,"Noto Sans KR",sans-serif}main{width:min(1180px,calc(100% - 30px));margin:30px auto 70px}h1{font-size:24px;margin:0 0 16px}.board{border:1px solid #d8dce1;background:#fff}.tier{display:grid;grid-template-columns:86px 1fr;min-height:94px;border-bottom:1px solid #e2e5e9}.tier:last-child{border-bottom:0}.tierLabel{display:flex;align-items:center;justify-content:center;border-right:1px solid #ddd;font-size:17px;font-weight:1000;background:#f8f9fa}.members{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px}.streamer{position:relative;width:154px;height:68px;border:1px solid #d9dde2;background:#fff;display:flex;align-items:center;padding:8px;gap:8px;text-decoration:none;color:inherit}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#eee;flex:0 0 auto}.info{min-width:0;flex:1}.nameLine{display:flex;align-items:center;gap:4px;min-width:0}.name{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:10px;color:#999;margin-top:5px}.icons{display:flex;gap:2px;flex-shrink:0}.icon{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 2px;border:1px solid #dfe2e6;background:#fafafa;font-size:10px}.missing{opacity:.5}.setup{padding:12px;background:#fff;border:1px solid #ddd;margin-bottom:12px}.setup input{width:330px;max-width:100%;height:34px;margin:3px;border:1px solid #ccc;padding:0 8px}button{height:34px}</style></head><body>
<nav id="global-navbar" class="globalNav"><div class="globalNavInner"><a class="globalNavBrand" href="index.html">MUJE</a><div class="globalNavLinks"><a class="globalNavLink" href="pubg.html">배틀그라운드</a><a class="globalNavLink active" href="starcraft.html">스타크래프트</a></div></div></nav>
<main><h1>스타크래프트 티어표</h1><div id="setup" class="setup"><input id="u" placeholder="Supabase URL"><input id="k" placeholder="Supabase Publishable key"><button onclick="save()">연결</button></div><div id="board" class="board"></div></main>
<script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];const STATUS={soon:['⏫','티어상승임박'],up:['▲','최근티어상승'],idle:['⏸','휴면'],repair:['🔧','수리'],new:['✦','신규']};
u.value=localStorage.star_sburl||'';k.value=localStorage.star_sbkey||'';function save(){localStorage.star_sburl=u.value.trim().replace(/\/$/,'');localStorage.star_sbkey=k.value.trim();load()}
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function icons(x){const a=Array.isArray(x.status_flags)?x.status_flags:[];return '<span class="icons">'+a.filter(k=>STATUS[k]).map(k=>`<span class="icon" title="${STATUS[k][1]}">${STATUS[k][0]}</span>`).join('')+'</span>'}
async function load(){if(!u.value||!k.value)return;const r=await fetch(u.value+'/rest/v1/star_players?select=*&enabled=eq.true&order=sort_order.asc',{headers:{apikey:k.value,Authorization:'Bearer '+k.value}});if(!r.ok){board.textContent='DB 연결 실패';return}const a=await r.json();setup.style.display='none';board.innerHTML=TIERS.map(t=>{const p=a.filter(x=>x.tier===t);return `<div class="tier"><div class="tierLabel">${t}</div><div class="members">${p.map(x=>`<a class="streamer ${x.soop_user_id?'':'missing'}" href="${x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#'}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>${x.soop_profile_image?`<img class="avatar" src="${e(x.soop_profile_image)}">`:`<div class="avatar"></div>`}<div class="info"><div class="nameLine"><div class="name">${e(x.display_name||x.soop_nickname||x.player_name)}</div>${icons(x)}</div><div class="meta">${x.race}${x.soop_user_id?' · SOOP':''}</div></div></a>`).join('')}</div></div>`}).join('')}load();
</script><script src="navbar.js"></script></body></html>
