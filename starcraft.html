<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타크래프트 티어표</title><link rel="stylesheet" href="navbar.css">









<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
  margin:0;background:#f7f8fa;color:#15181d;
  font-family:Inter,Arial,"Noto Sans KR",sans-serif
}
main{width:min(1480px,calc(100% - 165px));margin:36px auto 110px}
.pageTitleWrap{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin-bottom:20px
}
.pageTitleWrap h1{margin:0;font-size:30px;font-weight:1000;letter-spacing:-1.6px}
.pageSub{margin-top:5px;color:#9aa0a7;font-size:9px;font-weight:900;letter-spacing:1.8px}

.board{display:flex;flex-direction:column;gap:16px;background:transparent;border:0;box-shadow:none;overflow:visible}

/* tier: white panel with slim title cap */
.tier{
  overflow:hidden;border:1px solid #e0e4e9;border-radius:18px;
  background:#fff;box-shadow:0 7px 24px rgba(25,31,40,.045);
  scroll-margin-top:24px
}
.tierLabel{
  height:50px;padding:0 20px;
  display:flex;align-items:center;justify-content:flex-start;
  writing-mode:initial;transform:none;
  background:#fff;color:#171a1f;border-bottom:1px solid #eceff2;
  font-size:18px;font-weight:1000;letter-spacing:-.5px
}
.tierLabel:before{
  content:"";width:4px;height:19px;margin-right:10px;border-radius:99px;background:#171a1f
}
.tierLabel:after{
  content:"";margin-left:auto;width:36px;height:1px;background:#d7dbe0
}

.members{display:block;padding:0}

/* race rows */
.raceGroup{
  --race:#80868e;
  display:grid;grid-template-columns:62px 1fr;
  min-height:172px;border-bottom:1px solid #eff1f4
}
.raceGroup:last-child{border-bottom:0}
.raceGroup.T{--race:#2879d4}
.raceGroup.Z{--race:#7b4bbb}
.raceGroup.P{--race:#c99600}
.raceGroup.empty{display:none}

.raceHead{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  background:#fafbfc;border-right:1px solid #eceff2
}
.raceLetter{
  width:31px;height:31px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:var(--race);color:#fff;font-size:13px;font-weight:1000
}
.raceName{display:none}
.racePlayers{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(135px,1fr));
  gap:18px 14px;padding:18px 20px 20px;align-items:start
}

/* V16 CARD: square photo, bottom caption on a floating glass tab */
.playerCard{
  --race:#80868e;
  position:relative;display:block;min-width:0;
  text-decoration:none;color:#171a1f;
  transition:transform .16s ease
}
.playerCard.T{--race:#2879d4}
.playerCard.Z{--race:#7b4bbb}
.playerCard.P{--race:#c99600}
.playerCard:hover{transform:translateY(-4px)}

.portrait{
  position:relative;width:100%;aspect-ratio:1/1 !important;
  overflow:hidden;border-radius:13px;
  background:#fff;border:1px solid #e0e4e8;
  box-shadow:0 5px 15px rgba(23,29,38,.075)
}
.profileImg{
  position:relative;z-index:1;display:block;width:100%;height:100%;
  object-fit:cover;background:#fff
}
.blankPortrait{position:absolute;inset:0;z-index:0;background:#fff}

/* race signature: tiny top edge only */
.portrait:before{
  content:"";position:absolute;left:12px;right:12px;top:0;height:3px;
  z-index:5;border-radius:0 0 4px 4px;background:var(--race)
}
.portrait:after{display:none}

/* name area */
.namePlate{
  position:relative;z-index:7;
  width:calc(100% - 18px);min-height:34px;
  margin:-10px auto 0;padding:0 9px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid #e1e5e9;border-radius:10px;
  background:rgba(255,255,255,.97);
  box-shadow:0 5px 14px rgba(23,29,38,.07);
  color:#20242a;font-size:12px;font-weight:1000
}
.playerName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.raceText{
  flex:0 0 auto;width:auto;height:auto;border:0;border-radius:0;
  background:transparent;color:var(--race);font-size:10px;font-weight:1000
}
.raceText:before{content:"·";margin-right:4px;color:#bcc1c7}

/* live small strip */
.liveBadge{
  position:absolute;left:7px;top:-17px;z-index:10;
  height:18px;padding:0 6px;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#ef2e49;color:#fff;font-size:7px;font-weight:1000;letter-spacing:.5px;
  box-shadow:0 3px 8px rgba(239,46,73,.18)
}
.liveBadge:before{display:none}

/* university */
.univBadge{
  position:absolute;left:8px;top:8px;z-index:8;width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;background:rgba(255,255,255,.94);
  border:1px solid rgba(224,228,233,.9);
  box-shadow:0 3px 9px rgba(0,0,0,.11);overflow:hidden
}
.univBadge img{width:27px;height:27px;object-fit:contain}

/* statuses */
.cornerBadges{
  position:absolute;right:7px;top:7px;z-index:9;
  display:flex;flex-direction:column;align-items:flex-end;gap:4px
}
.stateBadge{
  height:19px;padding:0 6px;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-size:7px;font-weight:1000;letter-spacing:.5px;
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 2px 7px rgba(0,0,0,.13)
}
.stateBadge.up{background:#eb3c4d}
.stateBadge.new{background:#171a1f}
.stateBadge.repair{background:#df8a1a}

/* promotion glow: clean edge light */
.playerCard.soon .portrait{animation:v16Glow .95s ease-in-out infinite alternate}
@keyframes v16Glow{
  from{box-shadow:0 5px 15px rgba(23,29,38,.075)}
  to{
    box-shadow:
      0 6px 17px rgba(23,29,38,.08),
      0 0 0 2px color-mix(in srgb,var(--race) 55%,transparent),
      0 0 16px color-mix(in srgb,var(--race) 28%,transparent)
  }
}

.playerCard.idle{opacity:.43;filter:grayscale(.93) saturate(.16)}
.playerCard.idle .portrait:before{background:#92979d}
.playerCard.idle .raceText{color:#92979d}
.playerCard.missing{opacity:.86}

/* fixed menu: preserved */
.tierRail{
  position:fixed;right:22px;top:50%;transform:translateY(-50%);
  z-index:9000;width:82px;padding:9px 7px 10px;
  border:1px solid rgba(218,221,226,.9);border-radius:22px;
  background:rgba(250,250,251,.86);backdrop-filter:blur(18px);
  box-shadow:0 18px 55px rgba(21,24,30,.13)
}
.tierRailTitle{height:25px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:1000;letter-spacing:1.8px;color:#a1a6ad}
.tierJump{
  position:relative;height:30px;margin:2px 0;padding:0 5px;
  display:flex;align-items:center;justify-content:center;border-radius:10px;
  text-decoration:none;background:transparent;color:#666c74;font-size:10px;font-weight:900;transition:.15s
}
.tierJump:before{content:"";position:absolute;left:4px;width:3px;height:3px;border-radius:50%;background:#c8ccd2;transition:.15s}
.tierJump:hover{background:#eceef1;color:#16181c}
.tierJump.active{background:#17191d;color:#fff;box-shadow:0 5px 14px rgba(23,25,29,.18)}
.tierJump.active:before{background:#fff;height:12px;border-radius:3px}
.loading{padding:30px;color:#8c929a}

@media(max-width:950px){main{width:calc(100% - 24px)}.tierRail{display:none}}
@media(max-width:650px){
  .raceGroup{grid-template-columns:43px 1fr}
  .raceLetter{width:27px;height:27px;border-radius:7px;font-size:11px}
  .racePlayers{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px;padding:13px 10px 17px}
}
</style>








</head>
<body>
<nav id="global-navbar" class="globalNav"><div class="globalNavInner"><a class="globalNavBrand" href="index.html">MUJE</a><div class="globalNavLinks"><a class="globalNavLink" href="pubg.html">배틀그라운드</a><a class="globalNavLink active" href="starcraft.html">스타크래프트</a></div></div></nav>
<main>
      <div class="pageTitleWrap">
        <div>
          <h1>스타크래프트 티어표</h1>
          <div class="pageSub">SOOP STARCRAFT TIER BOARD</div>
        </div>
      </div>
      <div id="board" class="board"><div class="loading">티어표 불러오는 중...</div></div>
    </main>
    <aside id="tierRail" class="tierRail">
      <div class="tierRailTitle">TIER</div>
    </aside>

<script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];
const RACE_ORDER={T:0,Z:1,P:2};
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flags(x){return Array.isArray(x.status_flags)?x.status_flags:[]}

function fallbackOrImage(x){
  const img=(x.soop_profile_image||'').trim();
  if(!img) return '<div class="blankPortrait" aria-label="프로필 이미지 없음"></div>';
  return `<img class="profileImg" src="${e(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=&quot;blankPortrait&quot;></div>')">`;
}

function universityBadge(x){
  const img=x.university_logo||x.school_logo||'';
  if(!img)return '';
  return `<span class="univBadge" title="${e(x.university_name||x.school_name||'소속')}"><img src="${e(img)}" alt="" onerror="this.parentElement.remove()"></span>`;
}

function cornerBadges(x){
  const f=flags(x),arr=[];
  if(f.includes('up'))arr.push('<span class="stateBadge up">UP</span>');
  if(f.includes('new'))arr.push('<span class="stateBadge new">NEW</span>');
  if(f.includes('repair'))arr.push('<span class="stateBadge repair">REPAIR</span>');
  return arr.length?'<span class="cornerBadges">'+arr.join('')+'</span>':'';
}

function card(x){
  const f=flags(x);
  const cls=['playerCard',x.race||'',f.includes('soon')?'soon':'',f.includes('idle')?'idle':'',x.soop_user_id?'':'missing'].filter(Boolean).join(' ');
  const live=!!(x.live||x.is_live||x.broadcast_live);
  const href=x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#';
  const name=e(x.display_name||x.soop_nickname||x.player_name);
  return `<a class="${cls}" href="${href}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>
    <div class="portrait" data-race="${e(String(x.race||'').toUpperCase())}">
      ${fallbackOrImage(x)}
      ${universityBadge(x)}
      ${cornerBadges(x)}
    </div>
    <div class="namePlate">
      ${live?'<span class="liveBadge">LIVE</span>':''}
      <span class="playerName">${name}</span>
      <span class="raceText">${e(String(x.race||'').toUpperCase())}</span>
    </div>
  </a>`;
}

function tierId(t){return 'tier-'+String(t).replace(/[^0-9A-Za-z가-힣]/g,'-')}
function buildRail(){
  tierRail.innerHTML='<div class="tierRailTitle">TIER</div>'+TIERS.map(t=>`<a class="tierJump" href="#${tierId(t)}">${t}</a>`).join('');
}
function setupRailObserver(){
  const links=[...document.querySelectorAll('.tierJump')];
  const sections=[...document.querySelectorAll('.tier')];
  if(!sections.length)return;
  const io=new IntersectionObserver(entries=>{
    const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(!visible)return;
    links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+visible.target.id));
  },{rootMargin:'-35% 0px -50% 0px',threshold:[0,.2,.5,.8]});
  sections.forEach(s=>io.observe(s));
}
async function load(){
  const r=await fetch('/api/star-public',{cache:'no-store'});
  if(!r.ok){board.innerHTML='<div class="loading">티어표 불러오기 실패</div>';return}
  const j=await r.json(),a=j.players||[];
  board.innerHTML=TIERS.map(t=>{
    const all=a.filter(x=>x.tier===t);
    const raceRow=(race,label)=>{
      const p=all.filter(x=>String(x.race||'').toUpperCase()===race).sort((a,b)=>{
        const ai=flags(a).includes('idle')?1:0;
        const bi=flags(b).includes('idle')?1:0;
        return ai-bi || (Number(a.sort_order||0)-Number(b.sort_order||0));
      });
      return `<div class="raceGroup ${race} ${p.length?'':'empty'}">
        <div class="raceHead"><span class="raceLetter">${race}</span><span class="raceName">${label}</span></div>
        <div class="racePlayers">${p.map(card).join('')}</div>
      </div>`;
    };
    return `<div class="tier" id="${tierId(t)}">
      <div class="tierLabel">${t}</div>
      <div class="members">
        ${raceRow('T','테란')}
        ${raceRow('Z','저그')}
        ${raceRow('P','프로토스')}
      </div>
    </div>`;
  }).join('');
  buildRail();
  setupRailObserver();
}
load();
</script>
<script src="navbar.js"></script>
</body></html>
