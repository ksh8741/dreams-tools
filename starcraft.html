<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타크래프트 티어표</title><link rel="stylesheet" href="navbar.css">





<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
  margin:0;
  color:#17191d;
  font-family:Inter,Arial,"Noto Sans KR",sans-serif;
  background:#eceff2;
}
main{
  width:min(1480px,calc(100% - 160px));
  margin:32px auto 100px;
}
.pageTitleWrap{
  display:flex;align-items:flex-end;justify-content:space-between;
  margin:0 0 20px;padding:0 4px;
}
.pageTitleWrap h1{
  margin:0;font-size:32px;font-weight:1000;letter-spacing:-1.8px;color:#111318;
}
.pageSub{
  margin-top:5px;font-size:10px;font-weight:900;letter-spacing:1.6px;color:#9198a0;
}

/* BOARD */
.board{
  display:flex;flex-direction:column;gap:18px;
  border:0;background:transparent;box-shadow:none;overflow:visible;
}

/* each tier = dark broadcast module */
.tier{
  position:relative;display:block;min-height:0;overflow:hidden;
  border:1px solid #d9dde2;border-radius:24px;background:#fff;
  box-shadow:0 16px 42px rgba(25,31,39,.07);
  scroll-margin-top:26px;
}
.tierLabel{
  position:relative;height:64px;padding:0 24px;
  display:flex;align-items:center;justify-content:flex-start;
  writing-mode:initial;transform:none;
  background:#15181d;color:#fff;
  font-size:19px;font-weight:1000;letter-spacing:-.5px;
}
.tierLabel:before{
  content:"TIER";display:inline-flex;align-items:center;justify-content:center;
  height:24px;padding:0 9px;margin-right:12px;border-radius:7px;
  background:#fff;color:#17191d;font-size:8px;font-weight:1000;letter-spacing:1.4px;
}
.tierLabel:after{
  content:"STARCRAFT ROSTER";margin-left:auto;
  color:#707780;font-size:8px;font-weight:900;letter-spacing:1.8px;
}

.members{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(255px,1fr));
  gap:12px;padding:16px;
  align-items:stretch;
}

/* ===== landscape broadcast card ===== */
.playerCard{
  --race:#838b94;
  position:relative;display:grid;
  grid-template-columns:96px minmax(0,1fr);
  min-height:108px;overflow:hidden;
  border:1px solid #e2e5e9;border-radius:15px;
  background:#f7f8fa;color:#181b20;text-decoration:none;
  transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
}
.playerCard:hover{
  transform:translateY(-3px);
  border-color:#cbd1d8;
  box-shadow:0 12px 28px rgba(25,31,39,.10);
}
.playerCard.T{--race:#2477cf}
.playerCard.Z{--race:#7546b5}
.playerCard.P{--race:#c89400}

/* left image panel */
.portrait{
  position:relative;grid-column:1;grid-row:1;
  width:96px;height:108px;margin:0;overflow:hidden;
  border:0;border-radius:0;background:#fff;box-shadow:none;
}
.portrait:after{
  content:"";display:block;position:absolute;left:0;right:auto;top:0;bottom:0;
  width:4px;height:auto;background:var(--race);z-index:4;
}
.profileImg{
  position:relative;z-index:1;display:block;width:100%;height:100%;
  object-fit:cover;background:#fff;
}
.blankPortrait{position:absolute;inset:0;background:#fff;z-index:0}

/* right identity block */
.namePlate{
  position:relative;grid-column:2;grid-row:1;
  margin:0;padding:0 14px 0 15px;
  min-width:0;min-height:108px;
  display:flex;align-items:center;justify-content:flex-start;gap:7px;
  border:0;background:#f7f8fa;box-shadow:none;
  color:#1b1e23;font-size:14px;font-weight:1000;
}
.namePlate:before{
  content:"PLAYER";
  position:absolute;left:15px;top:20px;
  font-size:7px;font-weight:1000;letter-spacing:1.4px;color:#a2a8af;
}
.playerName{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  margin-top:7px;
}
.raceText{
  flex:0 0 auto;margin-top:7px;
  width:25px;height:25px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:8px;background:var(--race);color:#fff;
  font-size:10px;font-weight:1000;
}
.liveBadge{
  position:absolute;left:15px;bottom:17px;
  height:18px;padding:0 7px;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#ef2947;color:#fff;font-size:8px;font-weight:1000;letter-spacing:.55px;
}

/* university mark overlays image */
.univBadge{
  position:absolute;left:9px;top:9px;z-index:8;
  width:31px;height:31px;
  display:flex;align-items:center;justify-content:center;
  border-radius:9px;background:rgba(255,255,255,.94);
  border:1px solid rgba(225,228,232,.9);
  box-shadow:0 4px 12px rgba(0,0,0,.15);overflow:hidden;
}
.univBadge img{width:26px;height:26px;object-fit:contain}

/* status stack at right */
.cornerBadges{
  position:absolute;right:9px;top:9px;bottom:auto;z-index:8;
  display:flex;flex-direction:column;align-items:flex-end;gap:5px;
}
.stateBadge{
  height:20px;padding:0 7px;border:0;border-radius:5px;
  display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-size:8px;font-weight:1000;letter-spacing:.6px;
  box-shadow:none;
}
.stateBadge.up{background:#df3d48}
.stateBadge.new{background:#181b20}
.stateBadge.repair{background:#e68a18}

/* promotion: glowing race spine */
.playerCard.soon .portrait:after{
  width:5px;animation:spineGlow .9s ease-in-out infinite alternate;
}
.playerCard.soon{
  animation:softCardGlow .9s ease-in-out infinite alternate;
}
@keyframes spineGlow{
  from{box-shadow:0 0 4px var(--race)}
  to{box-shadow:0 0 18px var(--race),0 0 28px var(--race)}
}
@keyframes softCardGlow{
  from{box-shadow:0 0 0 1px color-mix(in srgb,var(--race) 15%,transparent)}
  to{box-shadow:0 0 0 2px color-mix(in srgb,var(--race) 50%,transparent),0 8px 24px color-mix(in srgb,var(--race) 16%,transparent)}
}

.playerCard.idle{
  opacity:.43;filter:grayscale(.88) saturate(.25);
}
.playerCard.idle .portrait:after,
.playerCard.idle .raceText{background:#8b9198}
.playerCard.missing{opacity:.85}

/* KEEP V10/V11 FIXED TIER MENU */
.tierRail{
  position:fixed;right:22px;top:50%;transform:translateY(-50%);
  z-index:9000;width:82px;padding:9px 7px 10px;
  border:1px solid rgba(218,221,226,.9);border-radius:22px;
  background:rgba(250,250,251,.86);backdrop-filter:blur(18px);
  box-shadow:0 18px 55px rgba(21,24,30,.13);
}
.tierRailTitle{
  height:25px;display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:1000;letter-spacing:1.8px;color:#a1a6ad;
}
.tierJump{
  position:relative;height:30px;margin:2px 0;padding:0 5px;
  display:flex;align-items:center;justify-content:center;border-radius:10px;
  text-decoration:none;background:transparent;color:#666c74;
  font-size:10px;font-weight:900;transition:.15s;
}
.tierJump:before{
  content:"";position:absolute;left:4px;width:3px;height:3px;
  border-radius:50%;background:#c8ccd2;transition:.15s;
}
.tierJump:hover{background:#eceef1;color:#16181c}
.tierJump.active{
  background:#17191d;color:#fff;box-shadow:0 5px 14px rgba(23,25,29,.18);
}
.tierJump.active:before{background:#fff;height:12px;border-radius:3px}

.loading{padding:30px;color:#8c929a}
@media(max-width:950px){
  main{width:calc(100% - 24px)}
  .tierRail{display:none}
}
@media(max-width:650px){
  .members{grid-template-columns:1fr;padding:10px}
  .tierLabel{height:54px;font-size:16px}
}
</style>




</head>
<body>
<nav id="global-navbar" class="globalNav"><div class="globalNavInner"><a class="globalNavBrand" href="index.html">MUJE</a><div class="globalNavLinks"><a class="globalNavLink" href="pubg.html">배틀그라운드</a><a class="globalNavLink active" href="starcraft.html">스타크래프트</a></div></div></nav>
<main>
      <div class="pageTitleWrap">
        <div>
          <h1>스타크래프트 티어표</h1>
          <div class="pageSub">SOOP STARCRAFT TIER BOARD</div>
        </div>
      </div>
      <div id="board" class="board"><div class="loading">티어표 불러오는 중...</div></div>
    </main>
    <aside id="tierRail" class="tierRail">
      <div class="tierRailTitle">TIER</div>
    </aside>

<script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];
const RACE_ORDER={T:0,Z:1,P:2};
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flags(x){return Array.isArray(x.status_flags)?x.status_flags:[]}

function fallbackOrImage(x){
  const img=(x.soop_profile_image||'').trim();
  if(!img) return '<div class="blankPortrait" aria-label="프로필 이미지 없음"></div>';
  return `<img class="profileImg" src="${e(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=&quot;blankPortrait&quot;></div>')">`;
}

function universityBadge(x){
  const img=x.university_logo||x.school_logo||'';
  if(!img)return '';
  return `<span class="univBadge" title="${e(x.university_name||x.school_name||'소속')}"><img src="${e(img)}" alt="" onerror="this.parentElement.remove()"></span>`;
}

function cornerBadges(x){
  const f=flags(x),arr=[];
  if(f.includes('up'))arr.push('<span class="stateBadge up">UP</span>');
  if(f.includes('new'))arr.push('<span class="stateBadge new">NEW</span>');
  if(f.includes('repair'))arr.push('<span class="stateBadge repair">REPAIR</span>');
  return arr.length?'<span class="cornerBadges">'+arr.join('')+'</span>':'';
}

function card(x){
  const f=flags(x);
  const cls=['playerCard',x.race||'',f.includes('soon')?'soon':'',f.includes('idle')?'idle':'',x.soop_user_id?'':'missing'].filter(Boolean).join(' ');
  const live=!!(x.live||x.is_live||x.broadcast_live);
  const href=x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#';
  const name=e(x.display_name||x.soop_nickname||x.player_name);
  return `<a class="${cls}" href="${href}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>
    <div class="portrait">
      ${fallbackOrImage(x)}
      ${universityBadge(x)}
      ${cornerBadges(x)}
    </div>
    <div class="namePlate">
      ${live?'<span class="liveBadge">LIVE</span>':''}
      <span class="playerName">${name}</span>
      <span class="raceText">${e(String(x.race||'').toUpperCase())}</span>
    </div>
  </a>`;
}

function tierId(t){return 'tier-'+String(t).replace(/[^0-9A-Za-z가-힣]/g,'-')}
function buildRail(){
  tierRail.innerHTML='<div class="tierRailTitle">TIER</div>'+TIERS.map(t=>`<a class="tierJump" href="#${tierId(t)}">${t}</a>`).join('');
}
function setupRailObserver(){
  const links=[...document.querySelectorAll('.tierJump')];
  const sections=[...document.querySelectorAll('.tier')];
  if(!sections.length)return;
  const io=new IntersectionObserver(entries=>{
    const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(!visible)return;
    links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+visible.target.id));
  },{rootMargin:'-35% 0px -50% 0px',threshold:[0,.2,.5,.8]});
  sections.forEach(s=>io.observe(s));
}
async function load(){
  const r=await fetch('/api/star-public',{cache:'no-store'});
  if(!r.ok){board.innerHTML='<div class="loading">티어표 불러오기 실패</div>';return}
  const j=await r.json(),a=j.players||[];
  board.innerHTML=TIERS.map(t=>{
    const p=a.filter(x=>x.tier===t).sort((a,b)=>{
      const ai=flags(a).includes('idle')?1:0;
      const bi=flags(b).includes('idle')?1:0;
      return ai-bi ||
        (RACE_ORDER[a.race]??9)-(RACE_ORDER[b.race]??9) ||
        (Number(a.sort_order||0)-Number(b.sort_order||0));
    });
    return `<div class="tier" id="${tierId(t)}"><div class="tierLabel">${t}</div><div class="members">${p.map(card).join('')}</div></div>`;
  }).join('');
  buildRail();
  setupRailObserver();
}
load();
</script>
<script src="navbar.js"></script>
</body></html>
