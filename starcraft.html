<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스타크래프트 티어표</title><link rel="stylesheet" href="navbar.css">







<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;scrollbar-gutter:stable}
body{
  margin:0;
  color:#11151a;
  font-family:Inter,Arial,"Noto Sans KR",sans-serif;
  background:
    linear-gradient(rgba(25,31,38,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(25,31,38,.035) 1px,transparent 1px),
    #f4f6f8;
  background-size:28px 28px;
}
main{
  width:min(1460px,calc(100% - 165px));
  margin:34px auto 110px;
}
.pageTitleWrap{
  display:flex;align-items:end;justify-content:space-between;
  margin:0 0 26px;padding:0 3px 17px;
  border-bottom:1px solid #d8dde3;
}
.pageTitleWrap h1{
  margin:0;font-size:31px;font-weight:1000;letter-spacing:-1.8px;
}
.pageSub{
  margin-top:5px;font-size:9px;font-weight:900;letter-spacing:2.1px;color:#949ba4;
}
.board{
  display:flex;flex-direction:column;gap:26px;
  background:transparent;border:0;box-shadow:none;overflow:visible;
}

/* ===== tier = horizontal roster strip ===== */
.tier{
  position:relative;display:grid;
  grid-template-columns:105px 1fr;
  min-height:190px;
  border:1px solid #dfe3e8;
  border-radius:20px;
  background:rgba(255,255,255,.84);
  box-shadow:0 10px 30px rgba(25,32,42,.055);
  overflow:hidden;
  scroll-margin-top:25px;
}
.tierLabel{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  writing-mode:initial;transform:none;
  background:#15191e;color:#fff;
  border:0;
  font-size:22px;font-weight:1000;letter-spacing:-1px;
}
.tierLabel:before{
  content:"TIER";position:absolute;top:18px;
  font-size:7px;font-weight:1000;letter-spacing:2px;color:#747c85;
}
.tierLabel:after{
  content:"";position:absolute;bottom:19px;
  width:22px;height:3px;border-radius:99px;background:#fff;
}
.members{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(142px,1fr));
  gap:18px;
  padding:20px 22px 21px;
  align-items:start;
}

/* ===== V14: "ID CHIP" =====
   Profile is ALWAYS square. No portrait ratio, no fake image cover.
*/
.playerCard{
  --race:#7b838c;
  position:relative;min-width:0;
  text-decoration:none;color:#161a1f;
  background:transparent;border:0;border-radius:0;
  overflow:visible;
  transition:transform .16s ease;
}
.playerCard.T{--race:#2b76d2}
.playerCard.Z{--race:#8151c5}
.playerCard.P{--race:#c99a00}
.playerCard:hover{transform:translateY(-4px)}

.portrait{
  position:relative;
  width:100%;
  aspect-ratio:1 / 1 !important;
  overflow:hidden;
  border-radius:14px;
  background:#fff;
  border:1px solid #dfe3e8;
  box-shadow:0 6px 16px rgba(25,31,40,.075);
}
.profileImg{
  display:block;position:relative;z-index:1;
  width:100%;height:100%;
  object-fit:cover;
  background:#fff;
}
.blankPortrait{
  position:absolute;inset:0;z-index:0;background:#fff;
}

/* race marker = corner bracket instead of full colored frame */
.portrait:before,
.portrait:after{
  content:"";position:absolute;z-index:5;pointer-events:none;
}
.portrait:before{
  left:0;bottom:0;width:32px;height:4px;background:var(--race);
}
.portrait:after{
  left:0;bottom:0;width:4px;height:32px;background:var(--race);
}

/* name becomes an ID label crossing the lower edge */
.namePlate{
  position:relative;z-index:7;
  width:calc(100% - 14px);
  min-height:34px;
  margin:-9px 7px 0;
  padding:0 10px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid #dfe3e8;
  border-radius:9px;
  background:rgba(255,255,255,.96);
  box-shadow:0 5px 13px rgba(24,31,40,.07);
  font-size:12px;font-weight:1000;
}
.playerName{
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.raceText{
  flex:0 0 auto;
  width:20px;height:20px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;
  background:color-mix(in srgb,var(--race) 10%,white);
  color:var(--race);
  font-size:10px;font-weight:1000;
}

/* live */
.liveBadge{
  position:absolute;left:8px;bottom:8px;z-index:8;
  order:initial;
  height:20px;padding:0 7px;
  display:inline-flex;align-items:center;gap:4px;
  border-radius:6px;
  background:#ed2443;color:#fff;
  box-shadow:0 4px 10px rgba(237,36,67,.24);
  font-size:7px;font-weight:1000;letter-spacing:.6px;
}
.liveBadge:before{
  content:"";width:5px;height:5px;border-radius:50%;background:#fff;
}

/* university */
.univBadge{
  position:absolute;left:8px;top:8px;z-index:8;
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  background:rgba(255,255,255,.93);
  border:1px solid rgba(218,222,228,.9);
  box-shadow:0 4px 11px rgba(0,0,0,.12);
  overflow:hidden;
}
.univBadge img{width:28px;height:28px;object-fit:contain}

/* status flags */
.cornerBadges{
  position:absolute;right:7px;top:7px;z-index:9;
  display:flex;flex-direction:column;align-items:flex-end;gap:5px;
}
.stateBadge{
  height:20px;padding:0 7px;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:6px;
  color:#fff;font-size:7px;font-weight:1000;letter-spacing:.65px;
  border:1px solid rgba(255,255,255,.35);
  box-shadow:0 3px 8px rgba(0,0,0,.14);
}
.stateBadge.up{background:#ef3447}
.stateBadge.new{background:#171b20}
.stateBadge.repair{background:#e18b19}

/* promotion = corner bracket glow, square image remains untouched */
.playerCard.soon .portrait{
  animation:v14Glow 1s ease-in-out infinite alternate;
}
.playerCard.soon .portrait:before,
.playerCard.soon .portrait:after{
  animation:v14Bracket 1s ease-in-out infinite alternate;
}
@keyframes v14Glow{
  from{box-shadow:0 6px 16px rgba(25,31,40,.075)}
  to{box-shadow:0 7px 18px rgba(25,31,40,.09),0 0 18px color-mix(in srgb,var(--race) 32%,transparent)}
}
@keyframes v14Bracket{
  from{filter:brightness(1)}
  to{filter:brightness(1.35);box-shadow:0 0 10px var(--race)}
}

/* inactive stays last via existing JS sorting, visually muted */
.playerCard.idle{
  opacity:.43;
  filter:grayscale(.94) saturate(.15);
}
.playerCard.idle .raceText{
  color:#858b92;background:#f0f1f2;
}
.playerCard.idle .portrait:before,
.playerCard.idle .portrait:after{background:#92979d}
.playerCard.missing{opacity:.86}

/* fixed tier rail - keep the version user liked */
.tierRail{
  position:fixed;right:22px;top:50%;transform:translateY(-50%);
  z-index:9000;width:82px;padding:9px 7px 10px;
  border:1px solid rgba(218,221,226,.9);border-radius:22px;
  background:rgba(250,250,251,.86);backdrop-filter:blur(18px);
  box-shadow:0 18px 55px rgba(21,24,30,.13);
}
.tierRailTitle{
  height:25px;display:flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:1000;letter-spacing:1.8px;color:#a1a6ad;
}
.tierJump{
  position:relative;height:30px;margin:2px 0;padding:0 5px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;text-decoration:none;background:transparent;
  color:#666c74;font-size:10px;font-weight:900;transition:.15s;
}
.tierJump:before{
  content:"";position:absolute;left:4px;width:3px;height:3px;
  border-radius:50%;background:#c8ccd2;transition:.15s;
}
.tierJump:hover{background:#eceef1;color:#16181c}
.tierJump.active{
  background:#17191d;color:#fff;
  box-shadow:0 5px 14px rgba(23,25,29,.18);
}
.tierJump.active:before{background:#fff;height:12px;border-radius:3px}
.loading{padding:30px;color:#8c929a}

@media(max-width:950px){
  main{width:calc(100% - 24px)}
  .tierRail{display:none}
  .tier{grid-template-columns:72px 1fr}
}
@media(max-width:700px){
  .tier{display:block}
  .tierLabel{
    height:48px;justify-content:flex-start;padding:0 18px;
  }
  .tierLabel:before{display:none}
  .tierLabel:after{right:18px;left:auto;bottom:22px}
  .members{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px;padding:15px 12px 18px}
}
</style>






</head>
<body>
<nav id="global-navbar" class="globalNav"><div class="globalNavInner"><a class="globalNavBrand" href="index.html">MUJE</a><div class="globalNavLinks"><a class="globalNavLink" href="pubg.html">배틀그라운드</a><a class="globalNavLink active" href="starcraft.html">스타크래프트</a></div></div></nav>
<main>
      <div class="pageTitleWrap">
        <div>
          <h1>스타크래프트 티어표</h1>
          <div class="pageSub">SOOP STARCRAFT TIER BOARD</div>
        </div>
      </div>
      <div id="board" class="board"><div class="loading">티어표 불러오는 중...</div></div>
    </main>
    <aside id="tierRail" class="tierRail">
      <div class="tierRailTitle">TIER</div>
    </aside>

<script>
const TIERS=["갓", "킹", "잭", "조커", "스페이드", "0티어", "1티어", "2티어", "3티어", "4티어", "5티어", "6티어", "7티어", "8티어", "베이비"];
const RACE_ORDER={T:0,Z:1,P:2};
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function flags(x){return Array.isArray(x.status_flags)?x.status_flags:[]}

function fallbackOrImage(x){
  const img=(x.soop_profile_image||'').trim();
  if(!img) return '<div class="blankPortrait" aria-label="프로필 이미지 없음"></div>';
  return `<img class="profileImg" src="${e(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<div class=&quot;blankPortrait&quot;></div>')">`;
}

function universityBadge(x){
  const img=x.university_logo||x.school_logo||'';
  if(!img)return '';
  return `<span class="univBadge" title="${e(x.university_name||x.school_name||'소속')}"><img src="${e(img)}" alt="" onerror="this.parentElement.remove()"></span>`;
}

function cornerBadges(x){
  const f=flags(x),arr=[];
  if(f.includes('up'))arr.push('<span class="stateBadge up">UP</span>');
  if(f.includes('new'))arr.push('<span class="stateBadge new">NEW</span>');
  if(f.includes('repair'))arr.push('<span class="stateBadge repair">REPAIR</span>');
  return arr.length?'<span class="cornerBadges">'+arr.join('')+'</span>':'';
}

function card(x){
  const f=flags(x);
  const cls=['playerCard',x.race||'',f.includes('soon')?'soon':'',f.includes('idle')?'idle':'',x.soop_user_id?'':'missing'].filter(Boolean).join(' ');
  const live=!!(x.live||x.is_live||x.broadcast_live);
  const href=x.soop_user_id?'https://play.sooplive.co.kr/'+encodeURIComponent(x.soop_user_id):'#';
  const name=e(x.display_name||x.soop_nickname||x.player_name);
  return `<a class="${cls}" href="${href}" ${x.soop_user_id?'target="_blank" rel="noopener"':''}>
    <div class="portrait">
      ${fallbackOrImage(x)}
      ${universityBadge(x)}
      ${cornerBadges(x)}
    </div>
    <div class="namePlate">
      ${live?'<span class="liveBadge">LIVE</span>':''}
      <span class="playerName">${name}</span>
      <span class="raceText">${e(String(x.race||'').toUpperCase())}</span>
    </div>
  </a>`;
}

function tierId(t){return 'tier-'+String(t).replace(/[^0-9A-Za-z가-힣]/g,'-')}
function buildRail(){
  tierRail.innerHTML='<div class="tierRailTitle">TIER</div>'+TIERS.map(t=>`<a class="tierJump" href="#${tierId(t)}">${t}</a>`).join('');
}
function setupRailObserver(){
  const links=[...document.querySelectorAll('.tierJump')];
  const sections=[...document.querySelectorAll('.tier')];
  if(!sections.length)return;
  const io=new IntersectionObserver(entries=>{
    const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
    if(!visible)return;
    links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+visible.target.id));
  },{rootMargin:'-35% 0px -50% 0px',threshold:[0,.2,.5,.8]});
  sections.forEach(s=>io.observe(s));
}
async function load(){
  const r=await fetch('/api/star-public',{cache:'no-store'});
  if(!r.ok){board.innerHTML='<div class="loading">티어표 불러오기 실패</div>';return}
  const j=await r.json(),a=j.players||[];
  board.innerHTML=TIERS.map(t=>{
    const p=a.filter(x=>x.tier===t).sort((a,b)=>{
      const ai=flags(a).includes('idle')?1:0;
      const bi=flags(b).includes('idle')?1:0;
      return ai-bi ||
        (RACE_ORDER[a.race]??9)-(RACE_ORDER[b.race]??9) ||
        (Number(a.sort_order||0)-Number(b.sort_order||0));
    });
    return `<div class="tier" id="${tierId(t)}"><div class="tierLabel">${t}</div><div class="members">${p.map(card).join('')}</div></div>`;
  }).join('');
  buildRail();
  setupRailObserver();
}
load();
</script>
<script src="navbar.js"></script>
</body></html>
